<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Баны — Antviz Admin.</title>
<link rel="icon" href="../img/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin-theme.css"/>
<style>
/* Тут — только то, что специфично именно для страницы банов.
   Общие токены/кнопки/бейджи/карточки/модалки/каркас/форма — в /admin-theme.css. */

.page-sub{font-size:.86rem;color:var(--ink-soft);margin-bottom:18px}
.page-sub strong{color:var(--danger);font-weight:700}
</style>
</head>
<body>

<div class="ls" id="loadingScreen"><div class="sp"></div><span class="lt">Загрузка...</span></div>

<div class="pm-ov" id="pmOv" onclick="if(event.target===this)closePromptModal()">
  <div class="pm-card">
    <div class="pm-icon" id="pmIcon"></div>
    <div class="pm-title" id="pmTitle"></div>
    <div class="pm-sub" id="pmSub"></div>
    <div class="pm-actions">
      <button class="btn btn-ghost" onclick="closePromptModal()">Отмена</button>
      <button class="btn" id="pmConfirmBtn">Подтвердить</button>
    </div>
  </div>
</div>

<div class="app" id="appWrap">
  <div class="screen-stack">

    <!-- SCREEN 1: LIST -->
    <div class="screen active" id="screenList">
      <div class="inner" style="max-width:820px">
        <div class="list-head">
          <span class="page-title">Баны</span>
          <div class="page-sub">Забанено сейчас: <strong id="tActive">—</strong> · навсегда: <strong id="tPerm" style="color:var(--ink-soft)">—</strong></div>
          <div class="sb-box" style="max-width:none;margin-bottom:18px">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="searchInp" placeholder="Поиск по имени или email..." oninput="renderList()"/>
          </div>
        </div>
        <div class="list-scroll" id="orderList">
          <div class="empty-l">Загрузка...</div>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: DETAIL -->
    <div class="screen" id="screenDetail">
      <div class="inner" style="max-width:820px">
        <div class="d-topbar">
          <button class="icon-btn exit-btn" onclick="showScreen('list')"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span class="back-label">Выйти</span></button>
        </div>

        <div class="hero">
          <div class="hero-top">
            <div class="hero-left">
              <div class="hero-eyebrow">Пользователь</div>
              <div class="hero-num" id="dId">—</div>
              <div class="hero-name" id="dEmail">—</div>
            </div>
            <div class="hero-right" id="dBadge"></div>
          </div>
        </div>

        <div class="sec" id="curBanSec" style="display:none">
          <div class="sec-h" style="background:rgba(179,38,30,.06)"><div class="sec-h-l"><div class="sec-icon" style="--accent:var(--danger);--accent-bg:rgba(179,38,30,.1)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M4.93 4.93l14.14 14.14"/></svg></div><span class="sec-title" style="color:var(--danger)">Активный бан</span></div></div>
          <div class="sec-b">
            <div class="ig single" id="curBanInfo"></div>
            <div style="margin-top:16px"><button class="btn btn-primary" onclick="unbanUser()"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>Разбанить</button></div>
          </div>
        </div>

        <div class="sec">
          <div class="sec-h"><span class="sec-title" id="banFormTitle">Забанить пользователя</span></div>
          <div class="sec-b">
            <div class="sf">
              <div class="sf-row"><div class="sf-lbl">Причина</div><input class="si" id="banReason" type="text" placeholder="Например: спам в чате поддержки"/></div>
              <div class="sf-row">
                <div class="sf-lbl">Срок</div>
                <div class="chip-row">
                  <button class="chip" onclick="setBanDuration(1,this)">1 день</button>
                  <button class="chip" onclick="setBanDuration(3,this)">3 дня</button>
                  <button class="chip" onclick="setBanDuration(7,this)">7 дней</button>
                  <button class="chip" onclick="setBanDuration(30,this)">30 дней</button>
                  <button class="chip active" onclick="setBanDuration(null,this)">Навсегда</button>
                </div>
              </div>
              <div class="sf-row"><div class="sf-lbl">Забанен до</div><input class="si" id="banUntil" type="date"/><span style="font-size:.76rem;color:var(--ink-soft);margin-top:4px;display:block" id="banUntilHint">Пусто = навсегда</span></div>
              <div class="sf-row" style="flex-direction:row;align-items:center;justify-content:space-between">
                <div class="sf-lbl" style="margin:0">Показывать кнопку на экране бана</div>
                <label class="sw"><input type="checkbox" id="banShowBtn" checked onchange="toggleBanBtnUrl()"/><span class="sw-track"></span></label>
              </div>
              <div class="sf-row" id="banBtnUrlRow">
                <div class="sf-lbl">Текст и ссылка кнопки</div>
                <input class="si" id="banBtnLabel" type="text" placeholder="Написать в поддержку" style="margin-bottom:8px"/>
                <input class="si" id="banBtnUrl" type="text" placeholder="https://t.me/antviz_support"/>
              </div>
            </div>
            <div style="margin-top:18px"><button class="btn btn-primary btn-block" onclick="submitBan()">Забанить</button></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const API = 'https://antviz.ru/api';

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className=`toast ${t} show`;setTimeout(()=>el.className='toast',3400);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(ts){if(!ts)return'—';return new Date(ts).toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'});}
const AVATAR_COLORS=['#3b82f6','#7c3aed','#f5a623','#1a7f3c','#b3261e','#121212'];
function initials(name){const p=String(name||'?').trim().split(/\s+/);return((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'?';}
function avatarColor(seed){let h=0;for(const c of String(seed||''))h=(h*31+c.charCodeAt(0))>>>0;return AVATAR_COLORS[h%AVATAR_COLORS.length];}

window.showScreen=function(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name==='list'?'screenList':'screenDetail').classList.add('active');
};

function openPromptModal({icon,iconBg,iconColor,title,sub,confirmLabel,confirmClass,onConfirm}){
  document.getElementById('pmIcon').style.background=iconBg;
  document.getElementById('pmIcon').style.color=iconColor;
  document.getElementById('pmIcon').innerHTML='<svg viewBox="0 0 24 24">'+icon+'</svg>';
  document.getElementById('pmTitle').textContent=title;
  document.getElementById('pmSub').textContent=sub||'';
  const btn=document.getElementById('pmConfirmBtn');
  btn.className='btn '+(confirmClass||'btn-dark');
  btn.textContent=confirmLabel||'Подтвердить';
  btn.onclick=()=>{closePromptModal();onConfirm();};
  document.getElementById('pmOv').classList.add('show');
}
window.closePromptModal=()=>document.getElementById('pmOv').classList.remove('show');
const ICO_UNBAN='<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/>';

let allUsers=[];
let allBans=new Map();
let selUser=null;

function isBanActive(ban){
  if(!ban)return false;
  if(!ban.until)return true;
  return new Date(ban.until).getTime()>Date.now();
}

function updateStats(){
  let active=0,perm=0;
  allBans.forEach(b=>{if(isBanActive(b)){active++;if(!b.until)perm++;}});
  document.getElementById('tActive').textContent=active;
  document.getElementById('tPerm').textContent=perm;
}

window.renderList=function(){
  const q=(document.getElementById('searchInp').value||'').trim().toLowerCase();
  const list=document.getElementById('orderList');
  if(!q){
    const banned=[...allBans.entries()].filter(([,b])=>isBanActive(b));
    if(!banned.length){list.innerHTML='<div class="empty-l">✅ Сейчас никто не забанен</div>';return;}
    list.innerHTML=banned.map(([uid,b])=>{
      const u=allUsers.find(x=>x.id===uid);
      const label=u?(u.displayName||u.email||uid):uid;
      const email=u?.email||'';
      return `<div class="li-row" onclick="selectUserById('${uid}')">
        <div class="li-avatar" style="background:${avatarColor(email||label)}">${initials(label)}</div>
        <div class="li-body">
          <div class="li-top"><div class="li-name">${esc(label)}</div><span class="badge" style="color:var(--danger);border-color:rgba(179,38,30,.25)">${b.until?'до '+fmtDate(b.until):'навсегда'}</span></div>
          <div class="li-sub">${esc(email)}</div>
        </div>
      </div>`;
    }).join('');
    return;
  }
  const filtered=allUsers.filter(u=>(u.email||'').toLowerCase().includes(q)||(u.displayName||'').toLowerCase().includes(q));
  if(!filtered.length){list.innerHTML='<div class="empty-l">Никого не найдено</div>';return;}
  list.innerHTML=filtered.slice(0,50).map(u=>{
    const b=allBans.get(u.id);
    const banned=isBanActive(b);
    return `<div class="li-row" onclick="selectUserById('${u.id}')">
      <div class="li-avatar" style="background:${avatarColor(u.email||u.displayName)}">${initials(u.displayName)}</div>
      <div class="li-body">
        <div class="li-top"><div class="li-name">${esc(u.displayName||'Без имени')}</div>${banned?'<span class="badge" style="color:var(--danger);border-color:rgba(179,38,30,.25)">забанен</span>':''}</div>
        <div class="li-sub">${esc(u.email||u.id)}</div>
      </div>
    </div>`;
  }).join('');
};

window.selectUserById=function(uid){
  const u=allUsers.find(x=>x.id===uid)||{id:uid,email:uid,displayName:''};
  selUser=u;
  showScreen('detail');
  document.getElementById('dId').textContent=u.displayName||u.email||uid;
  document.getElementById('dEmail').textContent=u.email||'—';
  const ban=allBans.get(uid);
  const active=isBanActive(ban);
  document.getElementById('dBadge').innerHTML=active?'<span class="badge" style="color:var(--danger);border-color:rgba(179,38,30,.3);background:rgba(179,38,30,.1)">🚫 Забанен</span>':'<span class="badge tag-accent">Активен</span>';
  const curSec=document.getElementById('curBanSec');
  if(active){
    curSec.style.display='block';
    document.getElementById('curBanInfo').innerHTML=`
      <div class="ic"><div class="ic-l">Причина</div><div class="ic-v">${esc(ban.reason||'—')}</div></div>
      <div class="ic"><div class="ic-l">Срок</div><div class="ic-v">${ban.until?('до '+fmtDate(ban.until)):'навсегда'}</div></div>
      <div class="ic"><div class="ic-l">Кто забанил</div><div class="ic-v">${esc(ban.bannedBy||'—')}</div></div>`;
    document.getElementById('banFormTitle').textContent='Изменить бан';
  }else{
    curSec.style.display='none';
    document.getElementById('banFormTitle').textContent='Забанить пользователя';
  }
  document.getElementById('banReason').value=active?(ban.reason||''):'';
  document.getElementById('banUntil').value='';
  document.querySelectorAll('.chip-row .chip').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.chip-row .chip')[4].classList.add('active');
  document.getElementById('banUntilHint').textContent='Пусто = навсегда';
  document.getElementById('banShowBtn').checked=active?(ban.showButton!==false):true;
  document.getElementById('banBtnLabel').value=active?(ban.btnLabel||'Написать в поддержку'):'Написать в поддержку';
  document.getElementById('banBtnUrl').value=active?(ban.btnUrl||''):'';
  toggleBanBtnUrl();
};

window.setBanDuration=function(days,btn){
  document.querySelectorAll('.chip-row .chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  const inp=document.getElementById('banUntil');
  if(days===null){inp.value='';document.getElementById('banUntilHint').textContent='Навсегда — до ручного разбана';return;}
  const d=new Date();d.setDate(d.getDate()+days);
  inp.value=d.toISOString().split('T')[0];
  document.getElementById('banUntilHint').textContent='Пусто = навсегда';
};

window.toggleBanBtnUrl=function(){
  document.getElementById('banBtnUrlRow').style.display=document.getElementById('banShowBtn').checked?'block':'none';
};

async function loadBans(){
  try{
    const resp=await fetch(`${API}/bans`,{credentials:'include'});
    const list=resp.ok?await resp.json():[];
    allBans=new Map(list.map(b=>[b.userId,b]));
  }catch(e){ allBans=new Map(); }
  updateStats();renderList();
  if(selUser)selectUserById(selUser.id);
}

window.submitBan=async function(){
  if(!selUser)return;
  const reason=document.getElementById('banReason').value.trim();
  if(!reason){toast('Укажите причину бана','error');return;}
  const untilStr=document.getElementById('banUntil').value;
  const until=untilStr?new Date(untilStr+'T23:59:59').toISOString():null;
  const showButton=document.getElementById('banShowBtn').checked;
  const btnLabel=document.getElementById('banBtnLabel').value.trim()||'Написать в поддержку';
  const btnUrl=document.getElementById('banBtnUrl').value.trim();
  if(showButton&&!btnUrl){toast('Укажите ссылку для кнопки или выключите её','error');return;}
  try{
    const resp=await fetch(`${API}/bans`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:selUser.email,reason,until,showButton,btnLabel,btnUrl})});
    if(!resp.ok){const d=await resp.json().catch(()=>({}));throw new Error(d.error||'Ошибка');}
    toast('Пользователь забанен ✓','success');
    await loadBans();
  }catch(e){toast('Ошибка: '+e.message,'error');}
};

window.unbanUser=async function(){
  if(!selUser)return;
  const u=selUser;
  openPromptModal({
    icon:ICO_UNBAN,iconBg:'var(--green-soft)',iconColor:'var(--green-d)',
    title:'Снять бан?',sub:'Пользователь сразу получит доступ обратно.',
    confirmLabel:'Разбанить',confirmClass:'btn-primary',
    onConfirm:async()=>{
      try{
        const resp=await fetch(`${API}/bans/${u.id}`,{method:'DELETE',credentials:'include'});
        if(!resp.ok) throw new Error();
        toast('Разбанен ✓','success');
        await loadBans();
      }catch(e){toast('Ошибка снятия бана','error');}
    }
  });
};

window.doLogout=async()=>{ try{ await fetch(`${API}/auth/logout`,{method:'POST',credentials:'include'}); }catch(e){} window.location.href='/'; };

(async function initBansPage(){
  let user=null;
  try{ const resp=await fetch(`${API}/auth/me`,{credentials:'include'}); if(resp.ok) user=await resp.json(); }catch(e){}
  if(!user){document.getElementById('loadingScreen').style.display='none';window.location.href='/';return;}
  document.getElementById('loadingScreen').style.display='none';
  if(user.role!=='admin'){window.location.href='/';return;}
  document.getElementById('appWrap').style.display='flex';
  try{
    const resp=await fetch(`${API}/users`,{credentials:'include'});
    allUsers=resp.ok?await resp.json():[];
  }catch(e){toast('Не удалось загрузить пользователей','error');}
  await loadBans();
})();
</script>
<script src="/m-panel26.js"></script>
<script src="../GEOBLOCK.js"></script>
<script src="../maintenance.js"></script>
</body>
</html>
