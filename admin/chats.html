<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Чаты — Antviz Admin.</title>
<link rel="icon" href="../img/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin-theme.css"/>
<style>
/* Тут — только то, что специфично именно для страницы чатов.
   Общие токены/кнопки/бейджи/карточки/модалки/каркас/переписка — в /admin-theme.css. */

.pri-tag{font-size:.72rem;font-weight:600}
.pri-high{color:var(--danger)}
.pri-medium{color:var(--orange-d)}
.pri-low{color:var(--ink-soft)}

/* ===== SCREEN 3 — CREATE (полноэкранная форма) ===== */
#screenCreate .inner{max-width:600px;width:100%;margin:0 auto;padding:0 24px 60px}
.c-body{padding-top:8px}
</style>
</head>
<body>

<div class="ls" id="loadingScreen"><div class="sp"></div><span class="lt">Загрузка...</span></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()"><button class="lb-x" onclick="event.stopPropagation();closeLightbox()">✕</button><img id="lightboxImg" src="" alt=""/></div>

<div class="app" id="appWrap">
  <div class="screen-stack">

    <!-- SCREEN 1: LIST -->
    <div class="screen active" id="screenList">
      <div class="inner">
        <div class="list-head">
          <span class="page-title">Чаты</span>

          <div class="ctrl-row">
            <div class="sb-box">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="text" id="searchInp" placeholder="Поиск по чатам..." oninput="renderList()"/>
            </div>
            <div class="tab-row">
              <button class="tab active" data-f="open" onclick="switchFilter('open',this)">Открытые <span id="cntOpen"></span></button>
              <button class="tab" data-f="done" onclick="switchFilter('done',this)">Закрытые <span id="cntDone"></span></button>
            </div>
            <button class="btn btn-primary" onclick="openCreate()" style="margin-left:auto">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Создать тикет
            </button>
          </div>
        </div>
        <div class="list-scroll" id="ticketsList">
          <div class="empty-l">Загрузка...</div>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: TICKET -->
    <div class="screen" id="screenTicket">
      <div class="inner">
        <div class="d-topbar">
          <button class="icon-btn exit-btn" onclick="showScreen('list')"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span class="back-label">Выйти из чата</span></button>
          <span class="grow"></span>
          <div class="kebab-wrap">
            <button class="icon-btn" onclick="toggleKebab()"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
            <div class="kebab-menu" id="kebabMenu">
              <button class="btn btn-danger btn-block btn-sm" onclick="deleteTicket()">Удалить тикет</button>
            </div>
          </div>
        </div>

        <div class="hero">
          <div class="hero-top">
            <div class="hero-left">
              <div class="hero-eyebrow">Тикет</div>
              <div class="hero-num" id="chatSubject">—</div>
              <div class="hero-name" id="chatMeta"></div>
            </div>
            <div class="hero-right">
              <button class="status-pill open" id="statusToggle" onclick="toggleStatus()"><span class="dot"></span><span id="statusLabel">Открыт</span></button>
            </div>
          </div>
        </div>

        <div class="sec">
          <div class="sec-b">
            <div class="msgs" id="chatMsgs"></div>
            <div class="composer">
              <div class="composer-card">
                <textarea class="composer-ta" id="chatInp" rows="1" placeholder="Введите сообщение..." onkeydown="onKey(event)" oninput="autoResize(this)"></textarea>
                <div class="composer-toolbar">
                  <label class="composer-attach" id="attachBtn" title="Прикрепить изображение">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <input type="file" id="fileInp" accept="image/*" style="display:none" onchange="onChatFilePicked()"/>
                  </label>
                  <span style="flex:1"></span>
                  <button class="composer-send" onclick="sendReply()">Отправить<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCREEN 3: CREATE -->
    <div class="screen" id="screenCreate">
      <div class="inner">
        <div class="d-topbar">
          <button class="icon-btn" onclick="closeCreate()"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
          <span style="font-weight:700;font-size:1.05rem;letter-spacing:-.01em">Создание тикета</span>
        </div>
        <div class="c-body">
          <div class="sf">
            <div class="sf-row"><div class="sf-lbl">Пользователь</div><select class="fsel" id="ticketUser"><option value="">Выберите пользователя...</option></select></div>
            <div class="sf-row"><div class="sf-lbl">Тема обращения</div><input class="si" id="ticketSubject" type="text" placeholder="Кратко опишите проблему..."/></div>
            <div class="sf-row">
              <div class="sf-lbl">Категория</div>
              <div class="chip-row" id="topicChips">
                <button class="chip active" data-v="Техническая проблема" onclick="pickChip('topicChips',this)">Техническая проблема</button>
                <button class="chip" data-v="Вопрос по оплате" onclick="pickChip('topicChips',this)">Оплата</button>
                <button class="chip" data-v="Изменение дизайна" onclick="pickChip('topicChips',this)">Дизайн</button>
                <button class="chip" data-v="Другое" onclick="pickChip('topicChips',this)">Другое</button>
              </div>
            </div>
            <div class="sf-row">
              <div class="sf-lbl">Приоритет</div>
              <div class="chip-row" id="priorityChips">
                <button class="chip" data-v="low" onclick="pickChip('priorityChips',this)">Низкий</button>
                <button class="chip active" data-v="medium" onclick="pickChip('priorityChips',this)">Средний</button>
                <button class="chip" data-v="high" onclick="pickChip('priorityChips',this)">Высокий</button>
              </div>
            </div>
            <div class="sf-row"><div class="sf-lbl">Описание</div><textarea class="textarea" id="ticketMessage" placeholder="Подробно опишите ситуацию..." rows="5"></textarea></div>
            <div class="sf-row">
              <div class="sf-lbl">Вложение <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(необязательно)</span></div>
              <div class="dropzone" id="dropzone" onclick="document.getElementById('ticketFile').click()">
                <svg viewBox="0 0 24 24"><path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
                <div class="dropzone-text">Загрузить файл или перетащите сюда</div>
                <div class="dropzone-sub">PNG, JPG до 4 МБ</div>
                <input type="file" id="ticketFile" accept="image/*" style="display:none" onchange="onTicketFilePicked(this.files[0])"/>
              </div>
              <div id="ticketFilePreview"></div>
            </div>
          </div>
          <div style="margin-top:22px"><button class="btn btn-primary btn-block" onclick="createTicket()">Создать тикет</button></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const API = 'https://antviz.ru/api';

let allTickets=[], selectedId=null, currentFilter='open', ticketFileData=null;
const AVATAR_COLORS=['#3b82f6','#7c3aed','#f5a623','#1a7f3c','#b3261e','#121212'];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className=`toast ${t} show`;setTimeout(()=>el.className='toast',3400);}
function fmtDT(ts){if(!ts)return'—';const d=new Date(ts);return d.toLocaleDateString('ru',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});}
function fmtDTFull(ts){if(!ts)return'—';const d=new Date(ts);return d.toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'});}
function fmtTime(ts){if(!ts)return'';const d=new Date(ts);const now=new Date();if(d>=new Date(now.getFullYear(),now.getMonth(),now.getDate()))return d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('ru',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});}
function initials(name){const p=String(name||'?').trim().split(/\s+/);return((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'?';}
function avatarColor(seed){let h=0;for(const c of String(seed||''))h=(h*31+c.charCodeAt(0))>>>0;return AVATAR_COLORS[h%AVATAR_COLORS.length];}
function priLabel(p){return p==='high'?'<span class="pri-tag pri-high">Высокий</span>':p==='medium'?'<span class="pri-tag pri-medium">Средний</span>':'<span class="pri-tag pri-low">Низкий</span>';}

async function notifyClient(uid,title,text){
  if(!uid)return;
  try{ await fetch(`${API}/notifications/broadcast`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({target:uid,title,text})}); }
  catch(err){console.error('Не удалось уведомить клиента:',err);}
}

window.showScreen=function(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const map={list:'screenList',ticket:'screenTicket',create:'screenCreate'};
  document.getElementById(map[name]).classList.add('active');
  document.getElementById('kebabMenu')?.classList.remove('show');
};
window.toggleKebab=()=>{document.getElementById('kebabMenu').classList.toggle('show');};
document.addEventListener('click',e=>{
  const menu=document.getElementById('kebabMenu');
  if(menu && menu.classList.contains('show') && !menu.contains(e.target) && !e.target.closest('.kebab-wrap .icon-btn')) menu.classList.remove('show');
});
window.pickChip=(rowId,btn)=>{document.querySelectorAll('#'+rowId+' .chip').forEach(c=>c.classList.remove('active'));btn.classList.add('active');};

window.switchFilter=(f,btn)=>{currentFilter=f;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===btn));renderList();};
window.filterList=()=>renderList();

function renderList(){
  const q=(document.getElementById('searchInp').value||'').toLowerCase();
  let list=allTickets.filter(t=>{
    const st=t.status==='done'?'done':'open';
    if(st!==currentFilter)return false;
    if(q)return(t.subject||'').toLowerCase().includes(q)||(t.userName||'').toLowerCase().includes(q)||(t.topic||'').toLowerCase().includes(q);
    return true;
  });
  document.getElementById('cntOpen').textContent=allTickets.filter(t=>t.status!=='done').length;
  document.getElementById('cntDone').textContent=allTickets.filter(t=>t.status==='done').length;
  const openCount=allTickets.filter(t=>t.status!=='done').length;
  const badge=document.getElementById('navBadgeChats');
  if(badge){badge.style.display=openCount?'':'none';badge.textContent=openCount;}
  const el=document.getElementById('ticketsList');
  if(!list.length){el.innerHTML=`<div class="empty-l">${allTickets.length?'Ничего не найдено':'Тикетов пока нет'}</div>`;return;}
  el.innerHTML=list.map(t=>{
    const unread=t.status!=='done'&&!t.adminRead;
    return`<div class="li-row" onclick="selectTicket('${t.id}')">
      <div class="li-avatar" style="background:${avatarColor(t.userEmail||t.userName)}">${initials(t.userName)}</div>
      <div class="li-body">
        <div class="li-top">
          <div class="li-name" style="display:flex;align-items:center;gap:7px;min-width:0">${unread?'<span style="width:6px;height:6px;border-radius:50%;background:var(--danger);flex-shrink:0"></span>':''}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.subject||'Без темы')}</span></div>
          <span class="badge${t.status==='done'?' tag-accent':''}" style="${t.status==='done'?'':'border-color:var(--line)'}">${t.status==='done'?'Закрыт':'Открыт'}</span>
        </div>
        <div class="li-foot">${t.orderLabel?`<span class="badge" style="border-color:transparent;background:var(--info-soft);color:var(--info)">${esc(t.orderLabel)}</span>`:''}<span style="font-size:.76rem;color:var(--ink-soft)">${esc(t.userName||'—')}</span><span style="color:var(--ink-faint)">·</span><span style="font-size:.76rem;color:var(--ink-faint)">${fmtDT(t.updatedAt||t.createdAt)}</span></div>
      </div>
    </div>`;
  }).join('');
}

window.selectTicket=async function(id){
  selectedId=id;
  const ticket=allTickets.find(t=>t.id===id);if(!ticket)return;
  showScreen('ticket');

  document.getElementById('chatSubject').textContent=(`${ticket.topic||''} · ${ticket.subject||''}`).replace(/^ · /,'')||'Без темы';
  document.getElementById('chatMeta').innerHTML=`<span>${esc(ticket.userName||'—')}</span> · <span>${esc(ticket.userEmail||'—')}</span>${ticket.priority?' · '+priLabel(ticket.priority):''}${ticket.orderId?` · <a href="/admin/orders?id=${ticket.orderId}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">${esc(ticket.orderLabel||'заказ')} ↗</a>`:''}`;
  applyStatus(ticket.status);
  document.getElementById('kebabMenu')?.classList.remove('show');

  fetch(`${API}/tickets/${id}/admin-read`,{method:'PATCH',credentials:'include'}).catch(()=>{});
  ticket.adminRead=true;renderList();

  document.getElementById('chatMsgs').innerHTML='<div style="text-align:center;color:var(--ink-soft);font-size:.86rem;padding:36px">Загрузка…</div>';
  try{
    const resp=await fetch(`${API}/tickets/${id}/messages`,{credentials:'include'});
    const msgs=resp.ok?await resp.json():[];
    renderChat(msgs);
    if(msgs.length) ticket._lastMsg=msgs[msgs.length-1].text||'';
    renderList();
  }catch(e){
    document.getElementById('chatMsgs').innerHTML='<div style="text-align:center;color:var(--ink-soft);font-size:.86rem;padding:36px">Не удалось загрузить сообщения</div>';
  }
};

function applyStatus(status){
  const btn=document.getElementById('statusToggle');
  const isDone=status==='done';
  btn.classList.toggle('open',!isDone);
  btn.classList.toggle('done',isDone);
  document.getElementById('statusLabel').textContent=isDone?'Закрыт':'Открыт';
}

function renderChat(msgs){
  const el=document.getElementById('chatMsgs');
  if(!msgs.length){el.innerHTML='<div style="text-align:center;color:var(--ink-soft);font-size:.86rem;padding:36px">Нет сообщений</div>';return;}
  let html='',lastDate=null;
  msgs.forEach(m=>{
    const d=m.createdAt?new Date(m.createdAt):new Date();
    const ds=fmtDTFull(d);
    if(lastDate!==ds){html+=`<div class="msg-divider">${ds}</div>`;lastDate=ds;}
    const isUser=m.sender==='user';
    const tkt=allTickets.find(t=>t.id===selectedId);
    html+=`<div class="msg-wrap${isUser?'':' out'}">
      <div class="msg-label"${isUser?'':' style="text-align:right"'}>${isUser?esc(tkt?.userName||'Клиент'):'Поддержка'}</div>
      <div class="msg ${isUser?'in':'out'}">
        ${esc(m.text)}
        ${m.imageUrl?`<img class="msg-img" src="${m.imageUrl}" alt="" onclick="showLightbox('${m.imageUrl}')"/>`:''}
        <span class="msg-time">${fmtTime(m.createdAt)}</span>
      </div>
    </div>`;
  });
  el.innerHTML=html;el.scrollTop=el.scrollHeight;
}

window.sendReply=async function(){
  if(!selectedId)return;
  const inp=document.getElementById('chatInp');const text=inp.value.trim();
  if(!text)return toast('Напишите сообщение','error');
  inp.value='';inp.style.height='auto';
  try{
    const resp=await fetch(`${API}/tickets/${selectedId}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({text,asAdmin:true})});
    if(!resp.ok) throw new Error('Ошибка отправки');
    const t=allTickets.find(x=>x.id===selectedId);
    if(t){t.status='open';t.adminRead=true;applyStatus('open');}
    const msgsResp=await fetch(`${API}/tickets/${selectedId}/messages`,{credentials:'include'});
    if(msgsResp.ok) renderChat(await msgsResp.json());
    if(t?.uid)await notifyClient(t.uid,'💬 Новый ответ в поддержке',text);
    renderList();
  }catch(e){toast('Ошибка: '+e.message,'error');}
};

window.onChatFilePicked=function(){
  const inp=document.getElementById('fileInp');
  if(inp.files[0])document.getElementById('attachBtn').classList.add('has-file');
  window.sendImg();
};
window.sendImg=async function(){
  if(!selectedId)return;
  const inp=document.getElementById('fileInp');const file=inp.files[0];if(!file){document.getElementById('attachBtn').classList.remove('has-file');return;}
  if(file.size>4*1024*1024){document.getElementById('attachBtn').classList.remove('has-file');return toast('Файл слишком большой (макс. 4 МБ)','error');}
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const resp=await fetch(`${API}/tickets/${selectedId}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({text:'Изображение',imageUrl:e.target.result,asAdmin:true})});
      if(!resp.ok) throw new Error();
      const t=allTickets.find(x=>x.id===selectedId);
      if(t){t.status='open';t.adminRead=true;applyStatus('open');}
      const msgsResp=await fetch(`${API}/tickets/${selectedId}/messages`,{credentials:'include'});
      if(msgsResp.ok) renderChat(await msgsResp.json());
      if(t?.uid)await notifyClient(t.uid,'💬 Новый ответ в поддержке','Вам отправили изображение');
      toast('Изображение отправлено ✓','success');
      renderList();
    }catch(e){toast('Ошибка','error');}
    inp.value='';document.getElementById('attachBtn').classList.remove('has-file');
  };
  reader.readAsDataURL(file);
};

window.toggleStatus=async function(){
  if(!selectedId)return;
  const t=allTickets.find(x=>x.id===selectedId);if(!t)return;
  const next=t.status==='done'?'open':'done';
  try{
    const resp=await fetch(`${API}/tickets/${selectedId}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({status:next})});
    if(!resp.ok) throw new Error();
    t.status=next;applyStatus(next);
    toast(next==='done'?'Тикет закрыт ✓':'Тикет снова открыт ✓','success');
    renderList();
  }catch(e){toast('Ошибка','error');}
};

window.deleteTicket=async function(){
  if(!selectedId||!confirm('Удалить тикет и все сообщения?'))return;
  try{
    const resp=await fetch(`${API}/tickets/${selectedId}`,{method:'DELETE',credentials:'include'});
    if(!resp.ok) throw new Error();
    allTickets=allTickets.filter(t=>t.id!==selectedId);
    toast('Тикет удалён','info');selectedId=null;
    showScreen('list');renderList();
  }catch(e){toast('Ошибка','error');}
};

window.openCreate=async function(){
  showScreen('create');
  try{
    const resp=await fetch(`${API}/users`,{credentials:'include'});
    if(!resp.ok) throw new Error();
    const users=await resp.json();
    const sel=document.getElementById('ticketUser');
    sel.innerHTML='<option value="">Выберите пользователя...</option>';
    users.forEach(u=>{sel.innerHTML+=`<option value="${u.id}">${esc(u.displayName||u.id)}${u.email?' · '+esc(u.email):''}</option>`;});
    document.getElementById('ticketSubject').value='';
    document.getElementById('ticketMessage').value='';
    document.querySelectorAll('#topicChips .chip').forEach((c,i)=>c.classList.toggle('active',i===0));
    document.querySelectorAll('#priorityChips .chip').forEach(c=>c.classList.toggle('active',c.dataset.v==='medium'));
    ticketFileData=null;
    document.getElementById('ticketFilePreview').innerHTML='';
    document.getElementById('dropzone').style.display='flex';
  }catch(e){toast('Ошибка загрузки пользователей: '+e.message,'error');}
};
window.closeCreate=function(){showScreen('list');};

window.onTicketFilePicked=function(file){
  if(!file)return;
  if(file.size>4*1024*1024){toast('Файл слишком большой (макс. 4 МБ)','error');return;}
  const reader=new FileReader();
  reader.onload=e=>{
    ticketFileData=e.target.result;
    document.getElementById('dropzone').style.display='none';
    document.getElementById('ticketFilePreview').innerHTML=`<div class="dz-file"><img src="${ticketFileData}"/><span class="name">${esc(file.name)}</span><button class="rm" type="button" onclick="clearTicketFile()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`;
  };
  reader.readAsDataURL(file);
};
window.clearTicketFile=function(){ticketFileData=null;document.getElementById('ticketFile').value='';document.getElementById('ticketFilePreview').innerHTML='';document.getElementById('dropzone').style.display='flex';};

document.addEventListener('DOMContentLoaded',()=>{
  const dz=document.getElementById('dropzone');
  if(dz){
    ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
    dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)window.onTicketFilePicked(f);});
  }
});

window.createTicket=async function(){
  const uid=document.getElementById('ticketUser').value;
  const topicBtn=document.querySelector('#topicChips .chip.active');
  const priBtn=document.querySelector('#priorityChips .chip.active');
  const topic=topicBtn?topicBtn.dataset.v:'Общий вопрос';
  const priority=priBtn?priBtn.dataset.v:'medium';
  const subject=document.getElementById('ticketSubject').value.trim();
  const message=document.getElementById('ticketMessage').value.trim();
  if(!uid)return toast('Выберите пользователя','error');
  if(!subject)return toast('Введите тему обращения','error');
  if(!message)return toast('Введите описание','error');
  try{
    const resp=await fetch(`${API}/tickets/admin/create`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({userId:uid,topic,subject,message,priority})});
    if(!resp.ok){const d=await resp.json().catch(()=>({}));throw new Error(d.error||'Ошибка');}
    const ticket=await resp.json();
    if(ticketFileData){
      try{ await fetch(`${API}/tickets/${ticket.id}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({text:'Вложение',imageUrl:ticketFileData,asAdmin:true})}); }
      catch(e){console.error('Не удалось прикрепить файл:',e);}
    }
    allTickets=[ticket,...allTickets];renderList();
    await notifyClient(uid,'💬 Новый тикет от поддержки',`Сотрудник службы поддержки создал тикет «${subject}». Перейдите в раздел «Чат с командой».`);
    toast('Тикет создан и пользователь уведомлён ✅','success');
    showScreen('list');
  }catch(e){toast('Ошибка: '+e.message,'error');}
};

window.onKey=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();window.sendReply();}};
window.autoResize=function(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px';};
window.showLightbox=function(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('show');};
window.closeLightbox=()=>document.getElementById('lightbox').classList.remove('show');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
window.doLogout=async()=>{ try{ await fetch(`${API}/auth/logout`,{method:'POST',credentials:'include'}); }catch(e){} window.location.href='/'; };

async function loadTicketsList(){
  try{
    const resp=await fetch(`${API}/tickets/admin/all`,{credentials:'include'});
    if(!resp.ok) return;
    const incoming=await resp.json();
    incoming.forEach(t=>{const old=allTickets.find(x=>x.id===t.id);t._lastMsg=old?._lastMsg;});
    allTickets=incoming;renderList();
  }catch(e){console.error('loadTicketsList:',e);}
}

(async function initAdminChats(){
  let user=null;
  try{ const resp=await fetch(`${API}/auth/me`,{credentials:'include'}); if(resp.ok) user=await resp.json(); }catch(e){}
  if(!user){document.getElementById('loadingScreen').style.display='none';window.location.href='/';return;}
  document.getElementById('loadingScreen').style.display='none';
  if(user.role!=='admin'){window.location.href='/';return;}
  document.getElementById('appWrap').style.display='flex';

  fetch(`${API}/orders/admin/all`,{credentials:'include'}).then(r=>r.ok?r.json():[]).then(orders=>{
    const n=orders.filter(o=>o.refundStatus==='requested').length;
    const b=document.getElementById('navBadgeOrders');
    if(b){b.style.display=n?'':'none';b.textContent=n;}
  }).catch(()=>{});

  await loadTicketsList();
  setInterval(loadTicketsList,15000);

  let _lastChatSig=null;
  setInterval(async()=>{
    if(!selectedId)return;
    try{
      const resp=await fetch(`${API}/tickets/${selectedId}/messages`,{credentials:'include'});
      if(!resp.ok) return;
      const msgs=await resp.json();
      const sig=msgs.length+':'+(msgs[msgs.length-1]?.id||'');
      if(sig===_lastChatSig) return;
      _lastChatSig=sig;
      renderChat(msgs);
    }catch(e){}
  },5000);
})();
</script>
