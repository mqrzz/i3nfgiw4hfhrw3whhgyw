<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Крупные проекты — Antviz Admin</title>
<link rel="icon" href="../img/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f3f4f7}
:root{
  --green:#1ede7b;--green-h:#17c96a;--green-d:#0f9950;--green-soft:#e5faee;
  --orange:#f59e0b;--orange-d:#b8720a;--orange-soft:#fef2e0;
  --red:#e8634f;--red-soft:#fdeae7;--info:#3b82f6;--info-soft:#eaf2fe;--purple:#7c3aed;--purple-soft:#f0eafd;
  --bg:#f3f4f7;--card:#ffffff;
  --text:#14171c;--muted:#818997;--muted2:#aeb4bf;--line:#e6e8ec;--line2:#dcdfe4;
  --dark:#14171c;
  --font:'Geologica','Inter',sans-serif;
  --r-xs:10px;--r-sm:14px;--r-md:18px;--r-lg:22px;--r-xl:28px;--r-pill:999px;
  --sh-md:0 12px 28px rgba(20,23,30,.09),0 2px 8px rgba(20,23,30,.05);
  --sh-lg:0 28px 64px rgba(20,23,30,.16),0 8px 20px rgba(20,23,30,.07);
  --maxw:1160px;
}
body{color:var(--text);font-family:var(--font);font-weight:300;font-size:15.5px;-webkit-font-smoothing:antialiased}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

.ls{position:fixed;inset:0;z-index:9000;background:var(--dark);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.sp{width:26px;height:26px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
.lt{font-size:13px;color:rgba(255,255,255,.35)}

.page{display:none;min-height:100vh;overflow-y:auto}
.inner{max-width:var(--maxw);width:100%;margin:0 auto;padding:36px 28px 60px}

.hero{background:var(--dark);border-radius:var(--r-xl);padding:32px 36px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-100px;right:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(30,222,123,.16),transparent 70%);pointer-events:none}
.hero-text{position:relative;z-index:1}
.hero-text h1{font-size:1.6rem;font-weight:500;color:#fff;letter-spacing:-.02em;margin-bottom:6px}
.hero-text p{font-size:.88rem;color:rgba(255,255,255,.42)}

.ctrl-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tab-row{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-pill);padding:.55rem 1rem;font-family:var(--font);font-size:.83rem;font-weight:400;color:var(--muted);cursor:pointer;transition:all .12s;white-space:nowrap}
.tab:hover{border-color:var(--muted2);color:var(--text)}
.tab.active{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:500}

.sec{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:11px 22px;text-align:left;border-bottom:1px solid var(--line);background:var(--bg)}
.tbl td{padding:14px 22px;font-size:.86rem;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg);cursor:pointer}

.badge{display:inline-flex;align-items:center;gap:5px;padding:.24rem .65rem;border-radius:var(--r-pill);font-size:.7rem;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.b-new{background:var(--info-soft);color:var(--info)}
.b-in_progress{background:var(--orange-soft);color:var(--orange-d)}
.b-done{background:var(--green-soft);color:var(--green-d)}
.b-declined{background:var(--red-soft);color:var(--red)}

.empty{padding:64px 24px;text-align:center;color:var(--muted);font-size:.9rem}

.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font);font-weight:500;font-size:.85rem;border:none;border-radius:var(--r-sm);padding:.7rem 1.2rem;cursor:pointer;transition:background .15s,transform .1s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-green{background:var(--green);color:var(--dark)}.btn-green:hover{background:var(--green-h)}
.btn-dark{background:var(--dark);color:#fff}.btn-dark:hover{background:#2b2f33}
.btn-outline{background:var(--card);border:1.5px solid var(--line2);color:var(--muted)}.btn-outline:hover{border-color:var(--muted2);color:var(--text)}
.btn-danger{background:var(--red-soft);color:var(--red)}.btn-danger:hover{background:#fbdbd6}
.btn-sm{padding:.5rem 1rem;font-size:.8rem}

.modal-ov{position:fixed;inset:0;z-index:500;background:rgba(10,12,16,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-ov.show{opacity:1;pointer-events:all}
.modal{background:var(--card);border-radius:var(--r-xl);padding:28px;width:100%;max-width:560px;max-height:86vh;overflow-y:auto;box-shadow:var(--sh-lg)}
.modal-title{font-weight:500;font-size:1.05rem;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.01em}
.mc{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-xs);transition:background .15s}
.mc:hover{background:var(--bg)}
.fg{margin-bottom:14px}
.fl{display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px;font-weight:500}
.fi,.fsel,.fta{width:100%;background:var(--bg);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:.8rem 1rem;color:var(--text);font-family:var(--font);font-size:.9rem;font-weight:300;outline:none;transition:border-color .15s}
.fi:focus,.fsel:focus,.fta:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(30,222,123,.1)}
.fsel{cursor:pointer}
.fta{resize:vertical;min-height:80px;line-height:1.5;font-family:var(--font)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{display:flex;gap:8px;margin-top:22px}
.mf .btn{flex:1;justify-content:center}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.dk{background:var(--bg);border-radius:var(--r-sm);padding:10px 13px}
.dk-l{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px;font-weight:500}
.dk-v{font-size:.86rem;color:var(--text)}

.toast{position:fixed;bottom:28px;right:28px;z-index:900;padding:.8rem 1.5rem;border-radius:var(--r-md);font-size:.86rem;font-weight:500;opacity:0;box-shadow:var(--sh-lg);transition:opacity .2s,transform .2s;pointer-events:none;transform:translateY(8px)}
.toast.show{opacity:1;transform:none}
.toast.success{background:var(--green);color:#0d3320}.toast.error{background:var(--red);color:#fff}.toast.info{background:var(--dark);color:#fff}

@media(max-width:760px){
  .inner{padding:70px 16px 40px}
  .hero{padding:24px 20px}
  .hero-text h1{font-size:1.3rem}
  .frow,.detail-grid{grid-template-columns:1fr}
  .tbl th:nth-child(4),.tbl td:nth-child(4),.tbl th:nth-child(5),.tbl td:nth-child(5){display:none}
}
</style>
</head>
<body>

<div class="ls" id="loadingScreen"><div class="sp"></div><span class="lt">Загрузка...</span></div>
<div class="page" id="appWrap">
  <div class="inner">
    <div class="hero">
      <div class="hero-text"><h1>Крупные проекты</h1><p>Новых заявок: <strong id="newCount" style="color:var(--green)">—</strong></p></div>
    </div>

    <div class="ctrl-row">
      <div class="tab-row">
        <button class="tab active" onclick="switchFilter('all',this)">Все</button>
        <button class="tab" onclick="switchFilter('new',this)">Новые</button>
        <button class="tab" onclick="switchFilter('in_progress',this)">В работе</button>
        <button class="tab" onclick="switchFilter('done',this)">Готово</button>
        <button class="tab" onclick="switchFilter('declined',this)">Отклонено</button>
      </div>
    </div>

    <div class="sec">
      <table class="tbl">
        <thead><tr><th>Имя / компания</th><th>Telegram</th><th>Свой сервер</th><th>РФ</th><th>Дата</th><th>Статус</th></tr></thead>
        <tbody id="appsBody"><tr><td colspan="6" class="empty">Загрузка...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">Заявка <button class="mc" onclick="closeModal()">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
const API = 'https://antviz.ru/api';

let allApps=[], currentFilter='all', currentApp=null;
function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className=`toast ${t} show`;setTimeout(()=>el.className='toast',3400);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(ts){if(!ts)return'—';return new Date(ts).toLocaleDateString('ru',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
const STATUS_LABEL={new:'Новая',in_progress:'В работе',done:'Готово',declined:'Отклонено'};
const RF_LABEL={yes:'Только РФ',no:'Не нужна',no_matter:'Неважно'};

window.switchFilter=(f,btn)=>{currentFilter=f;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderApps();};
window.closeModal=()=>{document.getElementById('modal').classList.remove('show');currentApp=null;};

function renderApps(){
  const tbody=document.getElementById('appsBody');
  let list=allApps;
  if(currentFilter!=='all') list=list.filter(a=>a.status===currentFilter);
  document.getElementById('newCount').textContent=allApps.filter(a=>a.status==='new').length;
  if(!list.length){tbody.innerHTML=`<tr><td colspan="6" class="empty">Нет заявок</td></tr>`;return;}
  tbody.innerHTML=list.map(a=>`
    <tr onclick="window.openApp('${a.id}')">
      <td><b>${esc(a.name)}</b>${a.company?`<br><span style="color:var(--muted);font-size:.78rem">${esc(a.company)}</span>`:''}</td>
      <td>${esc(a.telegramUsername)}</td>
      <td>${a.ownServer?'Да':'Нет'}</td>
      <td>${RF_LABEL[a.serversInRf]||'—'}</td>
      <td style="color:var(--muted);font-size:.8rem">${fmtDate(a.createdAt)}</td>
      <td><span class="badge b-${a.status}">${STATUS_LABEL[a.status]||a.status}</span></td>
    </tr>`).join('');
}

window.openApp=(id)=>{
  const a = allApps.find(x=>x.id===id);
  if(!a) return;
  currentApp = a;
  document.getElementById('modalBody').innerHTML = `
    <div class="detail-grid">
      <div class="dk"><div class="dk-l">Имя</div><div class="dk-v">${esc(a.name)}${a.company?' · '+esc(a.company):''}</div></div>
      <div class="dk"><div class="dk-l">Telegram</div><div class="dk-v">${esc(a.telegramUsername)}</div></div>
      <div class="dk"><div class="dk-l">Email</div><div class="dk-v">${esc(a.email)}</div></div>
      <div class="dk"><div class="dk-l">Телефон</div><div class="dk-v">${esc(a.phone)||'—'}</div></div>
      <div class="dk"><div class="dk-l">Свой сервер</div><div class="dk-v">${a.ownServer?'Да':'Нет'}</div></div>
      <div class="dk"><div class="dk-l">Серверы в РФ</div><div class="dk-v">${RF_LABEL[a.serversInRf]||'—'}</div></div>
      <div class="dk"><div class="dk-l">Свои лимиты</div><div class="dk-v">${a.customLimits?'Да':'Нет'}</div></div>
      <div class="dk"><div class="dk-l">Тип проекта</div><div class="dk-v">${esc(a.projectType)||'—'}</div></div>
      <div class="dk"><div class="dk-l">Нагрузка</div><div class="dk-v">${esc(a.expectedLoad)||'—'}</div></div>
      <div class="dk"><div class="dk-l">Бюджет / сроки</div><div class="dk-v">${esc(a.budget)||'—'} · ${esc(a.timeline)||'—'}</div></div>
    </div>
    <div class="fg"><label class="fl">Описание проекта</label><div class="dk" style="white-space:pre-wrap">${esc(a.description)}</div></div>
    <div class="frow">
      <div class="fg"><label class="fl">Статус</label>
        <select class="fsel" id="mStatus">
          ${Object.entries(STATUS_LABEL).map(([v,l])=>`<option value="${v}" ${a.status===v?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="fg"><label class="fl">Внутренние заметки</label><textarea class="fta" id="mNotes" placeholder="Не видно клиенту">${esc(a.adminNotes)||''}</textarea></div>
    <div class="mf">
      <button class="btn btn-danger" onclick="window.deleteApp('${a.id}')">Удалить</button>
      <button class="btn btn-green" onclick="window.saveApp('${a.id}')">Сохранить</button>
    </div>
  `;
  document.getElementById('modal').classList.add('show');
};

window.saveApp=async(id)=>{
  try{
    const resp = await fetch(`${API}/enterprise/${id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ status: document.getElementById('mStatus').value, adminNotes: document.getElementById('mNotes').value }),
    });
    if(!resp.ok) throw new Error();
    toast('Сохранено ✓','success'); closeModal(); await loadApps(); renderApps();
  }catch(e){ toast('Ошибка сохранения','error'); }
};
window.deleteApp=async(id)=>{
  if(!confirm('Удалить заявку без возможности восстановления?'))return;
  try{
    const resp = await fetch(`${API}/enterprise/${id}`, { method:'DELETE', credentials:'include' });
    if(!resp.ok) throw new Error();
    toast('Удалена','info'); closeModal(); await loadApps(); renderApps();
  }catch(e){ toast('Ошибка удаления','error'); }
};

async function loadApps(){
  try{
    const resp = await fetch(`${API}/enterprise/admin/all`, { credentials:'include' });
    allApps = resp.ok ? await resp.json() : [];
  }catch(e){ allApps=[]; }
}

window.doLogout=async()=>{
  try{ await fetch(`${API}/auth/logout`, { method:'POST', credentials:'include' }); }catch(e){}
  window.location.href='/';
};

(async function initPage(){
  let user = null;
  try{
    const resp = await fetch(`${API}/auth/me`, { credentials:'include' });
    if(resp.ok) user = await resp.json();
  }catch(e){}

  if(!user){document.getElementById('loadingScreen').style.display='none';window.location.href='/';return;}
  document.getElementById('loadingScreen').style.display='none';
  if(user.role!=='admin'){window.location.href='/';return;}
  document.getElementById('appWrap').style.display='block';

  await loadApps(); renderApps();
  const n = allApps.filter(a=>a.status==='new').length;
  const b = document.getElementById('navBadgeEnterprise');
  if(b){ b.style.display=n?'':'none'; b.textContent=n; }
})();
</script>
<script src="/m-panel26.js"></script>
<script src="../GEOBLOCK.js"></script>
<script src="../maintenance.js"></script>
</body>
</html>
