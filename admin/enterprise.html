<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Крупные проекты — Antviz Admin</title>
<link rel="icon" href="../img/favicon.png"/>
<script>
  try{ var t = localStorage.getItem('antviz-theme'); if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/profile/assets/cabinet-base.css?v=1">
<link rel="stylesheet" href="/profile/assets/cabinet.css?v=3">
<link rel="stylesheet" href="/profile/assets/admin-extra.css?v=1">
</head>
<body>

<div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>
<div id="sbContent" style="display:none">
  <div class="shell">
    <div class="cab-page">
      <div class="pg-head">
        <div class="pg-head-main">
          <div class="pg-title">Крупные проекты</div>
          <div class="pg-sub">Новых заявок: <b id="newCount" style="color:var(--green-text)">—</b></div>
        </div>
      </div>

      <div class="cab-toolbar">
        <div class="cab-tabs" id="tabRow">
          <button class="cab-tab is-active" onclick="switchFilter('all',this)">Все</button>
          <button class="cab-tab" onclick="switchFilter('new',this)">Новые</button>
          <button class="cab-tab" onclick="switchFilter('in_progress',this)">В работе</button>
          <button class="cab-tab" onclick="switchFilter('done',this)">Готово</button>
          <button class="cab-tab" onclick="switchFilter('declined',this)">Отклонено</button>
        </div>
      </div>

      <div class="adm-table-wrap adm-table-scroll">
        <table class="adm-table">
          <thead><tr><th>Имя / компания</th><th>Telegram</th><th>Свой сервер</th><th>РФ</th><th>Дата</th><th>Статус</th></tr></thead>
          <tbody id="appsBody"><tr><td colspan="6"><div class="cab-empty"><h3>Загрузка…</h3></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="cab-modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="cab-modal" style="max-width:560px;max-height:86vh;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h3 style="margin:0">Заявка</h3>
      <button class="cab-btn ghost sm" onclick="closeModal()" style="padding:8px">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
const API = 'https://antviz.ru/api';

let allApps=[], currentFilter='all', currentApp=null;
function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className=`toast ${t} show`;setTimeout(()=>el.className='toast',3400);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(ts){if(!ts)return'—';return new Date(ts).toLocaleDateString('ru',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
const STATUS_LABEL={new:'Новая',in_progress:'В работе',done:'Готово',declined:'Отклонено'};
const STATUS_COLOR={new:'blue',in_progress:'amber',done:'green',declined:'red'};
const RF_LABEL={yes:'Только РФ',no:'Не нужна',no_matter:'Неважно'};

window.switchFilter=(f,btn)=>{currentFilter=f;document.querySelectorAll('#tabRow .cab-tab').forEach(b=>b.classList.remove('is-active'));btn.classList.add('is-active');renderApps();};
window.closeModal=()=>{document.getElementById('modal').classList.remove('show');currentApp=null;};

function renderApps(){
  const tbody=document.getElementById('appsBody');
  let list=allApps;
  if(currentFilter!=='all') list=list.filter(a=>a.status===currentFilter);
  document.getElementById('newCount').textContent=allApps.filter(a=>a.status==='new').length;
  if(!list.length){tbody.innerHTML=`<tr><td colspan="6"><div class="cab-empty"><h3>Нет заявок</h3></div></td></tr>`;return;}
  tbody.innerHTML=list.map(a=>`
    <tr class="is-clickable" onclick="window.openApp('${a.id}')">
      <td><b>${esc(a.name)}</b>${a.company?`<small>${esc(a.company)}</small>`:''}</td>
      <td>${esc(a.telegramUsername)}</td>
      <td>${a.ownServer?'Да':'Нет'}</td>
      <td>${RF_LABEL[a.serversInRf]||'—'}</td>
      <td><small>${fmtDate(a.createdAt)}</small></td>
      <td><span class="cab-badge ${STATUS_COLOR[a.status]||''}">${STATUS_LABEL[a.status]||a.status}</span></td>
    </tr>`).join('');
}

window.openApp=(id)=>{
  const a = allApps.find(x=>x.id===id);
  if(!a) return;
  currentApp = a;
  document.getElementById('modalBody').innerHTML = `
    <div class="dk-grid">
      <div class="dk"><div class="dk-l">Имя</div><div class="dk-v">${esc(a.name)}${a.company?' · '+esc(a.company):''}</div></div>
      <div class="dk"><div class="dk-l">Telegram</div><div class="dk-v">${esc(a.telegramUsername)}</div></div>
      <div class="dk"><div class="dk-l">Email</div><div class="dk-v">${esc(a.email)}</div></div>
      <div class="dk"><div class="dk-l">Телефон</div><div class="dk-v">${esc(a.phone)||'—'}</div></div>
      <div class="dk"><div class="dk-l">Свой сервер</div><div class="dk-v">${a.ownServer?'Да':'Нет'}</div></div>
      <div class="dk"><div class="dk-l">Серверы в РФ</div><div class="dk-v">${RF_LABEL[a.serversInRf]||'—'}</div></div>
      <div class="dk"><div class="dk-l">Свои лимиты</div><div class="dk-v">${a.customLimits?'Да':'Нет'}</div></div>
      <div class="dk"><div class="dk-l">Тип проекта</div><div class="dk-v">${esc(a.projectType)||'—'}</div></div>
      <div class="dk"><div class="dk-l">Нагрузка</div><div class="dk-v">${esc(a.expectedLoad)||'—'}</div></div>
      <div class="dk"><div class="dk-l">Бюджет / сроки</div><div class="dk-v">${esc(a.budget)||'—'} · ${esc(a.timeline)||'—'}</div></div>
    </div>
    <div class="cab-field" style="margin-bottom:14px"><label class="cab-label">Описание проекта</label><div class="dk" style="white-space:pre-wrap">${esc(a.description)}</div></div>
    <div class="cab-field" style="margin-bottom:14px">
      <label class="cab-label">Статус</label>
      <select class="cab-select" id="mStatus">
        ${Object.entries(STATUS_LABEL).map(([v,l])=>`<option value="${v}" ${a.status===v?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="cab-field" style="margin-bottom:14px"><label class="cab-label">Внутренние заметки</label><textarea class="cab-textarea" id="mNotes" style="min-height:90px" placeholder="Не видно клиенту">${esc(a.adminNotes)||''}</textarea></div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="cab-btn danger" style="flex:1;justify-content:center" onclick="window.deleteApp('${a.id}')">Удалить</button>
      <button class="cab-btn primary" style="flex:1;justify-content:center" onclick="window.saveApp('${a.id}')">Сохранить</button>
    </div>
  `;
  document.getElementById('modal').classList.add('show');
};

window.saveApp=async(id)=>{
  try{
    const resp = await fetch(`${API}/enterprise/${id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ status: document.getElementById('mStatus').value, adminNotes: document.getElementById('mNotes').value }),
    });
    if(!resp.ok) throw new Error();
    toast('Сохранено ✓','success'); closeModal(); await loadApps(); renderApps();
  }catch(e){ toast('Ошибка сохранения','error'); }
};
window.deleteApp=async(id)=>{
  if(!confirm('Удалить заявку без возможности восстановления?'))return;
  try{
    const resp = await fetch(`${API}/enterprise/${id}`, { method:'DELETE', credentials:'include' });
    if(!resp.ok) throw new Error();
    toast('Удалена','info'); closeModal(); await loadApps(); renderApps();
  }catch(e){ toast('Ошибка удаления','error'); }
};

async function loadApps(){
  try{
    const resp = await fetch(`${API}/enterprise/admin/all`, { credentials:'include' });
    allApps = resp.ok ? await resp.json() : [];
  }catch(e){ allApps=[]; }
}

window.doLogout=async()=>{
  try{ await fetch(`${API}/auth/logout`, { method:'POST', credentials:'include' }); }catch(e){}
  window.location.href='/';
};

(async function initPage(){
  let user = null;
  try{
    const resp = await fetch(`${API}/auth/me`, { credentials:'include' });
    if(resp.ok) user = await resp.json();
  }catch(e){}

  if(!user){document.getElementById('loadingScreen').style.display='none';window.location.href='/';return;}
  document.getElementById('loadingScreen').style.display='none';
  if(user.role!=='admin'){window.location.href='/';return;}
  document.getElementById('sbContent').style.display='block';

  await loadApps(); renderApps();
  const n = allApps.filter(a=>a.status==='new').length;
  const b = document.getElementById('navBadgeEnterprise');
  if(b){ b.style.display=n?'':'none'; b.textContent=n; }
})();
</script>
<script src="/profile/assets/admin-shell.js" data-page="enterprise" data-title="Крупные проекты"></script>
<script src="../GEOBLOCK.js"></script>
<script src="../maintenance.js"></script>
</body>
</html>
