:root{--blue:#06f;--b2:#99c2ff;--b1:#dce9ff;--ink:#0b0b0d;--gray:#6e6a70;--sf:#f2f2f4;--line:#0b0b0d1a;--ok:#0a9a4a;--bad:#d6334a;--display:Unbounded,"Golos Text",system-ui,sans-serif;--sans:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--sf);color:var(--ink);font:17px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.05em;margin:0}
.lg{display:flex;align-items:center;gap:10px;font:800 21px var(--display);letter-spacing:-.05em}.lg svg{width:32px;height:32px;fill:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:18px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;transition:filter .2s}
.btn:hover{filter:brightness(1.1)}.btn.g{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}.btn.g:hover{background:var(--b1);filter:none}.btn.sm{height:42px;padding:0 16px;font-size:15px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:default}
/* вход */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(60% 70% at 85% 10%,#b9d3ff,#0000 70%),linear-gradient(#fff,#f6f9ff)}
.card{background:#fff;border-radius:32px;box-shadow:0 0 0 1px var(--line);padding:30px}
.login .card{width:min(460px,100%);padding:36px;box-shadow:0 30px 80px #0b0b0d1f,0 0 0 1px var(--line)}
.login h1{font-size:30px;margin:18px 0 8px}.login p{color:var(--gray);margin:0 0 22px}
.inp{width:100%;height:58px;border-radius:18px;border:0;background:var(--sf);padding:0 18px;font-size:18px;font-weight:600;outline:2px solid transparent}.inp:focus{outline-color:var(--blue)}
.err{min-height:22px;margin:12px 0 0;color:var(--bad);font-size:15px;font-weight:600}
.codes{display:flex;gap:8px}.codes input{flex:1;min-width:0;height:64px;text-align:center;border-radius:16px;border:0;background:var(--sf);font:800 26px var(--display);outline:2px solid transparent}.codes input:focus{outline-color:var(--blue)}
/* приложение */
.app{display:none;min-height:100vh}.app.on{display:grid;grid-template-columns:270px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;padding:22px 18px;display:flex;flex-direction:column;gap:6px;background:#fff;box-shadow:1px 0 0 var(--line)}
.side .lg{padding:4px 10px 18px}
.nav{display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;border-radius:18px;font-weight:700;color:#3a373b;text-align:left;width:100%;transition:background .2s}
.nav:hover{background:var(--sf)}.nav.on{background:var(--b1);color:var(--blue)}
.side .sp{flex:1}.user{padding:14px 12px;font-size:15px;color:var(--gray)}
.main{padding:clamp(18px,3vw,40px);max-width:1400px;width:100%;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.head h1{font-size:clamp(28px,3.4vw,44px)}.head p{margin:6px 0 0;color:var(--gray)}
.seg{display:flex;gap:6px;padding:6px;background:#fff;border-radius:20px;box-shadow:0 0 0 1px var(--line)}
.seg button{height:44px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;color:#3a373b;white-space:nowrap}.seg button.on{background:var(--ink);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:24px}.kpi small{display:block;font-size:15px;font-weight:600;color:var(--gray)}
.kpi b{display:block;font:800 clamp(32px,3.4vw,46px)/1 var(--display);letter-spacing:-.06em;margin:12px 0 10px}
.dl{font-weight:700;font-size:15px}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}.dl.flat{color:var(--gray)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.card h3{font-size:20px;margin-bottom:18px}
.chart{display:flex;align-items:flex-end;gap:8px;height:260px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.col i{display:block;width:100%;border-radius:10px;background:var(--b2);min-height:4px;transition:height .6s var(--ease),background .2s}
.col:hover i{background:var(--blue)}.col.today i{background:var(--blue)}
.col small{font-size:13px;color:var(--gray);font-weight:600;white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:14px}
.row .t{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:16px;margin-bottom:8px}.row .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t b{font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--sf);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--blue);transition:width .6s var(--ease)}
.dev{display:flex;height:18px;border-radius:9px;overflow:hidden;margin-bottom:16px;background:var(--sf)}.dev i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:600;font-size:15px}.leg span{display:flex;gap:8px;align-items:center}.leg em{width:12px;height:12px;border-radius:4px;display:inline-block}
.tbl{width:100%;border-collapse:collapse;font-size:16px}.tbl th{text-align:left;font-size:14px;color:var(--gray);font-weight:600;padding:0 12px 12px}.tbl td{padding:16px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}.tbl .nm{font-weight:700}.tbl .sl{color:var(--gray);font-size:14px}
.code{font:800 17px var(--display);letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:12px;font-weight:700;font-size:14px;background:var(--sf)}.chip.ok{background:#dcf6e7;color:#067a3a}.chip.wait{background:var(--b1);color:var(--blue)}
.empty{padding:28px 0;color:var(--gray);text-align:center}
.note{margin-top:18px;font-size:15px;color:var(--gray);max-width:760px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);padding:14px 22px;border-radius:16px;background:var(--ink);color:#fff;font-weight:600;opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:50}.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.grid3{grid-template-columns:minmax(0,1fr)}}
.bdg{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center}.bdg.on{display:inline-flex}
.btn.bad{background:#ff3b30}.btn.sm.g.bad{background:#fff;color:#d92d20}.btn.sm.g.bad:hover{background:#fff1f0}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:700;background:var(--sf);color:#3a373b;white-space:nowrap}.pill.red{background:#ffe4e1;color:#d92d20}.pill.green{background:#dff7e6;color:#16803c}.pill.gray{background:var(--sf);color:var(--gray)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.rep{padding:18px 0;border-top:1px solid var(--line);display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.rep:first-child{border-top:0;padding-top:0}.rep p{margin:6px 0 0;color:var(--gray);font-size:15px;max-width:640px;overflow-wrap:anywhere}
.srch{width:100%;max-width:380px;height:46px;border-radius:16px;background:var(--sf);padding:0 16px;font-size:16px;font-weight:500;margin-bottom:16px}
@media(max-width:860px){.app.on{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px;gap:6px;align-items:center}.side .lg{padding:0 8px;width:100%}.side .sp,.side .user{display:none}.nav{flex:1;min-width:130px;height:48px;justify-content:center}.chart{height:200px}.col small{font-size:11px}}
@media(max-width:520px){.seg button{padding:0 11px;font-size:15px}.nav{min-width:90px;padding:0 10px}.kpis{grid-template-columns:minmax(0,1fr)}.tbl{font-size:14px}.col small:nth-child(odd){display:none}}
</style>

const TITLES={"/": "Главная", "/uslugi/": "Услуги студии Antviz", "/uslugi/vnedrenie-ii/": "Внедрение нейросетей и ИИ в бизнес", "/uslugi/razrabotka-sajtov/": "Разработка сайтов для бизнеса под ключ", "/uslugi/redizajn-i-dorabotka/": "Редизайн и доработка существующего сайта", "/uslugi/seo-prodvizhenie/": "SEO и продвижение сайтов", "/uslugi/razrabotka-prilozhenij/": "Разработка мобильных приложений для бизнеса", "/uslugi/vnedrenie-crm/": "CRM и системы учёта под ваши процессы", "/uslugi/telegram-boty/": "Разработка Telegram-ботов для бизнеса", "/process/": "Как мы работаем", "/voprosy/": "Частые вопросы", "/uzel/": "Узел: все ваши ссылки на одной странице", "/uzel/app/": "Узел", "/kontakty/": "Контакты студии Antviz", "/blog/": "Блог студии Antviz: сайты, боты, автоматизация", "/blog/soglasie-na-obrabotku-personalnyh-dannyh/": "Согласие на обработку персональных данных: что изменилось с 1 сентября 2025 года", "/blog/telegram-bot-ili-prilozhenie/": "Telegram-бот или мобильное приложение: что выбрать бизнесу", "/blog/my-otkrylis/": "Мы открылись: чем занимается Antviz и как с нами работать", "/blog/sajt-i-crm/": "Как связать сайт и CRM: пять рабочих сценариев", "/blog/nuzhen-li-lichnyj-kabinet/": "Нужен ли вашему сайту личный кабинет", "/blog/kak-vybrat-podryadchika/": "Как выбрать подрядчика на сайт: десять вопросов перед стартом", "/blog/chek-list-zapuska-sajta/": "Чек-лист запуска сайта: что проверить перед публикацией", "/blog/mobilnaya-versiya-sajta/": "Мобильная версия сайта: почему начинать нужно с телефона", "/blog/ii-assistent-dlya-podderzhki/": "ИИ-ассистент для поддержки: с чего начать", "/blog/oplata-na-sajte/": "Оплата на сайте и в Telegram: карты, СБП, подписки и счета", "/blog/lending-ili-sajt/": "Лендинг или многостраничный сайт: как выбрать", "/blog/skorost-sajta/": "Скорость сайта: что действительно влияет на заявки", "/blog/qr-vhod-na-meropriyatiya/": "QR-вход на мероприятие: как устроена система пропусков", "/blog/skolko-stoit-sajt/": "Сколько сто const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let tab='overview',days=14,data=null,visitors=null,open=null,timer=null,uz=null,uzQ='',uzAll=false;

async function api(path,opt){const r=await fetch('/api'+path,Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'antviz-admin'}},opt||{}));let j=null;try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error((j&&j.error)||'Ошибка '+r.status);e.status=r.status;throw e}return j}
/* ---- вход ---- */
const codes=$('#codes');codes.innerHTML=Array.from({length:6},(_,i)=>'<input inputmode="numeric" maxlength="1" autocomplete="'+(i?'off':'one-time-code')+'">').join('');
const ci=[...codes.querySelectorAll('input')];
ci.forEach((el,i)=>{el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'');if(el.value&&ci[i+1])ci[i+1].focus();if(ci.every(x=>x.value))$('#verify').click()});el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&ci[i-1])ci[i-1].focus()});el.addEventListener('paste',e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(t.length>1){e.preventDefault();t.split('').forEach((c,k)=>ci[k]&&(ci[k].value=c));ci[Math.min(t.length,5)].focus();if(t.length===6)$('#verify').click()}})});

$('#email').addEventListener('keydown',e=>{if(e.key==='Enter')$('#send').click()});
$('#back').onclick=()=>{$('#s2').style.display='none';$('#s1').style.display='block';$('#lgT').textContent='Вход в админку';$('#lgP').textContent='Введите почту администратора, мы отправим код.';ci.forEach(x=>x.value='')};
$('#verify').onclick=async()=>{const code=ci.map(x=>x.value).join('');$('#e2').textContent='';if(code.length<6)return;const b=$('#verify');b.disabled=true;try{await api('/auth/login/verify-code',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),code})});location.reload()}catch(e){$('#e2').textContent=e.message;ci.forEach(x=>x.value='');ci[0].focus()}b.disabled=false};
$('#logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch(e){}location.reload()};
/* ---- данные ---- */
function title(p){if(TITLES[p])return TITLES[p];return p}
function delta(cur,prev){if(!prev&&!cur)return '<span class="dl flat">без изменений</span>';if(!prev)return '<span class="dl up">новые данные</span>';const d=Math.round((cur-prev)/prev*100);if(d===0)return '<span class="dl flat">как в прошлый раз</span>';return '<span class="dl '+(d>0?'up':'down')+'">'+(d>0?'+':'−')+Math.abs(d)+'% к прошлому периоду</span>'}
function bars(list,key,val,fmt){const max=Math.max(1,...list.map(x=>x[val]));return list.length?'<div class="rows">'+list.map(x=>'<div class="row"><div class="t"><span>'+esc(fmt?fmt(x):x[key])+'</span><b>'+nf(x[val])+'</b></div><div class="bar"><i style="width:'+Math.max(3,x[val]/max*100)+'%"></i></div></div>').join('')+'</div>':'<div class="empty">Пока нет данных</div>'}
function pager(){return '<div class="seg" id="seg">'+[7,14,30,90].map(d=>'<button data-d="'+d+'" class="'+(d===days?'on':'')+'">'+d+' дн.</button>').join('')+'</div>'}
function viewOverview(){const d=data,t=d.totals,pv=d.prev;const max=Math.max(1,...d.series.map(x=>x.views));
  const dev=d.devices,tot=dev.reduce((s,x)=>s+x.views,0)||1,col={mobile:'#0066ff',desktop:'#0b0b0d',tablet:'#99c2ff'},nm={mobile:'Телефон',desktop:'Компьютер',tablet:'Планшет'};
  return '<div class="head"><div><h1>Обзор</h1><p>Статистика сайта за последние '+d.days+' дн. без cookie. IP-адреса хранятся 90 дней.</p></div>'+pager()+'</div>'+
  '<div class="kpis"><div class="card kpi"><small>Просмотры страниц</small><b>'+nf(t.views)+'</b>'+delta(t.views,pv.views)+'</div><div class="card kpi"><small>Посетители</small><b>'+nf(t.visitors)+'</b><span class="dl flat">считаются заново каждый день</span></div><div class="card kpi"><small>Нажатия на Telegram</small><b>'+nf(t.tg)+'</b>'+delta(t.tg,pv.tg)+'</div><div class="card kpi"><small>Дочитали статью</small><b>'+nf(t.reads)+'</b>'+delta(t.reads,pv.reads)+'</div></div>'+
  '<div class="grid"><div class="card"><h3>Просмотры по дням</h3><div class="chart">'+d.series.map((x,i)=>'<div class="col'+(i===d.series.length-1?' today':'')+'" title="'+esc(x.day)+': '+x.views+' просмотров, '+x.visitors+' посетителей, '+x.tg+' нажатий на Telegram"><i style="height:'+Math.max(2,x.views/max*100)+'%"></i><small>'+x.day.slice(8)+(d.series.length<=16?'.'+x.day.slice(5,7):'')+'</small></div>').join('')+'</div></div>'+
  '<div class="card"><h3>Устройства</h3><div class="dev">'+dev.map(x=>'<i style="width:'+x.views/tot*100+'%;background:'+(col[x.device]||'#ccc')+'"></i>').join('')+'</div><div class="leg">'+dev.map(x=>'<span><em style="background:'+(col[x.device]||'#ccc')+'"></em>'+(nm[x.device]||x.device)+' '+Math.round(x.views/tot*100)+'%</span>').join('')+'</div><h3 style="margin-top:30px">Откуда приходят</h3>'+bars(d.refs,'ref','views')+'</div></div>'+
  '<div class="grid3"><div class="card"><h3>Популярные страницы</h3>'+bars(d.pages,'path','views',x=>title(x.path))+'</div><div class="card"><h3>Что нажимали в Telegram</h3>'+bars(d.tgWhere,'label','clicks',x=>x.label+' · '+title(x.path))+'</div><div class="card"><h3>География</h3>'+bars(d.geo,'country','views',x=>cn(x.country)+(x.city?' · '+x.city:''))+'</div></div>'}
const cn=c=>{if(!c||c==='??')return 'Неизвестно';try{return new DisplayNames(['ru'],{type:'region'}).of(c)}catch(e){return c}};
const DisplayNames=Intl.DisplayNames;
function ago(s){const m=Math.round((Date.now()-new Date(s))/60000);if(m<1)return 'только что';if(m<60)return m+' мин назад';const h=Math.round(m/60);if(h<24)return h+' ч назад';return Math.round(h/24)+' дн. назад'}
const dv={mobile:'Телефон',desktop:'Компьютер',tablet:'Планшет'};
function viewVisitors(){const v=visitors||[];return '<div class="head"><div><h1>Посетители</h1><p>Кто заходил на сайт: адрес, откуда и что смотрел. Нажмите на строку, чтобы увидеть путь по сайту. IP хранится 90 дней.</p></div>'+pager()+'</div><div class="card">'+(v.length?'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Откуда</th><th>IP</th><th>Устройство</th><th>Источник</th><th class="n">Страниц</th><th class="n">Telegram</th><th>Последний заход</th></tr></thead><tbody>'+v.map(x=>'<tr class="vr" data-ip="'+esc(x.ip)+'" style="cursor:pointer"><td class="nm">'+esc(cn(x.country)+(x.city?' · '+x.city:''))+'</td><td class="code" style="font-size:15px">'+esc(x.ip)+'</td><td>'+esc(dv[x.device]||x.device||'')+'</td><td>'+esc(x.ref||'прямой заход')+'</td><td class="n">'+nf(x.views)+'</td><td class="n">'+nf(x.tg)+'</td><td>'+ago(x.last_seen)+'<div class="sl">'+esc(title(x.last_path||''))+'</div></td></tr>'+(open&&open.ip===x.ip?'<tr><td colspan="7" style="background:var(--sf);border-radius:18px">'+(open.rows.length?'<div class="rows" style="gap:8px;padding:6px 4px">'+open.rows.map(e=>'<div style="display:flex;gap:14px;font-size:15px"><span class="sl" style="min-width:120px">'+new Date(e.ts).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span><span>'+(e.kind==='pv'?'Страница':e.kind==='tg'?'Нажал Telegram':'Дочитал')+': <b>'+esc(e.kind==='tg'?(e.extra||'кнопка'):title(e.path))+'</b></span></div>').join('')+'</div>':'<div class="empty">Нет данных</div>')+'</td></tr>':'')).join('')+'</tbody></table></div>':'<div class="empty">За период ещё нет заходов с сохранённым IP.</div>')+'</div>'}
function viewBlog(){const b=data.blog;return '<div class="head"><div><h1>Блог</h1><p>Что читают и что приводит к обращению.</p></div>'+pager()+'</div><div class="card">'+(b.length?'<table class="tbl"><thead><tr><th>Статья</th><th class="n">Просмотры</th><th class="n">Дочитали</th><th class="n">Telegram</th></tr></thead><tbody>'+b.map(x=>'<tr><td><div class="nm">'+esc(title(x.path))+'</div><div class="sl">'+esc(x.path)+'</div></td><td class="n">'+nf(x.views)+'</td><td class="n">'+nf(x.reads)+(x.views?' <span class="sl">('+Math.round(x.reads/x.views*100)+'%)</span>':'')+'</td><td class="n">'+nf(x.tg)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">Статей с просмотрами за период пока нет.</div>')+'</div><p class="note">«Дочитали» засчитывается, когда посетитель долистал статью до 80%. Нажатия на Telegram считаются по всем кнопкам и ссылкам внутри статьи.</p>'}

const UZEL_URL='https://antviz.ru/uzel/';
const rsn=t=>esc(t||'Другое');
function viewUzel(){
  if(!uz)return '<div class="head"><div><h1>Узел</h1><p>Личные страницы со ссылками: список, жалобы, модерация.</p></div></div><div class="card"><div class="empty">Загрузка…</div></div>';
  if(uz.error)return '<div class="head"><div><h1>Узел</h1></div></div><div class="card"><div class="empty">'+esc(uz.error)+'</div></div><p class="note">Если здесь ошибка 404, на сервере ещё не подключён «Узел» (скрипт install-backend.sh).</p>';
  const s=uz.sum,pages=uz.pages,reps=uz.reports;
  const kp=(l,v,x)=>'<div class="card kpi"><small>'+l+'</small><b>'+nf(v)+'</b>'+(x||'')+'</div>';
  const repsH=reps.length?reps.map(r=>'<div class="rep"><div><b>'+esc(r.name)+'</b> <a class="sl" href="'+UZEL_URL+esc(r.slug)+'" target="_blank" rel="noopener">antviz.ru/uzel/'+esc(r.slug)+'</a> '+(r.hidden?'<span class="pill red">скрыта</span>':'')+(r.handled?' <span class="pill green">разобрана</span>':'')+'<p><b>'+rsn(r.reason)+'</b>'+(r.details?' · '+esc(r.details):'')+'</p><p>'+ago(r.created_at)+'</p></div><div class="acts">'+(r.handled?'<button class="btn sm g" data-uz="unhandle:'+r.id+'">Вернуть в работу</button>':(r.hidden?'':'<button class="btn sm g" data-uz="hide:'+r.page_id+'">Скрыть страницу</button>')+'<button class="btn sm" data-uz="handle:'+r.id+'">Отклонить жалобу</button>')+'</div></div>').join(''):'<div class="empty">'+(uzAll?'Жалоб пока не было':'Нерассмотренных жалоб нет')+'</div>';
  const pgH=pages.length?'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Страница</th><th>Владелец</th><th class="n">Просмотры 7 дн.</th><th class="n">Клики 7 дн.</th><th>Статус</th><th></th></tr></thead><tbody>'+pages.map(p=>'<tr><td><div class="nm">'+esc(p.name)+'</div><a class="sl" href="'+UZEL_URL+esc(p.slug)+'" target="_blank" rel="noopener">/'+esc(p.slug)+'</a></td><td>'+esc(p.email)+'<div class="sl">'+(p.last_login_at?'был '+ago(p.last_login_at):'не входил')+' · создана '+new Date(p.created_at).toLocaleDateString("ru")+'</div></td><td class="n">'+nf(p.views7)+'</td><td class="n">'+nf(p.clicks7)+'</td><td>'+(p.banned?'<span class="pill red">владелец заблокирован</span> ':'')+(p.hidden?'<span class="pill red">скрыта</span> ':'')+(!p.published?'<span class="pill gray">черновик</span> ':'')+(p.open_reports?'<span class="pill red">жалоб: '+p.open_reports+'</span>':'')+(!p.banned&&!p.hidden&&p.published&&!p.open_reports?'<span class="pill green">работает</span>':'')+'</td><td><div class="acts"><button class="btn sm g" data-uz="'+(p.hidden?'unhide':'hide')+':'+p.id+'">'+(p.hidden?'Показать':'Скрыть')+'</button><button class="btn sm g bad" data-uz="'+(p.banned?'unban':'ban')+':'+p.id+'">'+(p.banned?'Разблокировать':'Заблокировать')+'</button><button class="btn sm g bad" data-uz="delete:'+p.id+'">Удалить</button></div></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">'+(uzQ?'Ничего не найдено':'Страниц пока нет')+'</div>';
  return '<div class="head"><div><h1>Узел</h1><p>Личные страницы со ссылками: кто создал, что смотрят, жалобы и модерация.</p></div></div>'+
  '<div class="kpis" style="margin-bottom:20px">'+kp('Страниц',s.pages,'<span class="dl flat">скрыто: '+s.hidden+'</span>')+kp('Новых за 7 дней',s.new_users)+kp('Просмотры за 7 дней',s.views7,'<span class="dl flat">переходов: '+nf(s.clicks7)+'</span>')+kp('Жалобы',s.open_reports,'<span class="dl '+(s.open_reports?'down':'flat')+'">'+(s.open_reports?'ждут решения':'всё разобрано')+'</span>')+'</div>'+
  '<div class="card" style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap"><h3 style="margin:0">Жалобы</h3><button class="btn sm g" data-uz="toggleall">'+(uzAll?'Только новые':'Показать и разобранные')+'</button></div>'+repsH+'</div>'+
  '<div class="card"><h3>Страницы</h3><input class="srch" id="uzq" placeholder="Поиск по адресу, имени или почте" value="'+esc(uzQ)+'">'+pgH+'</div>'+
  '<p class="note">«Скрыть» делает страницу недоступной, владелец может ею не пользоваться, но данные остаются. «Заблокировать» скрывает страницу, закрывает все входы владельца и запрещает ему входить. «Удалить» стирает страницу, фото и статистику безвозвратно.</p>'}
async function loadUzel(){try{const [sum,pages,reports]=await Promise.all([api('/admin-stats/uzel/summary'),api('/admin-stats/uzel/pages?q='+encodeURIComponent(uzQ)),api('/admin-stats/uzel/reports'+(uzAll?'?all=1':''))]);uz={sum,pages,reports};const b=$('#uzBdg');b.textContent=sum.open_reports;b.classList.toggle('on',sum.open_reports>0)}catch(e){if(e.status===401||e.status===403){location.reload();return}uz={error:e.status===404?'Блок «Узел» ещё не подключён на сервере (ошибка 404).':e.message}}if(tab==='uzel')render()}
const UZ_MSG={hide:'Скрыть страницу? Она станет недоступна по ссылке.',ban:'Заблокировать владельца? Страница будет скрыта, все его входы закрыты, войти он больше не сможет.',delete:'Удалить страницу, аккаунт, фото и статистику безвозвратно?'};
async function uzAct(act,id){if(act==='toggleall'){uzAll=!uzAll;await loadUzel();return}if(UZ_MSG[act]&&!confirm(UZ_MSG[act]))return;const m={hide:['/pages/'+id+'/hide',{hidden:true}],unhide:['/pages/'+id+'/hide',{hidden:false}],ban:['/pages/'+id+'/ban',{banned:true}],unban:['/pages/'+id+'/ban',{banned:false}],delete:['/pages/'+id+'/delete',{}],handle:['/reports/'+id+'/handle',{handled:true}],unhandle:['/reports/'+id+'/handle',{handled:false}]}[act];if(!m)return;try{await api('/admin-stats/uzel'+m[0],{method:'POST',body:JSON.stringify(m[1])});toast('Готово');await loadUzel()}catch(e){toast(e.message)}}
function render(){const v=$('#view');if(tab==='overview'&&data)v.innerHTML=viewOverview();else if(tab==='blog'&&data)v.innerHTML=viewBlog();else if(tab==='visitors')v.innerHTML=viewVisitors();else if(tab==='uzel')v.innerHTML=viewUzel();document.querySelectorAll('.nav[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
async function load(){try{const [s,vs]=await Promise.all([api('/admin-stats/summary?days='+days),api('/admin-stats/visitors?days='+days)]);data=s;visitors=vs;open=null;render()}catch(e){if(e.status===401||e.status===403){location.reload();return}toast(e.message)}}
document.addEventListener('click',async e=>{const n=e.target.closest('.nav[data-t]');if(n){tab=n.dataset.t;render();if(tab==='uzel')loadUzel();return}const ua=e.target.closest('[data-uz]');if(ua){const [a,i]=ua.dataset.uz.split(':');await uzAct(a,i);return}const vr=e.target.closest('.vr');if(vr){const ip=vr.dataset.ip;if(open&&open.ip===ip){open=null;render();return}try{open={ip,rows:await api('/admin-stats/visitor?ip='+encodeURIComponent(ip))};render()}catch(er){toast(er.message)}return}const s=e.target.closest('#seg button');if(s){days=+s.dataset.d;await load();return}});
let uzT;document.addEventListener('input',e=>{if(e.target.id==='uzq'){uzQ=e.target.value;clearTimeout(uzT);uzT=setTimeout(async()=>{const pos=e.target.selectionStart;await loadUzel();const el=$('#uzq');if(el){el.focus();el.setSelectionRange(pos,pos)}},350)}});
(async function init(){let me=null;try{me=await api('/auth/me')}catch(e){}
  if(!me||me.role!=='admin'){$('#login').style.display='grid';return}
  $('#app').classList.add('on');$('#who').textContent=me.email||me.displayName||'';await load();loadUzel();timer=setInterval(()=>{if(!document.hidden)load()},60000)})();
</script>
</body>
</html>
