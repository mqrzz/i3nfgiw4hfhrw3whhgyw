<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Почта — Antviz Admin.</title>
<link rel="icon" href="../img/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f3f4f7}
:root{
  --green:#1ede7b;--green-h:#17c96a;--green-d:#0f9950;--green-soft:#e5faee;--green-soft2:#d1f5e0;
  --orange:#f59e0b;--orange-d:#b8720a;--orange-soft:#fef2e0;
  --red:#e8634f;--red-soft:#fdeae7;--info:#3b82f6;--info-soft:#eaf2fe;
  --bg:#f3f4f7;--card:#ffffff;
  --text:#14171c;--muted:#818997;--muted2:#aeb4bf;--line:#e6e8ec;--line2:#dcdfe4;
  --dark:#14171c;
  --font:'Geologica','Inter',sans-serif;
  --r-xs:10px;--r-sm:14px;--r-md:18px;--r-lg:22px;--r-xl:28px;--r-pill:999px;
  --sh-sm:0 1px 2px rgba(20,23,30,.04);
  --sh-md:0 12px 28px rgba(20,23,30,.09),0 2px 8px rgba(20,23,30,.05);
  --sh-lg:0 28px 64px rgba(20,23,30,.16),0 8px 20px rgba(20,23,30,.07);
  --maxw:960px;
}
body{color:var(--text);font-family:var(--font);font-weight:300;font-size:15.5px;-webkit-font-smoothing:antialiased}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

.ls{position:fixed;inset:0;z-index:9000;background:var(--dark);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.sp{width:26px;height:26px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
.lt{font-size:13px;color:rgba(255,255,255,.35)}

.app{display:none;height:calc(100vh - 78px);overflow:hidden;flex-direction:column;background:var(--bg)}
@media(max-width:640px){.app{height:calc(100vh - 74px)}}

.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--bg)}
.screen.active{display:flex;animation:fadeUp .22s ease both}
.screen-stack{position:relative;flex:1;min-height:0}

.icon-btn{width:40px;height:40px;border-radius:var(--r-sm);border:none;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .12s}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.icon-btn.ghost{background:none}
.icon-btn.ghost:hover{background:var(--line)}
.back-label{display:none;font-size:.86rem;font-weight:500;white-space:nowrap}

/* ===== SCREEN 1 — LIST ===== */
#screenList .inner{max-width:var(--maxw);width:100%;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;height:100%}
.list-head{padding-top:36px;flex-shrink:0}
.list-head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-size:1.7rem;font-weight:500;letter-spacing:-.02em}
.head-actions{display:flex;gap:10px}
.sb-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:.8rem 1.1rem;margin-bottom:16px;transition:border-color .15s,box-shadow .15s}
.sb-box:focus-within{border-color:var(--green);box-shadow:0 0 0 4px rgba(30,222,123,.1)}
.sb-box svg{width:17px;height:17px;stroke:var(--muted);flex-shrink:0;stroke-width:2;fill:none}
.sb-box input{background:none;border:none;outline:none;font-family:var(--font);font-size:.95rem;font-weight:300;color:var(--text);width:100%}
.filter-tabs{display:flex;gap:8px;margin-bottom:16px}
.filter-tab{background:var(--card);border:1.5px solid var(--line2);color:var(--muted);font-family:var(--font);font-size:.82rem;font-weight:500;padding:.5rem 1rem;border-radius:var(--r-pill);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.filter-tab:hover{border-color:var(--line);color:var(--text)}
.filter-tab.active{background:var(--dark);border-color:var(--dark);color:#fff}

.threads-scroll{flex:1;overflow-y:auto;padding:2px 2px 32px;display:flex;flex-direction:column;gap:10px}
.ti{display:flex;gap:16px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s;animation:fadeUp .2s ease both}
.ti:hover{border-color:var(--line2);box-shadow:var(--sh-md);transform:translateY(-1px)}
.ti-avatar{width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted2)}
.ti-avatar svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none}
.ti-body{flex:1;min-width:0}
.ti-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:5px}
.ti-subj{font-size:.98rem;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px;min-width:0}
.ti-subj-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-prev{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.ti-meta{font-size:.76rem;color:var(--muted2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ti-out-tag{font-size:.66rem;font-weight:500;color:var(--muted);background:var(--line);padding:.16rem .5rem;border-radius:6px;flex-shrink:0}
.unread{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;animation:pulse 1.5s infinite}
.empty-l{text-align:center;padding:70px 16px;color:var(--muted);font-size:.9rem}

/* ===== SCREEN 2 — THREAD ===== */
#screenThread .inner{max-width:var(--maxw);width:100%;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;height:100%;overflow:hidden}
.t-topbar{display:flex;align-items:center;gap:12px;padding:24px 0 16px;flex-shrink:0}
.t-topbar .grow{flex:1}
.t-info-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px 24px;margin-bottom:14px;flex-shrink:0;display:flex;align-items:center;gap:16px}
.t-avatar{width:48px;height:48px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted2)}
.t-avatar svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6;fill:none}
.t-who{flex:1;min-width:0}
.t-subj{font-size:1.1rem;font-weight:500;letter-spacing:-.02em;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-user-row{font-size:.85rem;color:var(--muted)}

.mail-msgs{flex:1;overflow-y:auto;padding:4px 2px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.mm{border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);animation:fadeUp .18s ease both;overflow:hidden}
.mm.out{border-color:var(--green-soft2);background:var(--green-soft)}
.mm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mm.out .mm-head{border-bottom-color:var(--green-soft2)}
.mm-from{font-size:.86rem;font-weight:500;color:var(--text)}
.mm-time{font-size:.74rem;color:var(--muted2);white-space:nowrap}
.mm-subj{font-size:.78rem;color:var(--muted);padding:8px 16px 0}
.mm-frame{width:100%;height:260px;border:none;background:#fff;display:block}
.mm-text{padding:14px 16px;font-size:.9rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.mm-atts{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px}
.att-chip{display:flex;align-items:center;gap:7px;background:var(--bg);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:.4rem .7rem;font-size:.78rem;color:var(--text);text-decoration:none;max-width:220px}
.att-chip svg{width:14px;height:14px;stroke:var(--muted);flex-shrink:0}
.att-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-img-grid{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px}
.att-img-wrap{display:block;width:120px;height:120px;border-radius:var(--r-sm);overflow:hidden;border:1.5px solid var(--line2);flex-shrink:0}
.att-img{width:100%;height:100%;object-fit:cover;display:block}

/* COMPOSER */
.composer{flex-shrink:0;padding:10px 2px 22px}
.composer-card{background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-lg);box-shadow:var(--sh-sm);transition:border-color .15s,box-shadow .15s;overflow:hidden}
.composer-card:focus-within{border-color:var(--green);box-shadow:0 0 0 4px rgba(30,222,123,.1)}
.composer-top{display:flex;gap:10px;padding:12px 14px 0}
.composer-subj{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-xs);padding:.5rem .8rem;font-family:var(--font);font-size:.82rem;color:var(--text);outline:none}
.composer-tmpl{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-xs);padding:.5rem .8rem;font-family:var(--font);font-size:.82rem;color:var(--text);outline:none;cursor:pointer;max-width:180px}
.composer-ta{width:100%;background:none;border:none;outline:none;resize:none;font-family:var(--font);font-size:.92rem;font-weight:300;color:var(--text);padding:12px 18px 8px;min-height:24px;max-height:180px;line-height:1.5}
.composer-toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 10px 10px;gap:10px;flex-wrap:wrap}
.composer-attach{display:flex;align-items:center;justify-content:center;background:var(--bg);border:1.5px solid var(--line2);color:var(--muted);width:40px;height:40px;border-radius:50%;cursor:pointer;transition:background .15s,color .15s,border-color .15s;flex-shrink:0}
.composer-attach:hover{background:var(--green-soft);color:var(--green-d);border-color:var(--green-soft2)}
.composer-attach svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none}
.composer-attach.has-file{background:var(--green-soft);color:var(--green-d);border-color:var(--green-soft2)}
.composer-send{display:flex;align-items:center;gap:7px;background:var(--green);color:var(--dark);border:none;border-radius:var(--r-pill);padding:.55rem 1.15rem;font-family:var(--font);font-weight:500;font-size:.85rem;cursor:pointer;transition:background .15s;flex-shrink:0}
.composer-send:hover{background:var(--green-h)}
.composer-send svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.3;fill:none}
.composer-files{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 10px}
.cf-chip{display:flex;align-items:center;gap:7px;background:var(--bg);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:.35rem .5rem .35rem .7rem;font-size:.78rem;max-width:180px}
.cf-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf-chip button{background:none;border:none;color:var(--muted);cursor:pointer;width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cf-chip svg{width:13px;height:13px;stroke:currentColor;stroke-width:2}

/* ===== SCREEN 3 — COMPOSE ===== */
#screenCompose .inner{max-width:640px;width:100%;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;height:100%;overflow:hidden}
.c-topbar{display:flex;align-items:center;gap:14px;padding:24px 0 8px;flex-shrink:0}
.c-title{font-size:1.25rem;font-weight:500;letter-spacing:-.02em}
.c-body{flex:1;overflow-y:auto;padding:20px 2px 24px}
.c-form{display:flex;flex-direction:column;gap:20px}
.fg{display:flex;flex-direction:column;gap:8px}
.fl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.fi,.fta,.fsel{width:100%;background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:.9rem 1.05rem;color:var(--text);font-family:var(--font);font-size:.94rem;font-weight:300;outline:none;transition:border-color .15s,box-shadow .15s}
.fi:focus,.fta:focus,.fsel:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(30,222,123,.1)}
.fta{resize:vertical;min-height:160px;line-height:1.55}
.fsel{cursor:pointer;appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23818997" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');background-repeat:no-repeat;background-position:right 16px center;background-size:16px}
.fhint{font-size:.76rem;color:var(--muted2)}
.dropzone{border:1.5px dashed var(--line2);border-radius:var(--r-md);padding:22px 16px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;align-items:center;gap:7px}
.dropzone:hover,.dropzone.drag{border-color:var(--green);background:var(--green-soft)}
.dropzone svg{width:21px;height:21px;stroke:var(--muted2);stroke-width:1.6;fill:none}
.dropzone-text{font-size:.85rem}
.dropzone-sub{font-size:.73rem;color:var(--muted2)}
.c-foot{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 65%,transparent);padding:18px 2px 24px;flex-shrink:0}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:500;font-size:.88rem;border:none;border-radius:var(--r-sm);padding:.75rem 1.3rem;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-green{background:var(--green);color:var(--dark);box-shadow:0 8px 20px rgba(30,222,123,.28)}.btn-green:hover{background:var(--green-h)}
.btn-ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line2)}.btn-ghost:hover{background:var(--line)}
.btn-danger{background:var(--red-soft);color:var(--red)}.btn-danger:hover{background:#fbdbd6}
.btn-block{width:100%;justify-content:center;padding:1rem 1rem;font-size:.94rem}

/* KEBAB */
.kebab-wrap{position:relative;flex-shrink:0}
.kebab-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border-radius:var(--r-md);box-shadow:var(--sh-lg);border:1.5px solid var(--line);padding:10px;width:200px;z-index:60;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .15s,transform .15s}
.kebab-menu.show{opacity:1;pointer-events:all;transform:none}

/* MODAL (шаблоны) */
.modal-bg{position:fixed;inset:0;z-index:800;background:rgba(15,17,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s}
.modal-bg.show{opacity:1;pointer-events:all}
.modal{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);flex-shrink:0}
.modal-head b{font-size:1.05rem;font-weight:500}
.modal-body{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.tmpl-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:.7rem .9rem}
.tmpl-row .ti-name{flex:1;font-size:.88rem;font-weight:500}
.tmpl-row button{background:none;border:none;color:var(--muted);cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.tmpl-row button svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8}
.tmpl-row button:hover{color:var(--text)}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;z-index:900;padding:.8rem 1.5rem;border-radius:var(--r-md);font-size:.86rem;font-weight:500;opacity:0;box-shadow:var(--sh-lg);transition:opacity .2s,transform .2s;pointer-events:none;transform:translateY(8px)}
.toast.show{opacity:1;transform:none}
.toast.success{background:var(--green);color:#0d3320}.toast.error{background:var(--red);color:#fff}.toast.info{background:var(--dark);color:#fff}.toast.warn{background:var(--orange);color:#fff}

/* MOBILE */
@media (max-width:760px){
  #screenList .inner,#screenThread .inner,#screenCompose .inner{padding:0 16px}
  .list-head{padding-top:20px}
  .page-title{font-size:1.4rem}
  .t-topbar{padding-top:16px}
  .t-info-card{padding:14px 16px}
  #screenThread .t-topbar .exit-btn{width:auto;padding:0 16px 0 12px;gap:7px;justify-content:flex-start;border-radius:var(--r-pill);background:var(--card);box-shadow:var(--sh-sm)}
  .back-label{display:inline}
  .mm-frame{height:200px}
}
</style>
</head>
<body>

<div class="ls" id="loadingScreen"><div class="sp"></div><span class="lt">Загрузка...</span></div>

<div class="app" id="appWrap">
  <div class="screen-stack">

    <!-- SCREEN 1: LIST -->
    <div class="screen active" id="screenList">
      <div class="inner">
        <div class="list-head">
          <div class="list-head-row">
            <span class="page-title">Почта</span>
            <div class="head-actions">
              <button class="btn btn-ghost" onclick="openTemplates()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:15px;height:15px"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
                Шаблоны
              </button>
              <button class="btn btn-green" onclick="openCompose()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:15px;height:15px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Написать
              </button>
            </div>
          </div>
          <div class="sb-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="listSearch" placeholder="Поиск по почте..." oninput="renderThreads()"/>
          </div>
          <div class="filter-tabs" id="filterTabs">
            <button class="filter-tab active" data-f="all" onclick="setDirFilter('all')">Все</button>
            <button class="filter-tab" data-f="in" onclick="setDirFilter('in')">Входящие</button>
            <button class="filter-tab" data-f="out" onclick="setDirFilter('out')">Отправленные</button>
          </div>
        </div>
        <div class="threads-scroll" id="threadsList">
          <div class="empty-l">Загрузка...</div>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: THREAD -->
    <div class="screen" id="screenThread">
      <div class="inner">
        <div class="t-topbar">
          <button class="icon-btn ghost exit-btn" onclick="showScreen('list')"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span class="back-label">К списку</span></button>
          <span class="grow"></span>
          <div class="kebab-wrap">
            <button class="icon-btn ghost" onclick="toggleKebab()"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
            <div class="kebab-menu" id="kebabMenu">
              <button class="btn btn-danger btn-block" onclick="deleteThread()">Удалить переписку</button>
            </div>
          </div>
        </div>

        <div class="t-info-card">
          <div class="t-avatar"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 8.97 6.19a2 2 0 0 0 2.06 0L22 7"/></svg></div>
          <div class="t-who">
            <div class="t-subj" id="threadName">—</div>
            <div class="t-user-row" id="threadEmail"></div>
          </div>
        </div>

        <div class="mail-msgs" id="mailMsgs"></div>

        <div class="composer">
          <div class="composer-card">
            <div class="composer-top">
              <input class="composer-subj" id="replySubject" placeholder="Тема письма"/>
              <select class="composer-tmpl" id="replyTemplate" onchange="applyTemplate('reply')"><option value="">Шаблон...</option></select>
            </div>
            <textarea class="composer-ta" id="replyBody" rows="2" placeholder="Текст ответа..." oninput="autoResize(this)"></textarea>
            <div class="composer-files" id="replyFiles"></div>
            <div class="composer-toolbar">
              <label class="composer-attach" id="replyAttachBtn" title="Прикрепить файл">
                <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                <input type="file" id="replyFileInp" multiple style="display:none" onchange="onFilesPicked('reply',this.files)"/>
              </label>
              <button class="composer-send" onclick="sendReply()">Ответить<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCREEN 3: COMPOSE -->
    <div class="screen" id="screenCompose">
      <div class="inner">
        <div class="c-topbar">
          <button class="icon-btn ghost" onclick="showScreen('list')"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
          <span class="c-title">Новое письмо</span>
        </div>
        <div class="c-body">
          <div class="c-form">
            <div class="fg">
              <label class="fl">Кому</label>
              <input class="fi" id="composeTo" type="text" list="usersDatalist" placeholder="email@example.com" oninput="onComposeToInput()"/>
              <datalist id="usersDatalist"></datalist>
              <span class="fhint">Можно выбрать пользователя из списка или ввести любой email</span>
            </div>
            <div class="fg">
              <label class="fl">Тема</label>
              <input class="fi" id="composeSubject" type="text" placeholder="Тема письма"/>
            </div>
            <div class="fg">
              <label class="fl">Шаблон <span style="text-transform:none;letter-spacing:0;color:var(--muted2)">(необязательно)</span></label>
              <select class="fsel" id="composeTemplate" onchange="applyTemplate('compose')"><option value="">Без шаблона</option></select>
            </div>
            <div class="fg">
              <label class="fl">Текст письма</label>
              <textarea class="fta" id="composeBody" placeholder="Текст письма..." rows="7"></textarea>
            </div>
            <div class="fg">
              <label class="fl">Вложения <span style="text-transform:none;letter-spacing:0;color:var(--muted2)">(необязательно)</span></label>
              <div class="dropzone" id="composeDropzone" onclick="document.getElementById('composeFileInp').click()">
                <svg viewBox="0 0 24 24"><path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
                <div class="dropzone-text">Загрузить файлы или перетащите сюда</div>
                <div class="dropzone-sub">до ~8 МБ на файл</div>
                <input type="file" id="composeFileInp" multiple style="display:none" onchange="onFilesPicked('compose',this.files)"/>
              </div>
              <div class="composer-files" id="composeFiles"></div>
            </div>
          </div>
        </div>
        <div class="c-foot">
          <button class="btn btn-green btn-block" onclick="sendCompose()">Отправить письмо</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL: ШАБЛОНЫ -->
<div class="modal-bg" id="tmplModalBg" onclick="if(event.target===this)closeTemplates()">
  <div class="modal">
    <div class="modal-head"><b>Шаблоны писем</b><button class="icon-btn ghost" onclick="closeTemplates()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div id="tmplList"></div>
      <div class="fg"><label class="fl">Название</label><input class="fi" id="tmplTitle" placeholder="Например: Ответ по оплате"/></div>
      <div class="fg"><label class="fl">Тема письма</label><input class="fi" id="tmplSubject" placeholder="Тема письма по умолчанию"/></div>
      <div class="fg"><label class="fl">Текст</label><textarea class="fta" id="tmplBody" rows="5" placeholder="Текст шаблона. Можно использовать {{name}} и {{email}}"></textarea></div>
      <button class="btn btn-green btn-block" id="tmplSaveBtn" onclick="saveTemplate()">Сохранить шаблон</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const API = 'https://antviz.ru/api';

let allThreads=[], selectedKey=null, allUsers=[], allTemplates=[];
let editingTemplateId=null;
let files={reply:[], compose:[]};
let dirFilter='all';
const MAX_FILE_BYTES = 8*1024*1024;

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className=`toast ${t} show`;setTimeout(()=>el.className='toast',3400);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDT(ts){if(!ts)return'—';const d=new Date(ts);return d.toLocaleDateString('ru',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});}
function fmtSize(b){if(!b)return'';if(b<1024)return b+' Б';if(b<1024*1024)return Math.round(b/1024)+' КБ';return (b/1024/1024).toFixed(1)+' МБ';}

window.showScreen=function(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const map={list:'screenList',thread:'screenThread',compose:'screenCompose'};
  document.getElementById(map[name]).classList.add('active');
  document.getElementById('kebabMenu')?.classList.remove('show');
};

window.toggleKebab=()=>{document.getElementById('kebabMenu').classList.toggle('show');};
document.addEventListener('click',e=>{
  const menu=document.getElementById('kebabMenu');
  if(menu && menu.classList.contains('show') && !menu.contains(e.target) && !e.target.closest('.kebab-wrap .icon-btn')) menu.classList.remove('show');
});

window.autoResize=function(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,180)+'px';};

window.setDirFilter=function(f){
  dirFilter=f;
  document.querySelectorAll('#filterTabs .filter-tab').forEach(b=>b.classList.toggle('active', b.dataset.f===f));
  renderThreads();
};

/* ===== СПИСОК ТРЕДОВ ===== */
function renderThreads(){
  const q=(document.getElementById('listSearch').value||'').toLowerCase();
  let list=allThreads;
  if(dirFilter!=='all')list=list.filter(t=>t.lastDirection===dirFilter);
  if(q)list=list.filter(t=>(t.contactName||'').toLowerCase().includes(q)||(t.contactEmail||'').toLowerCase().includes(q)||(t.lastSubject||'').toLowerCase().includes(q));
  const badge=document.getElementById('navBadgeMail');
  const totalUnread=allThreads.reduce((s,t)=>s+(t.unreadCount||0),0);
  if(badge){badge.style.display=totalUnread?'':'none';badge.textContent=totalUnread;}
  const el=document.getElementById('threadsList');
  if(!list.length){el.innerHTML=`<div class="empty-l">${allThreads.length?'Ничего не найдено':'Писем пока нет'}</div>`;return;}
  el.innerHTML=list.map(t=>{
    const unread=t.unreadCount>0;
    return`<div class="ti" onclick="selectThread('${esc(t.threadKey)}')">
      <div class="ti-avatar"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 8.97 6.19a2 2 0 0 0 2.06 0L22 7"/></svg></div>
      <div class="ti-body">
        <div class="ti-top">
          <div class="ti-subj">${unread?'<span class="unread"></span>':''}<span class="ti-subj-text">${esc(t.contactName||t.contactEmail||'—')}</span></div>
          ${t.lastDirection==='out'?'<span class="ti-out-tag">Отправлено</span>':''}
        </div>
        <div class="ti-prev">${esc(t.lastSubject||'')} ${t.preview?'— '+esc(t.preview):''}</div>
        <div class="ti-meta"><span>${esc(t.contactEmail||'')}</span><span>·</span><span>${fmtDT(t.lastAt)}</span></div>
      </div>
    </div>`;}).join('');
}

async function loadThreads(){
  try{
    const resp=await fetch(`${API}/inbound-email/threads`,{credentials:'include'});
    if(!resp.ok)return;
    allThreads=await resp.json();
    renderThreads();
  }catch(e){console.error('loadThreads:',e);}
}

/* ===== ТРЕД (ПЕРЕПИСКА) ===== */
window.selectThread=async function(key){
  selectedKey=key;
  const t=allThreads.find(x=>x.threadKey===key);
  showScreen('thread');
  document.getElementById('threadName').textContent=(t&&t.contactName)||key;
  document.getElementById('threadEmail').textContent=(t&&t.contactEmail)||key;
  document.getElementById('replySubject').value='';
  document.getElementById('replyBody').value='';
  files.reply=[];renderFiles('reply');

  document.getElementById('mailMsgs').innerHTML='<div style="text-align:center;color:var(--muted);font-size:.86rem;padding:36px">Загрузка…</div>';
  try{
    const resp=await fetch(`${API}/inbound-email/threads/${encodeURIComponent(key)}`,{credentials:'include'});
    const msgs=resp.ok?await resp.json():[];
    renderMailMsgs(msgs);
    if(msgs.length){
      const last=msgs[msgs.length-1];
      document.getElementById('replySubject').value = last.subject && !/^re:/i.test(last.subject) ? `Re: ${last.subject}` : (last.subject||'');
    }
    if(t){t.unreadCount=0;renderThreads();}
  }catch(e){
    document.getElementById('mailMsgs').innerHTML='<div style="text-align:center;color:var(--muted);font-size:.86rem;padding:36px">Не удалось загрузить письма</div>';
  }
};

function renderMailMsgs(msgs){
  const el=document.getElementById('mailMsgs');
  if(!msgs.length){el.innerHTML='<div class="empty-l">Пока нет писем</div>';return;}
  el.innerHTML=msgs.map(m=>{
    const allAtts=m.attachments||[];
    const images=allAtts.filter(a=>(a.type||'').startsWith('image/'));
    const files=allAtts.filter(a=>!(a.type||'').startsWith('image/'));
    const imgGrid=images.length?`<div class="att-img-grid">${images.map(a=>`<a href="${esc(a.data)}" target="_blank" rel="noopener" class="att-img-wrap" title="${esc(a.name)}"><img class="att-img" src="${esc(a.data)}" alt="${esc(a.name)}"/></a>`).join('')}</div>`:'';
    const atts=files.map(a=>`<a class="att-chip" href="${esc(a.data)}" download="${esc(a.name)}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg><span>${esc(a.name)} · ${fmtSize(a.size)}</span></a>`).join('');
    const bodyBlock = m.bodyHtml
      ? `<iframe class="mm-frame" sandbox="" srcdoc="${esc(m.bodyHtml)}"></iframe>`
      : `<div class="mm-text">${esc(m.bodyText||'(пусто)')}</div>`;
    return `<div class="mm ${m.direction}">
      <div class="mm-head">
        <span class="mm-from">${m.direction==='in'?esc(m.fromName||m.fromEmail):'Вы → '+esc(m.toEmail)}</span>
        <span class="mm-time">${fmtDT(m.createdAt)}</span>
      </div>
      ${m.subject?`<div class="mm-subj">${esc(m.subject)}</div>`:''}
      ${bodyBlock}
      ${imgGrid}
      ${atts?`<div class="mm-atts">${atts}</div>`:''}
    </div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}

window.deleteThread=async function(){
  if(!selectedKey)return;
  if(!confirm('Удалить всю переписку с этим адресом?'))return;
  try{
    await fetch(`${API}/inbound-email/threads/${encodeURIComponent(selectedKey)}`,{method:'DELETE',credentials:'include'});
    allThreads=allThreads.filter(t=>t.threadKey!==selectedKey);
    renderThreads();
    toast('Переписка удалена','success');
    showScreen('list');
  }catch(e){toast('Ошибка: '+e.message,'error');}
};

window.sendReply=async function(){
  const subject=document.getElementById('replySubject').value.trim();
  const bodyText=document.getElementById('replyBody').value;
  if(!bodyText.trim())return toast('Введите текст ответа','error');
  const bodyHtml=esc(bodyText).replace(/\n/g,'<br/>');
  try{
    const resp=await fetch(`${API}/inbound-email/threads/${encodeURIComponent(selectedKey)}/reply`,{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({subject,bodyText,bodyHtml,attachments:files.reply}),
    });
    if(!resp.ok){const d=await resp.json().catch(()=>({}));throw new Error(d.error||'Ошибка');}
    document.getElementById('replyBody').value='';
    files.reply=[];renderFiles('reply');
    await selectThread(selectedKey);
    await loadThreads();
    toast('Ответ отправлен ✅','success');
  }catch(e){toast('Ошибка: '+e.message,'error');}
};

/* ===== НОВОЕ ПИСЬМО ===== */
window.openCompose=function(){
  document.getElementById('composeTo').value='';
  document.getElementById('composeSubject').value='';
  document.getElementById('composeBody').value='';
  document.getElementById('composeTemplate').value='';
  files.compose=[];renderFiles('compose');
  showScreen('compose');
};

window.onComposeToInput=function(){}; // резерв, даталист работает нативно

window.sendCompose=async function(){
  const toEmail=document.getElementById('composeTo').value.trim();
  const subject=document.getElementById('composeSubject').value.trim();
  const bodyText=document.getElementById('composeBody').value;
  if(!toEmail)return toast('Укажите получателя','error');
  if(!subject)return toast('Укажите тему','error');
  if(!bodyText.trim())return toast('Введите текст письма','error');
  const bodyHtml=esc(bodyText).replace(/\n/g,'<br/>');
  const templateId=document.getElementById('composeTemplate').value||null;
  try{
    const resp=await fetch(`${API}/inbound-email/compose`,{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({toEmail,subject,bodyText,bodyHtml,attachments:files.compose,templateId}),
    });
    if(!resp.ok){const d=await resp.json().catch(()=>({}));throw new Error(d.error||'Ошибка');}
    await loadThreads();
    toast('Письмо отправлено ✅','success');
    showScreen('list');
  }catch(e){toast('Ошибка: '+e.message,'error');}
};

/* ===== ВЛОЖЕНИЯ (composer / compose-форма) ===== */
window.onFilesPicked=function(target,fileList){
  const list=Array.from(fileList||[]);
  list.forEach(file=>{
    if(file.size>MAX_FILE_BYTES){toast(`${file.name}: файл слишком большой (макс. 8 МБ)`,'error');return;}
    const reader=new FileReader();
    reader.onload=e=>{
      files[target].push({name:file.name,type:file.type||'application/octet-stream',size:file.size,data:e.target.result});
      renderFiles(target);
    };
    reader.readAsDataURL(file);
  });
};
function renderFiles(target){
  const elId=target==='reply'?'replyFiles':'composeFiles';
  const btnId=target==='reply'?'replyAttachBtn':null;
  const el=document.getElementById(elId);
  el.innerHTML=files[target].map((f,i)=>`<div class="cf-chip"><span>${esc(f.name)} · ${fmtSize(f.size)}</span><button onclick="removeFile('${target}',${i})"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`).join('');
  if(btnId)document.getElementById(btnId).classList.toggle('has-file',files[target].length>0);
}
window.removeFile=function(target,i){files[target].splice(i,1);renderFiles(target);};

/* ===== ШАБЛОНЫ ===== */
async function loadTemplates(){
  try{
    const resp=await fetch(`${API}/email-templates`,{credentials:'include'});
    allTemplates=resp.ok?await resp.json():[];
    const opts='<option value="">Шаблон...</option>'+allTemplates.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('');
    document.getElementById('replyTemplate').innerHTML=opts;
    document.getElementById('composeTemplate').innerHTML='<option value="">Без шаблона</option>'+allTemplates.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('');
    renderTemplateManagerList();
  }catch(e){console.error('loadTemplates:',e);}
}

window.applyTemplate=function(target){
  const id=document.getElementById(target==='reply'?'replyTemplate':'composeTemplate').value;
  const t=allTemplates.find(x=>x.id===id);
  if(!t)return;
  let name='', email='';
  if(target==='reply'){
    const th=allThreads.find(x=>x.threadKey===selectedKey);
    name=(th&&th.contactName)||'';email=(th&&th.contactEmail)||'';
  }else{
    email=document.getElementById('composeTo').value.trim();
  }
  const fill=s=>String(s||'').replace(/\{\{name\}\}/g,name||'').replace(/\{\{email\}\}/g,email||'');
  if(target==='reply'){
    if(t.subject)document.getElementById('replySubject').value=fill(t.subject);
    document.getElementById('replyBody').value=fill(t.body);
  }else{
    if(t.subject)document.getElementById('composeSubject').value=fill(t.subject);
    document.getElementById('composeBody').value=fill(t.body);
  }
};

window.openTemplates=function(){document.getElementById('tmplModalBg').classList.add('show');resetTemplateForm();};
window.closeTemplates=function(){document.getElementById('tmplModalBg').classList.remove('show');};
function resetTemplateForm(){
  editingTemplateId=null;
  document.getElementById('tmplTitle').value='';
  document.getElementById('tmplSubject').value='';
  document.getElementById('tmplBody').value='';
  document.getElementById('tmplSaveBtn').textContent='Сохранить шаблон';
}
function renderTemplateManagerList(){
  const el=document.getElementById('tmplList');
  if(!allTemplates.length){el.innerHTML='<div class="empty-l" style="padding:24px 0">Шаблонов пока нет</div>';return;}
  el.innerHTML=allTemplates.map(t=>`<div class="tmpl-row"><span class="ti-name">${esc(t.title)}</span><button onclick="editTemplate('${t.id}')" title="Изменить"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg></button><button onclick="deleteTemplate('${t.id}')" title="Удалить"><svg viewBox="0 0 24 24" fill="none"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button></div>`).join('');
}
window.editTemplate=function(id){
  const t=allTemplates.find(x=>x.id===id);if(!t)return;
  editingTemplateId=id;
  document.getElementById('tmplTitle').value=t.title;
  document.getElementById('tmplSubject').value=t.subject||'';
  document.getElementById('tmplBody').value=t.body||'';
  document.getElementById('tmplSaveBtn').textContent='Обновить шаблон';
};
window.deleteTemplate=async function(id){
  if(!confirm('Удалить шаблон?'))return;
  try{
    await fetch(`${API}/email-templates/${id}`,{method:'DELETE',credentials:'include'});
    await loadTemplates();
    if(editingTemplateId===id)resetTemplateForm();
    toast('Шаблон удалён','success');
  }catch(e){toast('Ошибка: '+e.message,'error');}
};
window.saveTemplate=async function(){
  const title=document.getElementById('tmplTitle').value.trim();
  if(!title)return toast('Введите название шаблона','error');
  const body={title,subject:document.getElementById('tmplSubject').value.trim(),body:document.getElementById('tmplBody').value};
  try{
    const url=editingTemplateId?`${API}/email-templates/${editingTemplateId}`:`${API}/email-templates`;
    const method=editingTemplateId?'PUT':'POST';
    const resp=await fetch(url,{method,headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
    if(!resp.ok){const d=await resp.json().catch(()=>({}));throw new Error(d.error||'Ошибка');}
    await loadTemplates();
    resetTemplateForm();
    toast('Шаблон сохранён ✅','success');
  }catch(e){toast('Ошибка: '+e.message,'error');}
};

/* ===== ПОЛЬЗОВАТЕЛИ (подсказка "Кому") ===== */
async function loadUsers(){
  try{
    const resp=await fetch(`${API}/users`,{credentials:'include'});
    allUsers=resp.ok?await resp.json():[];
    document.getElementById('usersDatalist').innerHTML=allUsers.map(u=>`<option value="${esc(u.email)}">${esc(u.displayName||u.email)}</option>`).join('');
  }catch(e){console.error('loadUsers:',e);}
}

/* ===== ИНИЦИАЛИЗАЦИЯ ===== */
(async function initAdminMail(){
  let user=null;
  try{
    const resp=await fetch(`${API}/auth/me`,{credentials:'include'});
    if(resp.ok)user=await resp.json();
  }catch(e){}

  if(!user){document.getElementById('loadingScreen').style.display='none';window.location.href='/';return;}
  document.getElementById('loadingScreen').style.display='none';
  if(user.role!=='admin'){window.location.href='/';return;}
  document.getElementById('appWrap').style.display='flex';

  await loadThreads();
  loadUsers();
  loadTemplates();
  setInterval(loadThreads, 15000);

  let _lastThreadSig=null;
  setInterval(async()=>{
    if(!selectedKey)return;
    try{
      const resp=await fetch(`${API}/inbound-email/threads/${encodeURIComponent(selectedKey)}`,{credentials:'include'});
      if(!resp.ok)return;
      const msgs=await resp.json();
      const sig=msgs.length+':'+(msgs[msgs.length-1]?.id||'');
      if(sig===_lastThreadSig)return;
      _lastThreadSig=sig;
      renderMailMsgs(msgs);
    }catch(e){}
  }, 8000);
})();
</script>
