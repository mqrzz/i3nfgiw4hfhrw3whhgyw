<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Промокоды — Antviz Admin</title>
<link rel="icon" href="../img/favicon.png"/>
<script>
  try{ var t = localStorage.getItem('antviz-theme'); if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/profile/assets/cabinet-base.css?v=1">
<link rel="stylesheet" href="/profile/assets/cabinet.css?v=3">
<link rel="stylesheet" href="/profile/assets/admin-extra.css?v=1">
<style>
  .promo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .pc{background:var(--card-elevated);border:1px solid var(--stroke);border-radius:var(--r24);padding:22px 24px;transition:border-color .15s;animation:cabFadeUp .2s ease both}
  .pc:hover{border-color:var(--stroke-strong)}
  .pc.off{opacity:.55;border-style:dashed}
  .pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
  .pc-code{font-size:20px;font-weight:600;color:var(--green-text);letter-spacing:.03em}
  .pc-disc{font-size:12.5px;font-weight:500;padding:.3rem .8rem;border-radius:99px;background:var(--violet-dim);color:var(--violet);white-space:nowrap}
  .pc-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
  .pc-actions{display:flex;gap:8px}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>
<div id="sbContent" style="display:none">
  <div class="shell">
    <div class="cab-page">
      <div class="pg-head">
        <div class="pg-head-main">
          <div class="pg-title">Промокоды</div>
          <div class="pg-sub">Активных сейчас: <b id="activeCount" style="color:var(--green-text)">—</b></div>
        </div>
        <div class="pg-actions">
          <button class="cab-btn primary" onclick="openModal()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Создать промокод</button>
        </div>
      </div>

      <div class="cab-toolbar">
        <div class="cab-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Поиск по коду…" id="searchInp" oninput="renderPromos()"/>
        </div>
        <div class="cab-tabs" id="tabRow">
          <button class="cab-tab is-active" onclick="switchFilter('all',this)">Все</button>
          <button class="cab-tab" onclick="switchFilter('active',this)">Активные</button>
          <button class="cab-tab" onclick="switchFilter('disabled',this)">Отключённые</button>
        </div>
      </div>

      <div id="promosList"><div class="cab-empty"><h3>Загрузка…</h3></div></div>
    </div>
  </div>
</div>

<div class="cab-modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="cab-modal">
    <h3 style="margin-bottom:20px">Новый промокод</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="cab-field"><label class="cab-label">Код</label><input class="cab-input" id="pCode" type="text" placeholder="SALE20" oninput="this.value=this.value.toUpperCase()"/></div>
      <div class="cab-field"><label class="cab-label">Тип скидки</label><select class="cab-select" id="pType"><option value="percent">Процент (%)</option><option value="fixed">Фиксированная (₽)</option></select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
      <div class="cab-field"><label class="cab-label">Размер скидки</label><input class="cab-input" id="pValue" type="number" placeholder="20" min="1"/></div>
      <div class="cab-field"><label class="cab-label">Срок действия</label><input class="cab-input" id="pExpires" type="date"/></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
      <div class="cab-field"><label class="cab-label">Лимит использований</label><input class="cab-input" id="pLimit" type="number" placeholder="Без лимита" min="1"/></div>
      <div class="cab-field"><label class="cab-label">Для UID (необязательно)</label><input class="cab-input" id="pUid" type="text" placeholder="Пусто — для всех"/></div>
    </div>
    <div class="cab-modal-actions" style="margin-top:22px">
      <button class="cab-btn ghost" onclick="closeModal()">Отмена</button>
      <button class="cab-btn primary" onclick="createPromo()">Создать</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
const API = 'https://antviz.ru/api';

let allPromos=[], currentFilter='all';
function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className=`toast ${t} show`;setTimeout(()=>el.className='toast',3400);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(ts){if(!ts)return'∞';return new Date(ts).toLocaleDateString('ru',{day:'numeric',month:'short',year:'numeric'});}

window.switchFilter=(f,btn)=>{currentFilter=f;document.querySelectorAll('#tabRow .cab-tab').forEach(b=>b.classList.remove('is-active'));btn.classList.add('is-active');renderPromos();};
window.openModal=()=>document.getElementById('modal').classList.add('show');
window.closeModal=()=>document.getElementById('modal').classList.remove('show');

function renderPromos(){
  const el=document.getElementById('promosList');
  const q=(document.getElementById('searchInp').value||'').toLowerCase();
  let list=allPromos;
  if(currentFilter==='active') list=list.filter(p=>p.active);
  else if(currentFilter==='disabled') list=list.filter(p=>!p.active);
  if(q) list=list.filter(p=>(p.code||'').toLowerCase().includes(q));
  document.getElementById('activeCount').textContent=allPromos.filter(p=>p.active).length;
  if(!list.length){el.innerHTML=`<div class="cab-empty"><h3>Нет промокодов</h3></div>`;return;}
  el.innerHTML=`<div class="promo-grid">${list.map(p=>{
    const now=new Date();
    const expired=p.expiresAt&&new Date(p.expiresAt)<now;
    const limitReached=p.usageLimit!=null&&(p.usedCount||0)>=p.usageLimit;
    const active=p.active&&!expired&&!limitReached;
    const disc=p.discountType==='percent'?`-${p.discountValue}%`:`-${p.discountValue} ₽`;
    return`<div class="pc${active?'':' off'}">
      <div class="pc-top"><span class="pc-code">${esc(p.code)}</span><span class="pc-disc">${disc}</span></div>
      <div class="pc-meta">
        <div class="dk"><div class="dk-l">Истекает</div><div class="dk-v" style="${expired?'color:var(--red)':''}">${fmtDate(p.expiresAt)}</div></div>
        <div class="dk"><div class="dk-l">Использований</div><div class="dk-v" style="${limitReached?'color:var(--red)':''}">${p.usedCount||0}${p.usageLimit?` / ${p.usageLimit}`:''}</div></div>
        <div class="dk"><div class="dk-l">Для кого</div><div class="dk-v">${p.forUserId?'Конкретный':'Для всех'}</div></div>
        <div class="dk"><div class="dk-l">Статус</div><div class="dk-v" style="color:${active?'var(--green-text)':'var(--text-faint)'}">${active?'Активен':'Отключён'}</div></div>
      </div>
      <div class="pc-actions">
        <button class="cab-btn ${active?'ghost':'dark'} sm" onclick="togglePromo('${p.id}',${!p.active})">${p.active?'Отключить':'Включить'}</button>
        <button class="cab-btn danger sm" onclick="deletePromo('${p.id}')">Удалить</button>
      </div>
    </div>`;}).join('')}</div>`;
}

window.createPromo=async()=>{
  const code=document.getElementById('pCode').value.trim().toUpperCase();
  const type=document.getElementById('pType').value;
  const value=+document.getElementById('pValue').value;
  const expires=document.getElementById('pExpires').value;
  const limit=document.getElementById('pLimit').value.trim();
  const forUserId=document.getElementById('pUid').value.trim();
  if(!code||!value){toast('Заполните код и скидку','error');return;}
  try{
    const resp = await fetch(`${API}/promo-codes`, {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({
        code, discountType: type, discountValue: value,
        expiresAt: expires ? new Date(expires+'T23:59:59').toISOString() : null,
        usageLimit: limit ? +limit : null,
        forUserId: forUserId || null,
      }),
    });
    if(!resp.ok){ const d=await resp.json().catch(()=>({})); throw new Error(d.error||'Ошибка'); }
    toast('Промокод создан ✓','success');closeModal();
    ['pCode','pValue','pExpires','pLimit','pUid'].forEach(id=>document.getElementById(id).value='');
    await loadPromos();renderPromos();
  }catch(e){toast('Ошибка: '+e.message,'error');}
};
window.deletePromo=async id=>{
  if(!confirm('Удалить промокод?'))return;
  try{
    const resp = await fetch(`${API}/promo-codes/${id}`, { method:'DELETE', credentials:'include' });
    if(!resp.ok) throw new Error();
    toast('Удалён','info');await loadPromos();renderPromos();
  }catch(e){ toast('Ошибка удаления','error'); }
};
window.togglePromo=async(id,active)=>{
  try{
    const resp = await fetch(`${API}/promo-codes/${id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ active }),
    });
    if(!resp.ok) throw new Error();
    toast(active?'Активирован ✓':'Отключён',active?'success':'info');await loadPromos();renderPromos();
  }catch(e){ toast('Ошибка','error'); }
};

async function loadPromos(){
  try{
    const resp = await fetch(`${API}/promo-codes/admin/all`, { credentials:'include' });
    allPromos = resp.ok ? await resp.json() : [];
  }catch(e){ allPromos=[]; }
}

window.doLogout=async()=>{
  try{ await fetch(`${API}/auth/logout`, { method:'POST', credentials:'include' }); }catch(e){}
  window.location.href='/';
};

(async function initPromosPage(){
  let user = null;
  try{
    const resp = await fetch(`${API}/auth/me`, { credentials:'include' });
    if(resp.ok) user = await resp.json();
  }catch(e){}

  if(!user){document.getElementById('loadingScreen').style.display='none';window.location.href='/';return;}
  document.getElementById('loadingScreen').style.display='none';
  if(user.role!=='admin'){window.location.href='/';return;}
  document.getElementById('sbContent').style.display='block';
  fetch(`${API}/orders/admin/all`, { credentials:'include' }).then(r=>r.ok?r.json():[]).then(orders=>{
    const n=orders.filter(o=>o.refundStatus==='requested').length;
    const b=document.getElementById('navBadgeOrders');
    if(b){b.style.display=n?'':'none';b.textContent=n;}
  }).catch(()=>{});
  fetch(`${API}/enterprise/admin/all`, { credentials:'include' }).then(r=>r.ok?r.json():[]).then(apps=>{
    const n=apps.filter(a=>a.status==='new').length;
    const b=document.getElementById('navBadgeEnterprise');
    if(b){b.style.display=n?'':'none';b.textContent=n;}
  }).catch(()=>{});
  await loadPromos();renderPromos();
})();
</script>
<script src="/profile/assets/admin-shell.js" data-page="promos" data-title="Промокоды"></script>
<script src="../GEOBLOCK.js"></script>
<script src="../maintenance.js"></script>
</body>
</html>
