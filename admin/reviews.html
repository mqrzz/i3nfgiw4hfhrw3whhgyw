<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Отзывы — Antviz Admin.</title>
<link rel="icon" href="../img/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f3f4f7}
:root{
  --green:#1ede7b;--green-h:#17c96a;--green-d:#0f9950;--green-soft:#e5faee;
  --orange:#f59e0b;--orange-d:#b8720a;--orange-soft:#fef2e0;
  --red:#e8634f;--red-soft:#fdeae7;--info:#3b82f6;--info-soft:#eaf2fe;--purple:#7c3aed;--purple-soft:#f0eafd;
  --bg:#f3f4f7;--card:#ffffff;
  --text:#14171c;--muted:#818997;--muted2:#aeb4bf;--line:#e6e8ec;--line2:#dcdfe4;
  --dark:#14171c;
  --font:'Geologica','Inter',sans-serif;
  --r-xs:10px;--r-sm:14px;--r-md:18px;--r-lg:22px;--r-xl:28px;--r-pill:999px;
  --sh-sm:0 1px 2px rgba(20,23,30,.04);
  --sh-md:0 12px 28px rgba(20,23,30,.09),0 2px 8px rgba(20,23,30,.05);
  --sh-lg:0 28px 64px rgba(20,23,30,.16),0 8px 20px rgba(20,23,30,.07);
  --maxw:1080px;
}
body{color:var(--text);font-family:var(--font);font-weight:300;font-size:15.5px;-webkit-font-smoothing:antialiased}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

.ls{position:fixed;inset:0;z-index:9000;background:var(--dark);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.sp{width:26px;height:26px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
.lt{font-size:13px;color:rgba(255,255,255,.35)}

.page{display:none;min-height:100vh;overflow-y:auto}
.inner{max-width:var(--maxw);width:100%;margin:0 auto;padding:36px 28px 60px}

.hero{background:var(--dark);border-radius:var(--r-xl);padding:32px 36px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-100px;right:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(30,222,123,.16),transparent 70%);pointer-events:none}
.hero-text{position:relative;z-index:1}
.hero-text h1{font-size:1.6rem;font-weight:500;color:#fff;letter-spacing:-.02em;margin-bottom:6px}
.hero-text p{font-size:.88rem;color:rgba(255,255,255,.42)}
.hero-stats{display:flex;gap:12px;position:relative;z-index:1}
.hs{background:rgba(255,255,255,.07);border-radius:var(--r-md);padding:16px 20px;text-align:center;min-width:84px}
.hs-n{font-size:1.6rem;font-weight:500;letter-spacing:-.03em;color:#fff;line-height:1}
.hs-l{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.35);margin-top:5px;font-weight:500}
.hs-n.warn{color:var(--orange)}
.hs-n.green{color:var(--green)}

.ctrl-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tab-row{display:flex;gap:6px}
.tab{background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-pill);padding:.55rem 1rem;font-family:var(--font);font-size:.83rem;font-weight:400;color:var(--muted);cursor:pointer;transition:all .12s;white-space:nowrap}
.tab:hover{border-color:var(--muted2);color:var(--text)}
.tab.active{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:500}

.rv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.rc{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;transition:border-color .15s,box-shadow .15s;animation:fadeUp .2s ease both}
.rc:hover{border-color:var(--line2);box-shadow:var(--sh-md)}
.rc.off{opacity:.55;border-style:dashed}
.rc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.rc-name{font-size:.98rem;font-weight:500;letter-spacing:-.01em;margin-bottom:5px}
.rc-stars{font-size:1rem;color:var(--orange);letter-spacing:.05em}
.rc-date{font-size:.74rem;color:var(--muted);margin-top:2px}
.rc-text{font-size:.88rem;color:var(--muted);line-height:1.6;margin-bottom:16px}
.rc-order{font-size:.72rem;color:var(--info);margin-bottom:14px;display:inline-block}
.rc-actions{display:flex;gap:8px}
.rc-badge{font-size:.7rem;font-weight:500;padding:.24rem .65rem;border-radius:var(--r-pill);white-space:nowrap}
.rc-badge.pub{background:var(--green-soft);color:var(--green-d)}
.rc-badge.hid{background:var(--bg);color:var(--muted)}

.empty{padding:64px 24px;text-align:center;color:var(--muted);font-size:.9rem}

.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--font);font-weight:500;font-size:.85rem;border:none;border-radius:var(--r-sm);padding:.7rem 1.2rem;cursor:pointer;transition:background .15s,transform .1s;text-decoration:none;white-space:nowrap}
.btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none;flex-shrink:0}
.btn:hover{transform:translateY(-1px)}
.btn-green{background:var(--green);color:var(--dark);box-shadow:0 8px 20px rgba(30,222,123,.28)}.btn-green:hover{background:var(--green-h)}
.btn-dark{background:var(--dark);color:#fff}.btn-dark:hover{background:#2b2f33}
.btn-outline{background:var(--card);border:1.5px solid var(--line2);color:var(--muted)}.btn-outline:hover{border-color:var(--muted2);color:var(--text)}
.btn-danger{background:var(--red-soft);color:var(--red)}.btn-danger:hover{background:#fbdbd6}
.btn-sm{padding:.5rem 1rem;font-size:.8rem}

.toast{position:fixed;bottom:28px;right:28px;z-index:900;padding:.8rem 1.5rem;border-radius:var(--r-md);font-size:.86rem;font-weight:500;opacity:0;box-shadow:var(--sh-lg);transition:opacity .2s,transform .2s;pointer-events:none;transform:translateY(8px)}
.toast.show{opacity:1;transform:none}
.toast.success{background:var(--green);color:#0d3320}.toast.error{background:var(--red);color:#fff}.toast.info{background:var(--dark);color:#fff}

@media(max-width:760px){
  .inner{padding:20px 16px 40px}
  .hero{padding:24px 20px;flex-direction:column;align-items:flex-start}
  .hero-text h1{font-size:1.3rem}
  .hero-stats{width:100%}
  .hs{flex:1}
  .rv-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="ls" id="loadingScreen"><div class="sp"></div><span class="lt">Загрузка...</span></div>
<div class="page" id="appWrap">
  <div class="inner">
    <div class="hero">
      <div class="hero-text"><h1>Отзывы клиентов</h1><p>Управляйте видимостью отзывов на сайте</p></div>
      <div class="hero-stats">
        <div class="hs"><div class="hs-n" id="heroTotal">—</div><div class="hs-l">Всего</div></div>
        <div class="hs"><div class="hs-n warn" id="heroAvg">—</div><div class="hs-l">Средняя</div></div>
        <div class="hs"><div class="hs-n green" id="heroVisible">—</div><div class="hs-l">Видимых</div></div>
      </div>
    </div>

    <div class="ctrl-row">
      <div class="tab-row">
        <button class="tab active" onclick="switchFilter('all',this)">Все</button>
        <button class="tab" onclick="switchFilter('visible',this)">Опубликованные</button>
        <button class="tab" onclick="switchFilter('hidden',this)">Скрытые</button>
      </div>
    </div>

    <div id="reviewsList"><div class="empty">Загрузка...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const API = 'https://antviz.ru/api';

let allReviews=[], currentFilter='all';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className=`toast ${t} show`;setTimeout(()=>el.className='toast',3400);}
function fmtDate(ts){if(!ts)return'—';return new Date(ts).toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'});}
function stars(n){return'★'.repeat(n)+'☆'.repeat(5-n);}

window.doLogout=async()=>{
  try{ await fetch(`${API}/auth/logout`, { method:'POST', credentials:'include' }); }catch(e){}
  window.location.href='/';
};
window.switchFilter=(f,btn)=>{currentFilter=f;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderReviews();};

function renderReviews(){
  const el=document.getElementById('reviewsList');
  let list=allReviews;
  if(currentFilter==='visible') list=list.filter(r=>!r.hidden);
  else if(currentFilter==='hidden') list=list.filter(r=>r.hidden);
  const total=allReviews.length;
  const avg=total?allReviews.reduce((s,r)=>s+(r.stars||0),0)/total:0;
  const visible=allReviews.filter(r=>!r.hidden).length;
  document.getElementById('heroTotal').textContent=total;
  document.getElementById('heroAvg').textContent=total?avg.toFixed(1):'—';
  document.getElementById('heroVisible').textContent=visible;
  if(!list.length){el.innerHTML=`<div class="empty">Нет отзывов</div>`;return;}
  el.innerHTML=`<div class="rv-grid">${list.map(r=>`
    <div class="rc${r.hidden?' off':''}">
      <div class="rc-top">
        <div>
          <div class="rc-name">${esc(r.clientName||'Аноним')}</div>
          <div class="rc-stars">${stars(r.stars||0)}</div>
          <div class="rc-date">${fmtDate(r.createdAt)}</div>
        </div>
        <span class="rc-badge ${r.hidden?'hid':'pub'}">${r.hidden?'Скрыт':'Опубликован'}</span>
      </div>
      <div class="rc-text">${esc(r.text||'Без текста')}</div>
      ${r.orderId?`<div class="rc-order">Заказ №${r.orderId.slice(0,8).toUpperCase()}</div>`:''}
      <div class="rc-actions">
        <button class="btn btn-${r.hidden?'green':'outline'} btn-sm" onclick="toggleReview('${r.id}',${!r.hidden})"><svg viewBox="0 0 24 24">${r.hidden?'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>':'<path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a21.6 21.6 0 015.06-6.06M9.9 4.24A10.4 10.4 0 0112 4c7 0 11 8 11 8a21.4 21.4 0 01-2.16 3.19"/><path d="M1 1l22 22"/>'}</svg>${r.hidden?'Опубликовать':'Скрыть'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteReview('${r.id}')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>Удалить</button>
      </div>
    </div>`).join('')}</div>`;
}
window.toggleReview=async(id,hidden)=>{
  try{
    const resp = await fetch(`${API}/reviews/${id}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ hidden }),
    });
    if(!resp.ok) throw new Error();
    const r=allReviews.find(x=>x.id===id); if(r) r.hidden=hidden;
    toast(hidden?'Скрыт':'Опубликован ✓',hidden?'info':'success');
    renderReviews();
  }catch(e){ toast('Ошибка','error'); }
};
window.deleteReview=async id=>{
  if(!confirm('Удалить отзыв?'))return;
  try{
    const resp = await fetch(`${API}/reviews/${id}`, { method:'DELETE', credentials:'include' });
    if(!resp.ok) throw new Error();
    allReviews=allReviews.filter(r=>r.id!==id);
    toast('Удалён','info');
    renderReviews();
  }catch(e){ toast('Ошибка удаления','error'); }
};

(async function initReviewsPage(){
  let user = null;
  try{
    const resp = await fetch(`${API}/auth/me`, { credentials:'include' });
    if(resp.ok) user = await resp.json();
  }catch(e){}

  if(!user){document.getElementById('loadingScreen').style.display='none';window.location.href='/';return;}
  document.getElementById('loadingScreen').style.display='none';
  if(user.role!=='admin'){window.location.href='/';return;}
  document.getElementById('appWrap').style.display='block';
  fetch(`${API}/orders/admin/all`, { credentials:'include' }).then(r=>r.ok?r.json():[]).then(orders=>{
    const n=orders.filter(o=>o.refundStatus==='requested').length;
    const b=document.getElementById('navBadgeOrders');
    if(b){b.style.display=n?'':'none';b.textContent=n;}
  }).catch(()=>{});

  try{
    const resp = await fetch(`${API}/reviews/admin/all`, { credentials:'include' });
    allReviews = resp.ok ? await resp.json() : [];
  }catch(e){ allReviews=[]; }
  renderReviews();
})();
</script>
<script src="/m-panel26.js"></script>
<script src="../GEOBLOCK.js"></script>
<script src="../maintenance.js"></script>
</body>
</html>
