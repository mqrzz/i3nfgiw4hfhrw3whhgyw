<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Обслуживание — Antviz Admin</title>
<link rel="icon" href="../img/favicon.png"/>
<script>
  try{ var t = localStorage.getItem('antviz-theme'); if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/profile/assets/cabinet-base.css?v=1">
<link rel="stylesheet" href="/profile/assets/cabinet.css?v=3">
<link rel="stylesheet" href="/profile/assets/admin-extra.css?v=1">
<style>
  .screen{display:none}
  .screen.active{display:block;animation:cabFadeUp .2s ease both}

  .ic-stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .ic-stat{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r16);padding:18px 20px;display:flex;align-items:center;gap:14px}
  .ic-stat-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ic-stat-ic svg{width:19px;height:19px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ic-stat-ic.open{background:var(--blue-dim)}.ic-stat-ic.open svg{stroke:var(--blue)}
  .ic-stat-ic.done{background:var(--green-dim)}.ic-stat-ic.done svg{stroke:var(--green-text)}
  .ic-stat-ic.urgent{background:var(--red-dim)}.ic-stat-ic.urgent svg{stroke:var(--red)}
  .ic-stat-ic.sup{background:var(--violet-dim)}.ic-stat-ic.sup svg{stroke:var(--violet)}
  .ic-stat-num{font-size:1.4rem;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .ic-stat-lbl{font-size:12.5px;color:var(--text-faint);margin-top:2px}
  @media(max-width:760px){.ic-stat-row{grid-template-columns:repeat(2,1fr)}}

  .urgent-strip{display:flex;align-items:center;gap:10px;background:var(--red-dim);border:1px solid var(--red);border-radius:var(--r16);padding:14px 20px;margin-bottom:20px;font-size:14px;color:var(--red);font-weight:500;cursor:pointer}
  .urgent-strip svg{width:17px;height:17px;stroke:var(--red);stroke-width:2;fill:none;flex-shrink:0}

  .sup-section{background:var(--text);border-radius:var(--r32);padding:26px 28px;margin-bottom:20px}
  .sup-title{font-size:17px;font-weight:500;color:var(--bg);letter-spacing:-.02em;margin-bottom:16px}
  .sup-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
  .sup-card{background:rgba(255,255,255,.07);border-radius:var(--r16);padding:16px 18px;min-width:220px;flex-shrink:0}
  .sup-card.expiring{background:rgba(245,158,11,.16);border:1px solid rgba(245,158,11,.3)}
  .sup-name{font-size:15px;font-weight:500;color:var(--bg);margin-bottom:2px}
  .sup-email{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:12px}
  .sup-prog-labels{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.35);margin-bottom:6px}
  .sup-prog{height:4px;background:rgba(255,255,255,.12);border-radius:3px}
  .sup-prog-fill{height:100%;border-radius:3px;background:var(--green)}
  .sup-prog-fill.warn{background:linear-gradient(90deg,#f59e0b,#e8634f)}

  .ti-list{display:flex;flex-direction:column;gap:10px}
  .ti{display:flex;gap:16px;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r16);padding:18px 20px;cursor:pointer;transition:border-color .15s}
  .ti:hover{border-color:var(--stroke-strong)}
  .avatar-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:14px;font-weight:600}
  .ti-body{flex:1;min-width:0}
  .ti-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:5px}
  .ti-subj{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
  .ti-subj-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .answered-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
  .ti-prev{font-size:13.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
  .ti-meta{font-size:12.5px;color:var(--text-faint);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  .t-topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .t-info-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
  .t-avatar{width:52px;height:52px;font-size:16px}
  .t-who{flex:1;min-width:0}
  .t-subj{font-size:19px;font-weight:500;letter-spacing:-.02em;margin-bottom:4px}
  .t-user-row{font-size:13.5px;color:var(--text-faint);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .t-status-toggle{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .status-pill{display:inline-flex;align-items:center;gap:7px;padding:.5rem .9rem;border-radius:99px;font-size:13px;font-weight:500;border:none;cursor:pointer}
  .status-pill .dot{width:7px;height:7px;border-radius:50%}
  .status-pill.open{background:var(--blue-dim);color:var(--blue)}.status-pill.open .dot{background:var(--blue)}
  .status-pill.done{background:var(--card-elevated);color:var(--text-faint)}.status-pill.done .dot{background:var(--text-faint)}
  .t-info-grid{display:flex;flex-wrap:wrap;gap:10px 28px;border-top:1px solid var(--stroke);padding-top:14px}
  .t-info-item{display:flex;flex-direction:column;gap:3px}
  .t-info-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);font-weight:500}
  .t-info-val{font-size:14px;color:var(--text)}
  .t-order-link{color:var(--green-text);text-decoration:none;font-weight:500}
  .t-no-order{color:var(--amber)}

  .chat-msgs{display:flex;flex-direction:column;gap:6px;margin:20px 0}
  .msg-wrap{display:flex;flex-direction:column}
  .msg-label{font-size:12px;font-weight:500;margin-bottom:5px;color:var(--text-faint)}
  .msg-label.sup{color:var(--green-text)}
  .msg{padding:13px 17px;border-radius:var(--r16);max-width:78%;font-size:14.5px;line-height:1.55;word-break:break-word}
  .msg.usr{background:var(--card-elevated);color:var(--text);align-self:flex-start;border:1px solid var(--stroke)}
  .msg.sup{background:var(--green-dim);color:var(--green-text);align-self:flex-end}
  .msg-time{font-size:11px;color:var(--text-faint);display:block;margin-top:7px}
  .msg-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .msg-img{width:96px;height:96px;border-radius:var(--r14);object-fit:cover;cursor:pointer}
  .no-reply-hint{text-align:center;color:var(--text-faint);font-size:13.5px;padding:14px 0}

  .composer-card{background:var(--card-elevated);border:1px solid var(--stroke);border-radius:var(--r24);overflow:hidden}
  .composer-card:focus-within{border-color:var(--green)}
  .composer-ta{width:100%;background:none;border:none;outline:none;resize:none;font-family:inherit;font-size:14.5px;color:var(--text);padding:16px 18px 8px;min-height:24px;max-height:160px;line-height:1.5}
  .composer-toolbar{display:flex;align-items:center;justify-content:flex-end;padding:8px 10px 10px}

  .kebab-wrap{position:relative;flex-shrink:0}
  .kebab-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border-radius:var(--r16);box-shadow:var(--shadow-lg);border:1px solid var(--stroke);padding:10px;width:200px;z-index:60;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .15s,transform .15s}
  .kebab-menu.show{opacity:1;pointer-events:all;transform:none}

  .lightbox{position:fixed;inset:0;z-index:1000;background:rgba(10,12,16,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .lightbox.show{opacity:1;pointer-events:all}
  .lightbox img{max-width:90vw;max-height:90vh;border-radius:var(--r16);object-fit:contain}
  .lb-x{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')">
  <button class="lb-x">✕</button>
  <img id="lbImg" src="" alt=""/>
</div>

<div id="sbContent" style="display:none">
  <div class="shell">
    <div class="cab-page">

      <div class="screen active" id="screenList">
        <div class="pg-head"><div class="pg-head-main"><div class="pg-title">Обслуживание</div></div></div>

        <div class="ic-stat-row">
          <div class="ic-stat"><div class="ic-stat-ic open"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><div><div class="ic-stat-num" id="statOpen">—</div><div class="ic-stat-lbl">Открытых заявок</div></div></div>
          <div class="ic-stat"><div class="ic-stat-ic urgent"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2.7 17a2 2 0 001.7 3h15.2a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg></div><div><div class="ic-stat-num" id="statUrgent">—</div><div class="ic-stat-lbl">Без ответа &gt;24ч</div></div></div>
          <div class="ic-stat"><div class="ic-stat-ic done"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><div><div class="ic-stat-num" id="statDone">—</div><div class="ic-stat-lbl">Закрытых заявок</div></div></div>
          <div class="ic-stat"><div class="ic-stat-ic sup"><svg viewBox="0 0 24 24"><path d="M2 9a3 3 0 010-6h20a3 3 0 010 6"/><path d="M2 15a3 3 0 000 6h20a3 3 0 000-6"/><path d="M6 12h12"/></svg></div><div><div class="ic-stat-num" id="statSupports">—</div><div class="ic-stat-lbl">Активных обслуживаний</div></div></div>
        </div>

        <div class="urgent-strip" id="urgentStrip" style="display:none" onclick="applyUrgentFilter()">
          <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2.7 17a2 2 0 001.7 3h15.2a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
          <span id="urgentStripText"></span>
        </div>

        <div class="sup-section">
          <div class="sup-title">Активные обслуживания</div>
          <div class="sup-scroll" id="supportsList"><div style="color:rgba(255,255,255,.3);font-size:14px">Загрузка…</div></div>
        </div>

        <div class="cab-toolbar">
          <div class="cab-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input type="text" placeholder="Поиск по имени, email, заявке…" id="searchInp" oninput="renderTickets()"/></div>
          <div class="cab-tabs" id="segRow">
            <button class="cab-tab is-active" data-f="all" onclick="switchFilter('all',this)">Все <span id="cntAll">0</span></button>
            <button class="cab-tab" data-f="open" onclick="switchFilter('open',this)">Открытые <span id="cntOpen">0</span></button>
            <button class="cab-tab" data-f="done" onclick="switchFilter('done',this)">Закрытые <span id="cntDone">0</span></button>
          </div>
          <select class="cab-select" id="sortSel" onchange="renderTickets()" style="margin-left:auto;max-width:200px">
            <option value="urgent">Сначала срочные</option>
            <option value="new">Сначала новые</option>
            <option value="old">Сначала старые</option>
          </select>
        </div>

        <div class="ti-list" id="ticketsList"><div class="cab-empty"><h3>Загрузка…</h3></div></div>
      </div>

      <div class="screen" id="screenTicket">
        <div class="t-topbar">
          <button class="cab-btn ghost sm" onclick="showScreen('list')"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Назад</button>
          <span style="flex:1"></span>
          <div class="kebab-wrap">
            <button class="cab-btn ghost sm" onclick="toggleKebab()"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
            <div class="kebab-menu" id="kebabMenu">
              <button class="cab-btn danger" style="width:100%;justify-content:center" onclick="deleteTick()">Удалить заявку</button>
            </div>
          </div>
        </div>

        <div class="cab-card" style="margin-bottom:18px">
          <div class="t-info-top">
            <div class="avatar-circle t-avatar" id="tAvatar"></div>
            <div class="t-who">
              <div class="t-subj" id="tSubj">—</div>
              <div class="t-user-row" id="tUserRow"></div>
            </div>
            <div class="t-status-toggle">
              <span class="cab-badge red" id="urgentTag" style="display:none">Ждёт ответа &gt;24ч</span>
              <button class="status-pill open" id="statusToggle" onclick="toggleStatus()"><span class="dot"></span><span id="statusToggleLabel">Открыта</span></button>
            </div>
          </div>
          <div class="t-info-grid" id="tInfoGrid"></div>
        </div>

        <div class="chat-msgs" id="chatMsgs"></div>

        <div class="composer-card">
          <textarea class="composer-ta" id="replyInp" rows="1" placeholder="Написать ответ клиенту…" oninput="autoResize(this)"></textarea>
          <div class="composer-toolbar">
            <button class="cab-btn primary sm" onclick="saveReply()">Сохранить ответ<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const API = 'https://antviz.ru/api';

let allTickets=[], allOrders=[], currentFilter='all', selectedId=null;
const AVATAR_COLORS=['#1ede7b','#3b82f6','#8b5cf6','#f59e0b','#ec4899','#14b8a6','#6366f1'];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className=`toast ${t} show`;setTimeout(()=>el.className='toast',3400);}
function fmtDT(ts){if(!ts)return'—';const d=new Date(ts);return d.toLocaleDateString('ru',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});}
function toDate(ts){return ts?new Date(ts):null;}
function timeAgo(ts){
  const d=toDate(ts); if(!d) return '—';
  const diffMs=Date.now()-d.getTime(); const min=Math.floor(diffMs/60000);
  if(min<1) return 'только что';
  if(min<60) return min+' мин назад';
  const h=Math.floor(min/60);
  if(h<24) return h+' ч назад';
  const days=Math.floor(h/24);
  return days+' дн назад';
}
function hoursSince(ts){const d=toDate(ts); if(!d) return 0; return(Date.now()-d.getTime())/36e5;}
function isUrgent(t){return t.status!=='done' && t.status!=='awaiting_payment' && !t.adminReply && hoursSince(t.createdAt)>24;}
function initials(name){const parts=String(name||'?').trim().split(/\s+/);return((parts[0]?.[0]||'')+(parts[1]?.[0]||'')).toUpperCase()||'?';}
function avatarColor(seed){let h=0;for(const c of String(seed||''))h=(h*31+c.charCodeAt(0))>>>0;return AVATAR_COLORS[h%AVATAR_COLORS.length];}

window.showScreen=function(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const map={list:'screenList',ticket:'screenTicket'};
  document.getElementById(map[name]).classList.add('active');
  document.getElementById('kebabMenu')?.classList.remove('show');
};
window.toggleKebab=()=>{document.getElementById('kebabMenu').classList.toggle('show');};
document.addEventListener('click',e=>{
  const menu=document.getElementById('kebabMenu');
  if(menu && menu.classList.contains('show') && !menu.contains(e.target) && !e.target.closest('.kebab-wrap .cab-btn')) menu.classList.remove('show');
});

window.switchFilter=(f,btn)=>{currentFilter=f;document.querySelectorAll('#segRow .cab-tab').forEach(b=>b.classList.toggle('is-active',b===btn));renderTickets();};
window.applyUrgentFilter=()=>{
  document.getElementById('sortSel').value='urgent';
  currentFilter='open';
  document.querySelectorAll('#segRow .cab-tab').forEach(b=>b.classList.toggle('is-active',b.dataset.f==='open'));
  renderTickets();
  const first=allTickets.find(isUrgent);
  if(first)window.openTicket(first.id);
};

function renderTickets(){
  const el=document.getElementById('ticketsList');
  const q=(document.getElementById('searchInp').value||'').toLowerCase();
  const sort=document.getElementById('sortSel').value;
  let list=allTickets;
  if(currentFilter==='open') list=list.filter(t=>t.status!=='done');
  else if(currentFilter==='done') list=list.filter(t=>t.status==='done');
  if(q) list=list.filter(t=>(t.title||'').toLowerCase().includes(q)||(t.userName||'').toLowerCase().includes(q)||(t.userEmail||'').toLowerCase().includes(q)||(t.orderDomain||'').toLowerCase().includes(q));

  list=[...list];
  if(sort==='urgent') list.sort((a,b)=>(isUrgent(b)-isUrgent(a))||(new Date(b.createdAt||0)-new Date(a.createdAt||0)));
  else if(sort==='old') list.sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));
  else list.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));

  const open=allTickets.filter(t=>t.status!=='done').length;
  const done=allTickets.filter(t=>t.status==='done').length;
  const urgentList=allTickets.filter(isUrgent);
  document.getElementById('statOpen').textContent=open;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statUrgent').textContent=urgentList.length;
  document.getElementById('cntAll').textContent=allTickets.length;
  document.getElementById('cntOpen').textContent=open;
  document.getElementById('cntDone').textContent=done;
  const badge=document.getElementById('navBadgeTickets');
  if(badge){badge.style.display=open?'':'none';badge.textContent=open;}
  const strip=document.getElementById('urgentStrip');
  if(urgentList.length){strip.style.display='flex';document.getElementById('urgentStripText').textContent=`${urgentList.length} заявок ожидают ответа больше суток — нажмите, чтобы посмотреть`;}
  else strip.style.display='none';

  if(!list.length){el.innerHTML=`<div class="cab-empty"><h3>Нет заявок по текущим фильтрам</h3></div>`;return;}

  el.innerHTML=list.map(t=>{
    const urgent=isUrgent(t);
    return`<div class="ti" onclick="openTicket('${t.id}')">
      <div class="avatar-circle" style="background:${avatarColor(t.userEmail||t.userName)}">${initials(t.userName)}</div>
      <div class="ti-body">
        <div class="ti-top">
          <div class="ti-subj">${t.adminReply?'<span class="answered-dot" title="Есть ответ"></span>':''}<span class="ti-subj-text">${esc(t.title||'Без темы')}</span></div>
          ${urgent?'<span class="cab-badge red">Срочно</span>':t.status==='awaiting_payment'?'<span class="cab-badge amber">Не оплачено</span>':`<span class="cab-badge ${t.status==='done'?'':'blue'}">${t.status==='done'?'Закрыта':'Открыта'}</span>`}
        </div>
        ${t.description?`<div class="ti-prev">${esc(t.description)}</div>`:''}
        <div class="ti-meta"><span>${esc(t.userName||'—')}</span><span>·</span><span>${esc(t.userEmail||'—')}</span><span>·</span><span>${timeAgo(t.createdAt)}</span></div>
      </div>
    </div>`;
  }).join('');
}

window.openTicket=function(id){
  selectedId=id;
  const t=allTickets.find(x=>x.id===id);if(!t)return;
  showScreen('ticket');

  document.getElementById('tAvatar').textContent=initials(t.userName);
  document.getElementById('tAvatar').style.background=avatarColor(t.userEmail||t.userName);
  document.getElementById('tSubj').textContent=t.title||'Без темы';
  document.getElementById('tUserRow').innerHTML=`<span>${esc(t.userName||'—')}</span><span>·</span><span>${esc(t.userEmail||'—')}</span>`;
  document.getElementById('urgentTag').style.display=isUrgent(t)?'inline-flex':'none';
  applyStatusToggle(t.status);

  const orderBlock = t.orderId
    ? `<div class="t-info-item"><span class="t-info-label">Заказ</span><a class="t-info-val t-order-link" href="/admin/orders?id=${t.orderId}" target="_blank" rel="noopener">${esc(t.orderDomain||'№ '+t.orderId.slice(0,8).toUpperCase())}${t.orderSiteType?' · '+esc(t.orderSiteType):''} ↗</a></div>`
    : `<div class="t-info-item"><span class="t-info-label">Заказ</span><span class="t-info-val t-no-order">⚠ Не привязан</span></div>`;
  const billingLabel = t.billing==='subscription' ? 'По подписке (ТО)' : t.billing==='once' ? 'Разовая оплата' : '—';
  const paidBlock = t.billing==='once'
    ? `<div class="t-info-item"><span class="t-info-label">Оплата</span><span class="t-info-val" style="color:${t.paid?'var(--green-text)':'var(--amber)'}">${t.paid?'Оплачено ✓'+(t.paidAt?' · '+fmtDT(t.paidAt):''):'Не оплачено'}</span></div>`
    : '';
  document.getElementById('tInfoGrid').innerHTML=`
    <div class="t-info-item"><span class="t-info-label">Создана</span><span class="t-info-val">${fmtDT(t.createdAt)}</span></div>
    <div class="t-info-item"><span class="t-info-label">Тип оплаты</span><span class="t-info-val">${billingLabel}</span></div>
    ${paidBlock}
    ${orderBlock}
  `;

  const msgs=document.getElementById('chatMsgs');
  const images = t.images&&t.images.length ? `<div class="msg-images">${t.images.map(src=>`<img class="msg-img" src="${src}" alt="" onclick="showLightbox('${src}')"/>`).join('')}</div>` : '';
  msgs.innerHTML = `
    <div class="msg-wrap">
      <div class="msg-label">${esc(t.userName||'Клиент')}</div>
      <div class="msg usr">${esc(t.description||'Без описания')}${images}<span class="msg-time">${fmtDT(t.createdAt)}</span></div>
    </div>
    ${t.adminReply ? `<div class="msg-wrap">
      <div class="msg-label sup" style="text-align:right">Поддержка</div>
      <div class="msg sup" style="align-self:flex-end">${esc(t.adminReply)}</div>
    </div>` : `<div class="no-reply-hint">Ответа пока нет — напишите его ниже</div>`}
  `;
  document.getElementById('replyInp').value=t.adminReply||'';
  autoResize(document.getElementById('replyInp'));
};

function applyStatusToggle(status){
  const btn=document.getElementById('statusToggle');
  const isDone=status==='done';
  btn.classList.toggle('open',!isDone);
  btn.classList.toggle('done',isDone);
  document.getElementById('statusToggleLabel').textContent=isDone?'Закрыта':'Открыта';
}

window.toggleStatus=async function(){
  if(!selectedId)return;
  const t=allTickets.find(x=>x.id===selectedId); if(!t)return;
  const next = t.status==='done' ? 'open' : 'done';
  try{
    const resp = await fetch(`${API}/service-tickets/${selectedId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ status: next }) });
    if(!resp.ok) throw new Error();
    t.status=next; applyStatusToggle(next);
    toast(next==='done'?'Заявка закрыта ✓':'Заявка снова открыта','success');
    renderTickets();
  }catch(e){toast('Ошибка','error');}
};

window.saveReply=async function(){
  if(!selectedId)return;
  const val=document.getElementById('replyInp').value.trim();
  const t=allTickets.find(x=>x.id===selectedId); if(!t)return;
  try{
    const resp = await fetch(`${API}/service-tickets/${selectedId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ adminReply: val }) });
    if(!resp.ok) throw new Error();
    t.adminReply=val;
    if(t.uid&&val)await fetch(`${API}/notifications/broadcast`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({target:t.uid,type:'service',title:'💬 Ответ на заявку',text:`«${t.title||''}»: ${val}`})}).catch(()=>{});
    toast('Ответ сохранён и клиент уведомлён ✓','success');
    window.openTicket(selectedId);
    renderTickets();
  }catch(e){toast('Ошибка','error');}
};

window.deleteTick=async function(){
  if(!selectedId||!confirm('Удалить заявку?'))return;
  try{
    const resp = await fetch(`${API}/service-tickets/${selectedId}`, { method:'DELETE', credentials:'include' });
    if(!resp.ok) throw new Error();
    allTickets=allTickets.filter(t=>t.id!==selectedId);
    toast('Заявка удалена','info');selectedId=null;
    showScreen('list');
    renderTickets();
  }catch(e){toast('Ошибка','error');}
};

window.notifyExpiry=async uid=>{
  if(!uid)return;
  try{
    const resp = await fetch(`${API}/notifications/broadcast`, {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ target: uid, type:'service', title:'⚠️ Обслуживание заканчивается', text:'До окончания обслуживания осталось менее 3 дней. Свяжитесь с поддержкой для продления.' }),
    });
    if(!resp.ok) throw new Error();
    toast('Уведомление отправлено ✓','success');
  }catch(e){toast('Ошибка','error');}
};

window.autoResize=function(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px';};
window.showLightbox=function(src){document.getElementById('lbImg').src=src;document.getElementById('lightbox').classList.add('show');};

function renderSupports(){
  const el=document.getElementById('supportsList');
  const now=new Date();
  const active=allOrders.filter(o=>{
    if(!(o.supportActive===true))return false;
    if(o.supportExpiresAt){const exp=new Date(o.supportExpiresAt);return exp>now;}
    return true;
  });
  document.getElementById('statSupports').textContent=active.length;
  if(!active.length){el.innerHTML=`<div style="color:rgba(255,255,255,.3);font-size:14px">Нет активных обслуживаний</div>`;return;}
  const withMeta=active.map(o=>{
    let days=Infinity,pct=100,expiring=false;
    if(o.supportExpiresAt){
      const exp=new Date(o.supportExpiresAt);
      days=Math.ceil((exp-now)/864e5);pct=Math.max(0,Math.min(100,((exp-now)/(30*864e5))*100));expiring=days<3;
    }
    return{o,days,pct,expiring};
  }).sort((a,b)=>a.days-b.days);
  el.innerHTML=withMeta.map(({o,days,pct,expiring})=>`<div class="sup-card${expiring?' expiring':''}">
      <div class="sup-name">${esc(o.clientName||'—')}</div>
      <div class="sup-email">${esc(o.clientEmail||'—')}</div>
      ${days!==Infinity?`<div>
        <div class="sup-prog-labels"><span>Осталось</span><span style="color:${expiring?'#f59e0b':'rgba(255,255,255,.4)'}">${days} дн.</span></div>
        <div class="sup-prog"><div class="sup-prog-fill${expiring?' warn':''}" style="width:${pct}%"></div></div>
      </div>`:'<div style="font-size:11.5px;color:rgba(255,255,255,.35)">Бессрочно</div>'}
      ${expiring?`<button class="cab-btn ghost sm" style="margin-top:10px" onclick="notifyExpiry('${o.uid||''}')">🔔 Уведомить</button>`:''}
    </div>`).join('');
}

async function loadTickets(){
  try{
    const resp = await fetch(`${API}/service-tickets/admin/all`, { credentials:'include' });
    if(!resp.ok) return;
    const list = await resp.json();
    allTickets=list.sort((a,b)=>{
      if((a.status==='done')!==(b.status==='done'))return a.status==='done'?1:-1;
      return new Date(b.createdAt||0)-new Date(a.createdAt||0);
    });
  }catch(e){console.error(e);}
}

window.doLogout=async()=>{
  try{ await fetch(`${API}/auth/logout`, { method:'POST', credentials:'include' }); }catch(e){}
  window.location.href='/';
};

(async function initAdminTickets(){
  let user = null;
  try{
    const resp = await fetch(`${API}/auth/me`, { credentials:'include' });
    if(resp.ok) user = await resp.json();
  }catch(e){}

  if(!user){document.getElementById('loadingScreen').style.display='none';window.location.href='/';return;}
  document.getElementById('loadingScreen').style.display='none';
  if(user.role!=='admin'){window.location.href='/';return;}
  document.getElementById('sbContent').style.display='block';

  fetch(`${API}/orders/admin/all`, { credentials:'include' }).then(r=>r.ok?r.json():[]).then(orders=>{
    const n=orders.filter(o=>o.refundStatus==='requested').length;
    const b=document.getElementById('navBadgeOrders');
    if(b){b.style.display=n?'':'none';b.textContent=n;}
    allOrders=orders;
    renderSupports();
  }).catch(()=>{});

  fetch(`${API}/enterprise/admin/all`, { credentials:'include' }).then(r=>r.ok?r.json():[]).then(apps=>{
    const n=apps.filter(a=>a.status==='new').length;
    const b=document.getElementById('navBadgeEnterprise');
    if(b){b.style.display=n?'':'none';b.textContent=n;}
  }).catch(()=>{});

  await loadTickets();renderTickets();
  setInterval(async()=>{
    await loadTickets();renderTickets();
    if(selectedId){
      const t=allTickets.find(x=>x.id===selectedId);
      if(t){ applyStatusToggle(t.status); document.getElementById('urgentTag').style.display=isUrgent(t)?'inline-flex':'none'; }
    }
  },30000);
})();
</script>
