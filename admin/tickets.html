<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Обслуживание — Antviz Admin.</title>
<link rel="icon" href="../img/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f3f4f7}
:root{
  --green:#1ede7b;--green-h:#17c96a;--green-d:#0f9950;--green-soft:#e5faee;--green-soft2:#d1f5e0;
  --orange:#f59e0b;--orange-d:#b8720a;--orange-soft:#fef2e0;
  --red:#e8634f;--red-soft:#fdeae7;--info:#3b82f6;--info-soft:#eaf2fe;--purple:#8b5cf6;--purple-soft:#f1ecfe;
  --bg:#f3f4f7;--card:#ffffff;
  --text:#14171c;--muted:#818997;--muted2:#aeb4bf;--line:#e6e8ec;--line2:#dcdfe4;
  --dark:#14171c;
  --font:'Geologica','Inter',sans-serif;
  --r-xs:10px;--r-sm:14px;--r-md:18px;--r-lg:22px;--r-xl:28px;--r-pill:999px;
  --sh-sm:0 1px 2px rgba(20,23,30,.04);
  --sh-md:0 12px 28px rgba(20,23,30,.09),0 2px 8px rgba(20,23,30,.05);
  --sh-lg:0 28px 64px rgba(20,23,30,.16),0 8px 20px rgba(20,23,30,.07);
  --maxw:920px;
}
body{color:var(--text);font-family:var(--font);font-weight:300;font-size:15.5px;-webkit-font-smoothing:antialiased}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

.ls{position:fixed;inset:0;z-index:9000;background:var(--dark);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.sp{width:26px;height:26px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
.lt{font-size:13px;color:rgba(255,255,255,.35)}

.app{display:none;height:100vh;overflow:hidden;flex-direction:column;background:var(--bg)}

/* MOBILE MENU BUTTON — real menu comes later via m-panel26.js */
.m-trigger{display:none;position:fixed;top:16px;left:16px;z-index:120;width:42px;height:42px;border-radius:var(--r-sm);border:none;background:var(--card);box-shadow:var(--sh-md);color:var(--text);align-items:center;justify-content:center;cursor:pointer}
.m-trigger svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;fill:none}

.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--bg)}
.screen.active{display:flex;animation:fadeUp .22s ease both}
.screen-stack{position:relative;flex:1;min-height:0}

.icon-btn{width:40px;height:40px;border-radius:var(--r-sm);border:none;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .12s}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.icon-btn.ghost{background:none}
.icon-btn.ghost:hover{background:var(--line)}
.back-label{display:none;font-size:.86rem;font-weight:500;white-space:nowrap}

/* ===== SCREEN 1 — LIST ===== */
#screenList .inner{max-width:var(--maxw);width:100%;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;height:100%;overflow-y:auto}
.list-head{padding-top:36px;flex-shrink:0}
.page-title{font-size:1.7rem;font-weight:500;letter-spacing:-.02em;margin-bottom:20px}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:18px 20px;display:flex;align-items:center;gap:14px}
.stat-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-ic svg{width:19px;height:19px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.stat-ic.si-open{background:var(--info-soft)}.stat-ic.si-open svg{stroke:var(--info)}
.stat-ic.si-done{background:var(--green-soft)}.stat-ic.si-done svg{stroke:var(--green-d)}
.stat-ic.si-urgent{background:var(--red-soft)}.stat-ic.si-urgent svg{stroke:var(--red)}
.stat-ic.si-sup{background:var(--purple-soft)}.stat-ic.si-sup svg{stroke:var(--purple)}
.stat-num{font-size:1.4rem;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat-lbl{font-size:.78rem;color:var(--muted);margin-top:2px}

.urgent-strip{display:flex;align-items:center;gap:10px;background:var(--red-soft);border:1.5px solid #f7d3cc;border-radius:var(--r-md);padding:14px 20px;margin-bottom:20px;font-size:.88rem;color:var(--red);font-weight:500;cursor:pointer}
.urgent-strip svg{width:17px;height:17px;stroke:var(--red);stroke-width:2;fill:none;flex-shrink:0}

.sup-section{background:var(--dark);border-radius:var(--r-xl);padding:26px 28px;margin-bottom:20px;flex-shrink:0}
.sup-title{font-size:1.1rem;font-weight:500;color:#fff;letter-spacing:-.02em;margin-bottom:16px}
.sup-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.sup-card{background:rgba(255,255,255,.06);border-radius:var(--r-md);padding:16px 18px;min-width:220px;flex-shrink:0}
.sup-card.expiring{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.28)}
.sup-name{font-size:.94rem;font-weight:500;color:#fff;margin-bottom:2px}
.sup-email{font-size:.76rem;color:rgba(255,255,255,.4);margin-bottom:12px}
.sup-prog-labels{display:flex;justify-content:space-between;font-size:.72rem;color:rgba(255,255,255,.35);margin-bottom:6px}
.sup-prog{height:4px;background:rgba(255,255,255,.1);border-radius:3px}
.sup-prog-fill{height:100%;border-radius:3px;background:var(--green)}
.sup-prog-fill.warn{background:linear-gradient(90deg,var(--orange),var(--red))}

.ctrl-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;flex-shrink:0}
.sb-box{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:.75rem 1rem;transition:border-color .15s,box-shadow .15s;flex:1;min-width:220px;max-width:400px}
.sb-box:focus-within{border-color:var(--green);box-shadow:0 0 0 4px rgba(30,222,123,.1)}
.sb-box svg{width:16px;height:16px;stroke:var(--muted);flex-shrink:0;stroke-width:2;fill:none}
.sb-box input{background:none;border:none;outline:none;font-family:var(--font);font-size:.9rem;font-weight:300;color:var(--text);width:100%}
.seg{display:inline-flex;background:var(--line);border-radius:var(--r-pill);padding:4px;gap:2px}
.seg-btn{border:none;background:none;font-family:var(--font);font-size:.85rem;font-weight:400;color:var(--muted);padding:.5rem 1rem;border-radius:var(--r-pill);cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s,color .15s}
.seg-btn.active{background:var(--card);color:var(--text);font-weight:500;box-shadow:var(--sh-sm)}
.seg-count{font-size:.72rem;background:rgba(0,0,0,.07);padding:.08rem .42rem;border-radius:var(--r-pill)}
.seg-btn.active .seg-count{background:var(--green-soft);color:var(--green-d)}
.sort-sel{margin-left:auto;background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:.55rem 1rem;font-family:var(--font);font-size:.83rem;color:var(--muted);cursor:pointer;outline:none}

.tickets-scroll{flex:1;padding:2px 2px 32px;display:flex;flex-direction:column;gap:10px}
.ti{display:flex;gap:16px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s;animation:fadeUp .2s ease both}
.ti:hover{border-color:var(--line2);box-shadow:var(--sh-md);transform:translateY(-1px)}
.ti-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:.85rem;font-weight:600}
.ti-body{flex:1;min-width:0}
.ti-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:5px}
.ti-subj{font-size:.98rem;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px;min-width:0}
.ti-subj-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.answered-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.ti-prev{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.ti-meta{font-size:.76rem;color:var(--muted2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.empty-l{text-align:center;padding:70px 16px;color:var(--muted);font-size:.9rem}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:.28rem .7rem;border-radius:var(--r-pill);font-size:.7rem;font-weight:500;white-space:nowrap;flex-shrink:0}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.b-open{background:var(--info-soft);color:var(--info)}
.b-done{background:var(--green-soft);color:var(--green-d)}
.b-urgent{background:var(--red-soft);color:var(--red)}

/* ===== SCREEN 2 — TICKET DETAIL ===== */
#screenTicket .inner{max-width:var(--maxw);width:100%;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;height:100%;overflow:hidden}
.t-topbar{display:flex;align-items:center;gap:12px;padding:24px 0 16px;flex-shrink:0}
.t-topbar .grow{flex:1}

.t-info-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:18px;flex-shrink:0}
.t-info-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.t-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:1rem;font-weight:600}
.t-who{flex:1;min-width:0}
.t-subj{font-size:1.15rem;font-weight:500;letter-spacing:-.02em;margin-bottom:4px}
.t-user-row{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t-status-toggle{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.status-pill{display:inline-flex;align-items:center;gap:7px;padding:.5rem .9rem;border-radius:var(--r-pill);font-size:.8rem;font-weight:500;border:none;cursor:pointer;transition:filter .12s}
.status-pill:hover{filter:brightness(.97)}
.status-pill .dot{width:7px;height:7px;border-radius:50%}
.status-pill.open{background:var(--info-soft);color:var(--info)}
.status-pill.open .dot{background:var(--info)}
.status-pill.done{background:var(--line);color:var(--muted)}
.status-pill.done .dot{background:var(--muted2)}
.urgent-tag{font-size:.72rem;font-weight:500;color:var(--red);background:var(--red-soft);padding:.24rem .6rem;border-radius:var(--r-pill)}
.t-info-grid{display:flex;flex-wrap:wrap;gap:10px 28px;border-top:1px solid var(--line);padding-top:14px}
.t-info-item{display:flex;flex-direction:column;gap:3px}
.t-info-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);font-weight:500}
.t-info-val{font-size:.85rem;color:var(--text)}
.t-order-link{color:var(--green-d);text-decoration:none;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.t-order-link:hover{text-decoration:underline}
.t-no-order{color:var(--orange-d)}

.chat-msgs{flex:1;overflow-y:auto;padding:4px 2px 20px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth;min-height:0}
.msg-wrap{display:flex;flex-direction:column;margin-bottom:4px;animation:fadeUp .18s ease both}
.msg-label{font-size:.7rem;font-weight:500;margin-bottom:5px;color:var(--muted)}
.msg-label.sup{color:var(--green-d)}
.msg{padding:13px 17px;border-radius:var(--r-md);max-width:78%;font-size:.92rem;line-height:1.55;word-break:break-word}
.msg.usr{background:var(--card);color:var(--text);align-self:flex-start;border-bottom-left-radius:6px;border:1.5px solid var(--line)}
.msg.sup{background:var(--green-soft);color:#0d3320;align-self:flex-end;border-bottom-right-radius:6px}
.msg-time{font-size:.68rem;color:var(--muted2);display:block;margin-top:7px}
.msg-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.msg-img{width:96px;height:96px;border-radius:var(--r-sm);object-fit:cover;cursor:pointer}
.no-reply-hint{text-align:center;color:var(--muted);font-size:.84rem;padding:14px 0}

.composer{flex-shrink:0;padding:14px 2px 22px}
.composer-card{background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-lg);box-shadow:var(--sh-sm);transition:border-color .15s,box-shadow .15s;overflow:hidden}
.composer-card:focus-within{border-color:var(--green);box-shadow:0 0 0 4px rgba(30,222,123,.1)}
.composer-ta{width:100%;background:none;border:none;outline:none;resize:none;font-family:var(--font);font-size:.92rem;font-weight:300;color:var(--text);padding:16px 18px 8px;min-height:24px;max-height:160px;line-height:1.5}
.composer-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:8px 10px 10px 10px}
.composer-send{display:flex;align-items:center;gap:7px;background:var(--green);color:var(--dark);border:none;border-radius:var(--r-pill);padding:.55rem 1.15rem;font-family:var(--font);font-weight:500;font-size:.85rem;cursor:pointer;transition:background .15s;flex-shrink:0}
.composer-send:hover{background:var(--green-h)}
.composer-send svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.3;fill:none}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:500;font-size:.88rem;border:none;border-radius:var(--r-sm);padding:.75rem 1.3rem;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-green{background:var(--green);color:var(--dark);box-shadow:0 8px 20px rgba(30,222,123,.28)}.btn-green:hover{background:var(--green-h)}
.btn-outline{background:var(--card);border:1.5px solid var(--line2);color:var(--muted)}.btn-outline:hover{border-color:var(--muted2);color:var(--text)}
.btn-danger{background:var(--red-soft);color:var(--red)}.btn-danger:hover{background:#fbdbd6}
.btn-block{width:100%;justify-content:center;padding:.8rem 1rem;font-size:.86rem}

/* KEBAB */
.kebab-wrap{position:relative;flex-shrink:0}
.kebab-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border-radius:var(--r-md);box-shadow:var(--sh-lg);border:1.5px solid var(--line);padding:10px;width:200px;z-index:60;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .15s,transform .15s;display:flex;flex-direction:column;gap:6px}
.kebab-menu.show{opacity:1;pointer-events:all;transform:none}

.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(10,12,16,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.lightbox.show{opacity:1;pointer-events:all}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:var(--r-md);object-fit:contain}
.lb-x{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:28px;right:28px;z-index:900;padding:.8rem 1.5rem;border-radius:var(--r-md);font-size:.86rem;font-weight:500;opacity:0;box-shadow:var(--sh-lg);transition:opacity .2s,transform .2s;pointer-events:none;transform:translateY(8px)}
.toast.show{opacity:1;transform:none}
.toast.success{background:var(--green);color:#0d3320}.toast.error{background:var(--red);color:#fff}.toast.info{background:var(--dark);color:#fff}.toast.warn{background:var(--orange);color:#fff}

/* MOBILE */
@media (max-width:760px){
  .m-trigger{display:flex}
  #screenList .inner,#screenTicket .inner{padding:0 16px}
  .list-head{padding-top:70px}
  .page-title{font-size:1.4rem}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .sort-sel{margin-left:0}
  .t-topbar{padding-top:16px}
  .msg{max-width:88%}
  .t-info-card{padding:18px}
  .t-info-top{flex-wrap:wrap}
  .t-status-toggle{align-items:flex-start;width:100%}
  #screenTicket .t-topbar .exit-btn{width:auto;padding:0 16px 0 12px;gap:7px;justify-content:flex-start;border-radius:var(--r-pill);background:var(--card);box-shadow:var(--sh-sm)}
  .back-label{display:inline}
}
</style>
</head>
<body>

<div class="ls" id="loadingScreen"><div class="sp"></div><span class="lt">Загрузка...</span></div>

<button class="m-trigger" id="mTrigger" onclick="window.openMPanel26 && window.openMPanel26()">
  <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')">
  <button class="lb-x">✕</button>
  <img id="lbImg" src="" alt=""/>
</div>

<div class="app" id="appWrap">
  <div class="screen-stack">

    <!-- SCREEN 1: LIST -->
    <div class="screen active" id="screenList">
      <div class="inner">
        <div class="list-head">
          <span class="page-title">Обслуживание</span>

          <div class="stat-row">
            <div class="stat-card"><div class="stat-ic si-open"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><div><div class="stat-num" id="statOpen">—</div><div class="stat-lbl">Открытых заявок</div></div></div>
            <div class="stat-card"><div class="stat-ic si-urgent"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2.7 17a2 2 0 001.7 3h15.2a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg></div><div><div class="stat-num" id="statUrgent">—</div><div class="stat-lbl">Без ответа &gt;24ч</div></div></div>
            <div class="stat-card"><div class="stat-ic si-done"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><div><div class="stat-num" id="statDone">—</div><div class="stat-lbl">Закрытых заявок</div></div></div>
            <div class="stat-card"><div class="stat-ic si-sup"><svg viewBox="0 0 24 24"><path d="M2 9a3 3 0 010-6h20a3 3 0 010 6"/><path d="M2 15a3 3 0 000 6h20a3 3 0 000-6"/><path d="M6 12h12"/></svg></div><div><div class="stat-num" id="statSupports">—</div><div class="stat-lbl">Активных обслуживаний</div></div></div>
          </div>

          <div class="urgent-strip" id="urgentStrip" style="display:none" onclick="applyUrgentFilter()">
            <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2.7 17a2 2 0 001.7 3h15.2a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
            <span id="urgentStripText"></span>
          </div>

          <div class="sup-section">
            <div class="sup-title">Активные обслуживания</div>
            <div class="sup-scroll" id="supportsList">
              <div style="color:rgba(255,255,255,.3);font-size:.88rem">Загрузка...</div>
            </div>
          </div>

          <div class="ctrl-row">
            <div class="sb-box">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="text" placeholder="Поиск по имени, email, заявке..." id="searchInp" oninput="renderTickets()"/>
            </div>
            <div class="seg" id="segRow">
              <button class="seg-btn active" data-f="all" onclick="switchFilter('all',this)">Все <span class="seg-count" id="cntAll">0</span></button>
              <button class="seg-btn" data-f="open" onclick="switchFilter('open',this)">Открытые <span class="seg-count" id="cntOpen">0</span></button>
              <button class="seg-btn" data-f="done" onclick="switchFilter('done',this)">Закрытые <span class="seg-count" id="cntDone">0</span></button>
            </div>
            <select class="sort-sel" id="sortSel" onchange="renderTickets()">
              <option value="urgent">Сначала срочные</option>
              <option value="new">Сначала новые</option>
              <option value="old">Сначала старые</option>
            </select>
          </div>
        </div>

        <div class="tickets-scroll" id="ticketsList">
          <div class="empty-l">Загрузка...</div>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: TICKET DETAIL -->
    <div class="screen" id="screenTicket">
      <div class="inner">
        <div class="t-topbar">
          <button class="icon-btn ghost exit-btn" onclick="showScreen('list')"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span class="back-label">Выйти из заявки</span></button>
          <span class="grow"></span>
          <div class="kebab-wrap">
            <button class="icon-btn ghost" onclick="toggleKebab()"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
            <div class="kebab-menu" id="kebabMenu">
              <button class="btn btn-danger btn-block" onclick="deleteTick()">Удалить заявку</button>
            </div>
          </div>
        </div>

        <div class="t-info-card">
          <div class="t-info-top">
            <div class="t-avatar" id="tAvatar"></div>
            <div class="t-who">
              <div class="t-subj" id="tSubj">—</div>
              <div class="t-user-row" id="tUserRow"></div>
            </div>
            <div class="t-status-toggle">
              <span class="urgent-tag" id="urgentTag" style="display:none">Ждёт ответа &gt;24ч</span>
              <button class="status-pill open" id="statusToggle" onclick="toggleStatus()"><span class="dot"></span><span id="statusToggleLabel">Открыта</span></button>
            </div>
          </div>
          <div class="t-info-grid" id="tInfoGrid"></div>
        </div>

        <div class="chat-msgs" id="chatMsgs"></div>

        <div class="composer">
          <div class="composer-card">
            <textarea class="composer-ta" id="replyInp" rows="1" placeholder="Написать ответ клиенту..." oninput="autoResize(this)"></textarea>
            <div class="composer-toolbar">
              <button class="composer-send" onclick="saveReply()">Сохранить ответ<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const API = 'https://antviz.ru/api';

let allTickets=[], allOrders=[], currentFilter='all', sortMode='urgent', selectedId=null;
const AVATAR_COLORS=['#1ede7b','#3b82f6','#8b5cf6','#f59e0b','#ec4899','#14b8a6','#6366f1'];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className=`toast ${t} show`;setTimeout(()=>el.className='toast',3400);}
function fmtDT(ts){if(!ts)return'—';const d=new Date(ts);return d.toLocaleDateString('ru',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});}
function toDate(ts){return ts?new Date(ts):null;}
function timeAgo(ts){
  const d=toDate(ts); if(!d) return '—';
  const diffMs=Date.now()-d.getTime(); const min=Math.floor(diffMs/60000);
  if(min<1) return 'только что';
  if(min<60) return min+' мин назад';
  const h=Math.floor(min/60);
  if(h<24) return h+' ч назад';
  const days=Math.floor(h/24);
  return days+' дн назад';
}
function hoursSince(ts){const d=toDate(ts); if(!d) return 0; return(Date.now()-d.getTime())/36e5;}
function isUrgent(t){return t.status!=='done' && !t.adminReply && hoursSince(t.createdAt)>24;}
function initials(name){const parts=String(name||'?').trim().split(/\s+/);return((parts[0]?.[0]||'')+(parts[1]?.[0]||'')).toUpperCase()||'?';}
function avatarColor(seed){let h=0;for(const c of String(seed||''))h=(h*31+c.charCodeAt(0))>>>0;return AVATAR_COLORS[h%AVATAR_COLORS.length];}

window.showScreen=function(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const map={list:'screenList',ticket:'screenTicket'};
  document.getElementById(map[name]).classList.add('active');
  document.getElementById('kebabMenu')?.classList.remove('show');
};
window.toggleKebab=()=>{document.getElementById('kebabMenu').classList.toggle('show');};
document.addEventListener('click',e=>{
  const menu=document.getElementById('kebabMenu');
  if(menu && menu.classList.contains('show') && !menu.contains(e.target) && !e.target.closest('.kebab-wrap .icon-btn')) menu.classList.remove('show');
});

window.switchFilter=(f,btn)=>{currentFilter=f;document.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active',b===btn));renderTickets();};
window.applyUrgentFilter=()=>{
  document.getElementById('sortSel').value='urgent';
  currentFilter='open';
  document.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.f==='open'));
  renderTickets();
  const first=allTickets.find(isUrgent);
  if(first)window.openTicket(first.id);
};

function renderTickets(){
  const el=document.getElementById('ticketsList');
  const q=(document.getElementById('searchInp').value||'').toLowerCase();
  const sort=document.getElementById('sortSel').value;
  let list=allTickets;
  if(currentFilter==='open') list=list.filter(t=>t.status!=='done');
  else if(currentFilter==='done') list=list.filter(t=>t.status==='done');
  if(q) list=list.filter(t=>(t.title||'').toLowerCase().includes(q)||(t.userName||'').toLowerCase().includes(q)||(t.userEmail||'').toLowerCase().includes(q)||(t.orderDomain||'').toLowerCase().includes(q));

  list=[...list];
  if(sort==='urgent') list.sort((a,b)=>(isUrgent(b)-isUrgent(a))||(new Date(b.createdAt||0)-new Date(a.createdAt||0)));
  else if(sort==='old') list.sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));
  else list.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));

  const open=allTickets.filter(t=>t.status!=='done').length;
  const done=allTickets.filter(t=>t.status==='done').length;
  const urgentList=allTickets.filter(isUrgent);
  document.getElementById('statOpen').textContent=open;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statUrgent').textContent=urgentList.length;
  document.getElementById('cntAll').textContent=allTickets.length;
  document.getElementById('cntOpen').textContent=open;
  document.getElementById('cntDone').textContent=done;
  const badge=document.getElementById('navBadgeTickets');
  if(badge){badge.style.display=open?'':'none';badge.textContent=open;}
  const strip=document.getElementById('urgentStrip');
  if(urgentList.length){strip.style.display='flex';document.getElementById('urgentStripText').textContent=`${urgentList.length} заявок ожидают ответа больше суток — нажмите, чтобы посмотреть`;}
  else strip.style.display='none';

  if(!list.length){el.innerHTML=`<div class="empty-l">Нет заявок по текущим фильтрам</div>`;return;}

  el.innerHTML=list.map(t=>{
    const urgent=isUrgent(t);
    return`<div class="ti" onclick="openTicket('${t.id}')">
      <div class="ti-avatar" style="background:${avatarColor(t.userEmail||t.userName)}">${initials(t.userName)}</div>
      <div class="ti-body">
        <div class="ti-top">
          <div class="ti-subj">${t.adminReply?'<span class="answered-dot" title="Есть ответ"></span>':''}<span class="ti-subj-text">${esc(t.title||'Без темы')}</span></div>
          ${urgent?'<span class="badge b-urgent">Срочно</span>':`<span class="badge ${t.status==='done'?'b-done':'b-open'}">${t.status==='done'?'Закрыта':'Открыта'}</span>`}
        </div>
        ${t.description?`<div class="ti-prev">${esc(t.description)}</div>`:''}
        <div class="ti-meta"><span>${esc(t.userName||'—')}</span><span>·</span><span>${esc(t.userEmail||'—')}</span><span>·</span><span>${timeAgo(t.createdAt)}</span></div>
      </div>
    </div>`;
  }).join('');
}

window.openTicket=function(id){
  selectedId=id;
  const t=allTickets.find(x=>x.id===id);if(!t)return;
  showScreen('ticket');

  document.getElementById('tAvatar').textContent=initials(t.userName);
  document.getElementById('tAvatar').style.background=avatarColor(t.userEmail||t.userName);
  document.getElementById('tSubj').textContent=t.title||'Без темы';
  document.getElementById('tUserRow').innerHTML=`<span>${esc(t.userName||'—')}</span><span>·</span><span>${esc(t.userEmail||'—')}</span>`;
  document.getElementById('urgentTag').style.display=isUrgent(t)?'inline-flex':'none';
  applyStatusToggle(t.status);

  const orderBlock = t.orderId
    ? `<div class="t-info-item"><span class="t-info-label">Заказ</span><a class="t-info-val t-order-link" href="/admin/orders?id=${t.orderId}" target="_blank" rel="noopener">${esc(t.orderDomain||'№ '+t.orderId.slice(0,8).toUpperCase())}${t.orderSiteType?' · '+esc(t.orderSiteType):''} ↗</a></div>`
    : `<div class="t-info-item"><span class="t-info-label">Заказ</span><span class="t-info-val t-no-order">⚠ Не привязан</span></div>`;
  document.getElementById('tInfoGrid').innerHTML=`
    <div class="t-info-item"><span class="t-info-label">Создана</span><span class="t-info-val">${fmtDT(t.createdAt)}</span></div>
    ${orderBlock}
  `;

  const msgs=document.getElementById('chatMsgs');
  const images = t.images&&t.images.length ? `<div class="msg-images">${t.images.map(src=>`<img class="msg-img" src="${src}" alt="" onclick="showLightbox('${src}')"/>`).join('')}</div>` : '';
  msgs.innerHTML = `
    <div class="msg-wrap">
      <div class="msg-label">${esc(t.userName||'Клиент')}</div>
      <div class="msg usr">${esc(t.description||'Без описания')}${images}<span class="msg-time">${fmtDT(t.createdAt)}</span></div>
    </div>
    ${t.adminReply ? `<div class="msg-wrap">
      <div class="msg-label sup" style="text-align:right">Поддержка</div>
      <div class="msg sup" style="align-self:flex-end">${esc(t.adminReply)}</div>
    </div>` : `<div class="no-reply-hint">Ответа пока нет — напишите его ниже</div>`}
  `;
  document.getElementById('replyInp').value=t.adminReply||'';
  autoResize(document.getElementById('replyInp'));
};

function applyStatusToggle(status){
  const btn=document.getElementById('statusToggle');
  const isDone=status==='done';
  btn.classList.toggle('open',!isDone);
  btn.classList.toggle('done',isDone);
  document.getElementById('statusToggleLabel').textContent=isDone?'Закрыта':'Открыта';
}

window.toggleStatus=async function(){
  if(!selectedId)return;
  const t=allTickets.find(x=>x.id===selectedId); if(!t)return;
  const next = t.status==='done' ? 'open' : 'done';
  try{
    const resp = await fetch(`${API}/service-tickets/${selectedId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ status: next }) });
    if(!resp.ok) throw new Error();
    t.status=next; applyStatusToggle(next);
    toast(next==='done'?'Заявка закрыта ✓':'Заявка снова открыта','success');
    renderTickets();
  }catch(e){toast('Ошибка','error');}
};

window.saveReply=async function(){
  if(!selectedId)return;
  const val=document.getElementById('replyInp').value.trim();
  const t=allTickets.find(x=>x.id===selectedId); if(!t)return;
  try{
    const resp = await fetch(`${API}/service-tickets/${selectedId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ adminReply: val }) });
    if(!resp.ok) throw new Error();
    t.adminReply=val;
    if(t.uid&&val)await fetch(`${API}/notifications/broadcast`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({target:t.uid,title:'💬 Ответ на заявку',text:`«${t.title||''}»: ${val}`})}).catch(()=>{});
    toast('Ответ сохранён и клиент уведомлён ✓','success');
    window.openTicket(selectedId);
    renderTickets();
  }catch(e){toast('Ошибка','error');}
};

window.deleteTick=async function(){
  if(!selectedId||!confirm('Удалить заявку?'))return;
  try{
    const resp = await fetch(`${API}/service-tickets/${selectedId}`, { method:'DELETE', credentials:'include' });
    if(!resp.ok) throw new Error();
    allTickets=allTickets.filter(t=>t.id!==selectedId);
    toast('Заявка удалена','info');selectedId=null;
    showScreen('list');
    renderTickets();
  }catch(e){toast('Ошибка','error');}
};

window.notifyExpiry=async uid=>{
  if(!uid)return;
  try{
    const resp = await fetch(`${API}/notifications/broadcast`, {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ target: uid, title:'⚠️ Обслуживание заканчивается', text:'До окончания обслуживания осталось менее 3 дней. Свяжитесь с поддержкой для продления.' }),
    });
    if(!resp.ok) throw new Error();
    toast('Уведомление отправлено ✓','success');
  }catch(e){toast('Ошибка','error');}
};

window.autoResize=function(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px';};
window.showLightbox=function(src){document.getElementById('lbImg').src=src;document.getElementById('lightbox').classList.add('show');};

function renderSupports(){
  const el=document.getElementById('supportsList');
  const now=new Date();
  const active=allOrders.filter(o=>{
    if(!(o.supportActive===true))return false;
    if(o.supportExpiresAt){const exp=new Date(o.supportExpiresAt);return exp>now;}
    return true;
  });
  document.getElementById('statSupports').textContent=active.length;
  if(!active.length){el.innerHTML=`<div style="color:rgba(255,255,255,.3);font-size:.88rem">Нет активных обслуживаний</div>`;return;}
  const withMeta=active.map(o=>{
    let days=Infinity,pct=100,expiring=false;
    if(o.supportExpiresAt){
      const exp=new Date(o.supportExpiresAt);
      days=Math.ceil((exp-now)/864e5);pct=Math.max(0,Math.min(100,((exp-now)/(30*864e5))*100));expiring=days<3;
    }
    return{o,days,pct,expiring};
  }).sort((a,b)=>a.days-b.days);
  el.innerHTML=withMeta.map(({o,days,pct,expiring})=>`<div class="sup-card${expiring?' expiring':''}">
      <div class="sup-name">${esc(o.clientName||'—')}</div>
      <div class="sup-email">${esc(o.clientEmail||'—')}</div>
      ${days!==Infinity?`<div>
        <div class="sup-prog-labels"><span>Осталось</span><span style="color:${expiring?'var(--orange)':'rgba(255,255,255,.4)'}">${days} дн.</span></div>
        <div class="sup-prog"><div class="sup-prog-fill${expiring?' warn':''}" style="width:${pct}%"></div></div>
      </div>`:'<div style="font-size:.72rem;color:rgba(255,255,255,.35)">Бессрочно</div>'}
      ${expiring?`<button class="btn btn-outline btn-sm" style="font-size:.74rem;padding:.4rem .9rem;margin-top:10px" onclick="notifyExpiry('${o.uid||''}')">🔔 Уведомить</button>`:''}
    </div>`).join('');
}

async function loadTickets(){
  try{
    const resp = await fetch(`${API}/service-tickets/admin/all`, { credentials:'include' });
    // ВАЖНО: если запрос не удался — НЕ затираем текущий allTickets пустым
    // списком, иначе любая временная ошибка на опросе на секунду рисует
    // "заявок нет", хотя они никуда не девались.
    if(!resp.ok) return;
    const list = await resp.json();
    allTickets=list.sort((a,b)=>{
      if((a.status==='done')!==(b.status==='done'))return a.status==='done'?1:-1;
      return new Date(b.createdAt||0)-new Date(a.createdAt||0);
    });
  }catch(e){console.error(e);}
}

(async function initAdminTickets(){
  let user = null;
  try{
    const resp = await fetch(`${API}/auth/me`, { credentials:'include' });
    if(resp.ok) user = await resp.json();
  }catch(e){}

  if(!user){document.getElementById('loadingScreen').style.display='none';window.location.href='/';return;}
  document.getElementById('loadingScreen').style.display='none';
  if(user.role!=='admin'){window.location.href='/';return;}
  document.getElementById('appWrap').style.display='flex';

  fetch(`${API}/orders/admin/all`, { credentials:'include' }).then(r=>r.ok?r.json():[]).then(orders=>{
    const n=orders.filter(o=>o.refundStatus==='requested').length;
    const b=document.getElementById('navBadgeOrders');
    if(b){b.style.display=n?'':'none';b.textContent=n;}
    allOrders=orders;
    renderSupports();
  }).catch(()=>{});

  await loadTickets();renderTickets();
  // Обновляем список каждые 30с. Если в этот момент открыта заявка — не
  // перерисовываем её целиком, иначе стирался бы недописанный ответ в поле
  // ввода. Обновляем только статус-пилюлю и бейдж срочности.
  setInterval(async()=>{
    await loadTickets();renderTickets();
    if(selectedId){
      const t=allTickets.find(x=>x.id===selectedId);
      if(t){ applyStatusToggle(t.status); document.getElementById('urgentTag').style.display=isUrgent(t)?'inline-flex':'none'; }
    }
  },30000);
})();
</script>
