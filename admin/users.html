<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Клиенты — Antviz Admin</title>
<link rel="icon" href="../img/favicon.png"/>
<script>
  try{ var t = localStorage.getItem('antviz-theme'); if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/profile/assets/cabinet-base.css?v=1">
<link rel="stylesheet" href="/profile/assets/cabinet.css?v=3">
<link rel="stylesheet" href="/profile/assets/admin-extra.css?v=1">
<style>
  .screen{display:none}
  .screen.active{display:block;animation:cabFadeUp .2s ease both}

  .usr-list{display:flex;flex-direction:column;gap:10px}
  .or{display:flex;gap:16px;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r16);padding:16px 18px;cursor:pointer;transition:border-color .15s}
  .or:hover{border-color:var(--stroke-strong)}
  .or-avatar{width:42px;height:42px;border-radius:50%;background:var(--card-elevated);color:var(--text-faint);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:500}
  .or-body{flex:1;min-width:0}
  .or-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .or-name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .or-email{font-size:12.5px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
  .or-stats{display:flex;gap:14px;font-size:12px;color:var(--text-faint)}
  .or-stats strong{color:var(--text);font-weight:500}

  .d-topbar{margin-bottom:16px}
  .usr-hero{background:var(--text);border-radius:var(--r32);padding:30px 32px;margin-bottom:18px;position:relative;overflow:hidden}
  .usr-hero::before{content:'';position:absolute;top:-100px;right:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(30,222,123,.2),transparent 70%);pointer-events:none}
  .usr-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;position:relative;z-index:1}
  .usr-hero-eyebrow{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--green);margin-bottom:8px}
  .usr-hero-num{font-size:1.4rem;font-weight:500;letter-spacing:-.02em;color:var(--bg)}
  .usr-hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
  .hc{background:rgba(255,255,255,.08);border-radius:var(--r14);padding:14px 16px}
  .hc-l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.4);margin-bottom:4px;font-weight:500}
  .hc-v{font-size:14.5px;color:rgba(255,255,255,.92);word-break:break-all}

  .ban-active-box{border:1px solid var(--red);background:var(--red-dim);border-radius:var(--r24);padding:20px 22px;margin-bottom:16px}
  .ban-active-box h3{color:var(--red);margin-bottom:14px}
  .sf{display:flex;flex-direction:column;gap:14px}
  .sf-row{display:flex;flex-direction:column;gap:7px}
  .sf-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);font-weight:500}
  .sf-val{font-size:14.5px}
  .duration-row{display:flex;gap:8px;flex-wrap:wrap}

  .sw{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
  .sw input{opacity:0;width:0;height:0}
  .sw-track{position:absolute;inset:0;background:var(--stroke-strong);border-radius:999px;cursor:pointer;transition:background .15s}
  .sw-track::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sw input:checked+.sw-track{background:var(--green)}
  .sw input:checked+.sw-track::before{transform:translateX(18px)}

  @media(max-width:760px){
    .usr-hero{padding:24px 20px}
    .usr-hero-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>

<div class="cab-modal-overlay" id="pmOv" onclick="if(event.target===this)closePromptModal()">
  <div class="cab-modal" style="max-width:380px">
    <div class="pm-icon" id="pmIcon" style="width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px"></div>
    <h3 id="pmTitle" style="margin-bottom:6px"></h3>
    <p id="pmSub" style="color:var(--text-dim);font-size:14px;line-height:1.5;margin-bottom:18px"></p>
    <div class="cab-modal-actions">
      <button class="cab-btn ghost" onclick="closePromptModal()">Отмена</button>
      <button class="cab-btn primary" id="pmConfirmBtn">Подтвердить</button>
    </div>
  </div>
</div>

<div id="sbContent" style="display:none">
  <div class="shell">
    <div class="cab-page">

      <div class="screen active" id="screenList">
        <div class="pg-head">
          <div class="pg-head-main">
            <div class="pg-title">Клиенты</div>
            <div class="pg-sub">Всего: <b id="tTotal">—</b> · забанено: <b id="tBanned" style="color:var(--red)">—</b></div>
          </div>
        </div>
        <div class="cab-search" style="margin-bottom:18px">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="searchInp" placeholder="Поиск по имени или email…" oninput="renderList()"/>
        </div>
        <div class="usr-list" id="userList"><div class="cab-empty"><h3>Загрузка…</h3></div></div>
      </div>

      <div class="screen" id="screenDetail">
        <div class="d-topbar">
          <button class="cab-btn ghost sm" onclick="showScreen('list')"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Назад</button>
        </div>

        <div class="usr-hero">
          <div class="usr-hero-top">
            <div><div class="usr-hero-eyebrow">Клиент</div><div class="usr-hero-num" id="dId">—</div></div>
            <div id="dBadge"></div>
          </div>
          <div class="usr-hero-grid" id="dHeroInfo"></div>
        </div>

        <div class="cab-card" style="margin-bottom:16px">
          <h3 style="margin-bottom:14px">Статистика</h3>
          <div class="dk-grid" id="dStatsInfo" style="grid-template-columns:1fr 1fr 1fr"></div>
        </div>

        <div class="ban-active-box" id="curBanSec" style="display:none">
          <h3>Активный бан</h3>
          <div class="sf" id="curBanInfo"></div>
          <div style="margin-top:16px"><button class="cab-btn primary" onclick="unbanUser()"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>Разбанить</button></div>
        </div>

        <div class="cab-card" id="banFormSec" style="margin-bottom:16px">
          <h3 style="margin-bottom:14px" id="banFormTitle">Забанить пользователя</h3>
          <div class="sf">
            <div class="cab-field"><label class="cab-label">Причина</label><input class="cab-input" id="banReason" type="text" placeholder="Например: спам в чате поддержки"/></div>
            <div class="sf-row">
              <div class="sf-lbl">Срок</div>
              <div class="duration-row">
                <button class="cab-btn ghost sm" onclick="setBanDuration(1)">1 день</button>
                <button class="cab-btn ghost sm" onclick="setBanDuration(3)">3 дня</button>
                <button class="cab-btn ghost sm" onclick="setBanDuration(7)">7 дней</button>
                <button class="cab-btn ghost sm" onclick="setBanDuration(30)">30 дней</button>
                <button class="cab-btn ghost sm" onclick="setBanDuration(null)">Навсегда</button>
              </div>
            </div>
            <div class="cab-field"><label class="cab-label">Забанен до</label><input class="cab-input" id="banUntil" type="date"/><span style="font-size:12px;color:var(--text-faint);margin-top:4px;display:block" id="banUntilHint">Пусто = навсегда</span></div>
            <div class="sf-row" style="flex-direction:row;align-items:center;justify-content:space-between">
              <div class="sf-lbl" style="margin:0">Показывать кнопку на экране бана</div>
              <label class="sw"><input type="checkbox" id="banShowBtn" checked onchange="toggleBanBtnUrl()"/><span class="sw-track"></span></label>
            </div>
            <div class="sf-row" id="banBtnUrlRow">
              <div class="sf-lbl">Текст и ссылка кнопки</div>
              <input class="cab-input" id="banBtnLabel" type="text" placeholder="Написать в поддержку" style="margin-bottom:8px"/>
              <input class="cab-input" id="banBtnUrl" type="text" placeholder="https://t.me/antviz_support"/>
            </div>
          </div>
          <div style="margin-top:18px"><button class="cab-btn danger" style="width:100%;justify-content:center" onclick="submitBan()">Забанить</button></div>
        </div>

        <div class="cab-card" style="padding:0;overflow:hidden">
          <h3 style="margin:0;padding:18px 22px;border-bottom:1px solid var(--stroke)">Заказы клиента</h3>
          <div id="userOrdersSec"><div style="padding:20px 22px;color:var(--text-faint);font-size:13.5px">Загрузка…</div></div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const API = 'https://antviz.ru/api';

function toast(m,t='info'){const el=document.getElementById('toast');el.textContent=m;el.className=`toast ${t} show`;setTimeout(()=>el.className='toast',3400);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(ts){if(!ts)return'—';return new Date(ts).toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'});}
function fmtP(n){return n?Math.round(n).toLocaleString('ru')+' ₽':'0 ₽';}
function initials(name){return(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}

window.showScreen=function(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name==='list'?'screenList':'screenDetail').classList.add('active');
};

function openPromptModal({icon,iconBg,iconColor,title,sub,confirmLabel,confirmClass,onConfirm}){
  document.getElementById('pmIcon').style.background=iconBg;
  document.getElementById('pmIcon').style.color=iconColor;
  document.getElementById('pmIcon').innerHTML='<svg viewBox="0 0 24 24">'+icon+'</svg>';
  document.getElementById('pmTitle').textContent=title;
  document.getElementById('pmSub').textContent=sub||'';
  const btn=document.getElementById('pmConfirmBtn');
  btn.className='cab-btn '+(confirmClass||'primary');
  btn.textContent=confirmLabel||'Подтвердить';
  btn.onclick=()=>{closePromptModal();onConfirm();};
  document.getElementById('pmOv').classList.add('show');
}
window.closePromptModal=()=>document.getElementById('pmOv').classList.remove('show');
const ICO_UNBAN='<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/>';

let allUsers=[], allOrders=[], allBans=new Map(), selUser=null;

function isBanActive(ban){
  if(!ban)return false;
  if(!ban.until)return true;
  return new Date(ban.until).getTime()>Date.now();
}

function updateStats(){
  document.getElementById('tTotal').textContent=allUsers.length;
  let banned=0; allBans.forEach(b=>{if(isBanActive(b))banned++;});
  document.getElementById('tBanned').textContent=banned;
}

window.renderList=function(){
  const q=(document.getElementById('searchInp').value||'').trim().toLowerCase();
  const list=document.getElementById('userList');
  let users=allUsers;
  if(q)users=users.filter(u=>(u.email||'').toLowerCase().includes(q)||(u.displayName||'').toLowerCase().includes(q));
  if(!users.length){list.innerHTML='<div class="cab-empty"><h3>Никого не найдено</h3></div>';return;}
  list.innerHTML=users.map(u=>{
    const ban=allBans.get(u.id);
    const banned=isBanActive(ban);
    return `<div class="or" onclick="selectUserById('${u.id}')">
      <div class="or-avatar">${esc(initials(u.displayName||u.email))}</div>
      <div class="or-body">
        <div class="or-top">${banned?'<span class="cab-badge red">забанен</span>':''}${u.telegramLinked?'<span class="cab-badge blue">Telegram</span>':''}</div>
        <div class="or-name">${esc(u.displayName||'Без имени')}</div>
        <div class="or-email">${esc(u.email||u.id)}</div>
        <div class="or-stats"><span><strong>${u.ordersCount||0}</strong> заказ.</span><span><strong>${fmtP(u.totalSpent)}</strong></span></div>
      </div>
    </div>`;
  }).join('');
};

window.selectUserById=function(uid){
  const u=allUsers.find(x=>x.id===uid)||{id:uid,email:uid,displayName:''};
  selUser=u;
  showScreen('detail');
  document.getElementById('dId').textContent=u.displayName||u.email||uid;
  document.getElementById('dHeroInfo').innerHTML=`
    <div class="hc"><div class="hc-l">Email</div><div class="hc-v">${esc(u.email||'—')}</div></div>
    <div class="hc"><div class="hc-l">Регистрация</div><div class="hc-v">${fmtDate(u.createdAt)}</div></div>`;
  document.getElementById('dStatsInfo').innerHTML=`
    <div class="dk"><div class="dk-l">Заказов</div><div class="dk-v">${u.ordersCount||0}</div></div>
    <div class="dk"><div class="dk-l">Потрачено</div><div class="dk-v" style="color:var(--green-text);font-weight:500">${fmtP(u.totalSpent)}</div></div>
    <div class="dk"><div class="dk-l">Последний заказ</div><div class="dk-v">${u.lastOrderAt?fmtDate(u.lastOrderAt):'—'}</div></div>`;
  const ban=allBans.get(uid);
  const active=isBanActive(ban);
  document.getElementById('dBadge').innerHTML=active?'<span class="cab-badge red">🚫 Забанен</span>':'<span class="cab-badge green">Активен</span>';
  const curSec=document.getElementById('curBanSec');
  if(active){
    curSec.style.display='block';
    document.getElementById('curBanInfo').innerHTML=`
      <div class="sf-row"><div class="sf-lbl">Причина</div><div class="sf-val">${esc(ban.reason||'—')}</div></div>
      <div class="sf-row"><div class="sf-lbl">Срок</div><div class="sf-val">${ban.until?('до '+fmtDate(ban.until)):'навсегда'}</div></div>
      <div class="sf-row"><div class="sf-lbl">Кто забанил</div><div class="sf-val">${esc(ban.bannedBy||'—')}</div></div>`;
    document.getElementById('banFormTitle').textContent='Изменить бан';
  }else{
    curSec.style.display='none';
    document.getElementById('banFormTitle').textContent='Забанить пользователя';
  }
  document.getElementById('banReason').value=active?(ban.reason||''):'';
  document.getElementById('banUntil').value='';
  document.getElementById('banShowBtn').checked=active?(ban.showButton!==false):true;
  document.getElementById('banBtnLabel').value=active?(ban.btnLabel||'Написать в поддержку'):'Написать в поддержку';
  document.getElementById('banBtnUrl').value=active?(ban.btnUrl||''):'';
  toggleBanBtnUrl();

  const userOrders=allOrders.filter(o=>o.uid===uid);
  const oSec=document.getElementById('userOrdersSec');
  if(!userOrders.length){oSec.innerHTML='<div style="padding:20px 22px;color:var(--text-faint);font-size:13.5px">Заказов пока нет</div>';}
  else{
    oSec.innerHTML=userOrders.map(o=>`<a href="/admin/orders?id=${o.id}" style="display:flex;align-items:center;gap:10px;padding:14px 22px;text-decoration:none;color:var(--text);border-top:1px solid var(--stroke)">
      <span style="font-size:13px;font-weight:500">№${o.id.slice(0,7).toUpperCase()}</span>
      <span style="font-size:12.5px;color:var(--text-faint)">${esc(o.package||'—')}</span>
      <span style="margin-left:auto;font-size:13px;font-weight:500;color:var(--green-text)">${fmtP(o.totalPrice)}</span>
    </a>`).join('');
  }
};

window.setBanDuration=function(days){
  const inp=document.getElementById('banUntil');
  if(days===null){inp.value='';document.getElementById('banUntilHint').textContent='Навсегда — до ручного разбана';return;}
  const d=new Date();d.setDate(d.getDate()+days);
  inp.value=d.toISOString().split('T')[0];
  document.getElementById('banUntilHint').textContent='Пусто = навсегда';
};

window.toggleBanBtnUrl=function(){
  document.getElementById('banBtnUrlRow').style.display=document.getElementById('banShowBtn').checked?'block':'none';
};

async function loadBans(){
  try{
    const resp = await fetch(`${API}/bans`, { credentials:'include' });
    const list = resp.ok ? await resp.json() : [];
    allBans = new Map(list.map(b=>[b.userId, b]));
  }catch(e){ allBans = new Map(); }
  updateStats();renderList();
  if(selUser)selectUserById(selUser.id);
}

window.submitBan=async function(){
  if(!selUser)return;
  const reason=document.getElementById('banReason').value.trim();
  if(!reason){toast('Укажите причину бана','error');return;}
  const untilStr=document.getElementById('banUntil').value;
  const until=untilStr?new Date(untilStr+'T23:59:59').toISOString():null;
  const showButton=document.getElementById('banShowBtn').checked;
  const btnLabel=document.getElementById('banBtnLabel').value.trim()||'Написать в поддержку';
  const btnUrl=document.getElementById('banBtnUrl').value.trim();
  if(showButton&&!btnUrl){toast('Укажите ссылку для кнопки или выключите её','error');return;}
  try{
    const resp = await fetch(`${API}/bans`, {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ email: selUser.email, reason, until, showButton, btnLabel, btnUrl }),
    });
    if(!resp.ok){ const d=await resp.json().catch(()=>({})); throw new Error(d.error||'Ошибка'); }
    toast('Пользователь забанен ✓','success');
    await loadBans();
  }catch(e){toast('Ошибка: '+e.message,'error');}
};

window.unbanUser=async function(){
  if(!selUser)return;
  const u=selUser;
  openPromptModal({
    icon:ICO_UNBAN,iconBg:'var(--green-dim)',iconColor:'var(--green-text)',
    title:'Снять бан?',sub:'Пользователь сразу получит доступ обратно.',
    confirmLabel:'Разбанить',confirmClass:'primary',
    onConfirm:async()=>{
      try{
        const resp = await fetch(`${API}/bans/${u.id}`, { method:'DELETE', credentials:'include' });
        if(!resp.ok) throw new Error();
        toast('Разбанен ✓','success');
        await loadBans();
      }
      catch(e){toast('Ошибка снятия бана','error');}
    }
  });
};

window.doLogout=async()=>{
  try{ await fetch(`${API}/auth/logout`, { method:'POST', credentials:'include' }); }catch(e){}
  window.location.href='/';
};

(async function initUsersPage(){
  let user = null;
  try{
    const resp = await fetch(`${API}/auth/me`, { credentials:'include' });
    if(resp.ok) user = await resp.json();
  }catch(e){}

  if(!user){document.getElementById('loadingScreen').style.display='none';window.location.href='/';return;}
  document.getElementById('loadingScreen').style.display='none';
  if(user.role!=='admin'){window.location.href='/';return;}
  document.getElementById('sbContent').style.display='block';
  try{
    const resp = await fetch(`${API}/users/admin/all`, { credentials:'include' });
    allUsers = resp.ok ? await resp.json() : [];
  }catch(e){toast('Не удалось загрузить пользователей','error');}
  try{
    const resp = await fetch(`${API}/orders/admin/all`, { credentials:'include' });
    allOrders = resp.ok ? await resp.json() : [];
    const n=allOrders.filter(o=>o.refundStatus==='requested').length;
    const b=document.getElementById('navBadgeOrders');
    if(b){b.style.display=n?'':'none';b.textContent=n;}
  }catch(e){ allOrders=[]; }
  fetch(`${API}/enterprise/admin/all`, { credentials:'include' }).then(r=>r.ok?r.json():[]).then(apps=>{
    const n=apps.filter(a=>a.status==='new').length;
    const b=document.getElementById('navBadgeEnterprise');
    if(b){b.style.display=n?'':'none';b.textContent=n;}
  }).catch(()=>{});
  await loadBans();
})();
</script>
<script src="/profile/assets/admin-shell.js" data-page="users" data-title="Клиенты"></script>
<script src="../GEOBLOCK.js"></script>
<script src="../maintenance.js"></script>
</body>
</html>
