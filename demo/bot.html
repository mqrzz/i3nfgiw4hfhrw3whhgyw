<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Концепт: Telegram-бот записи</title><link rel="stylesheet" href="demo.css"><style>
body{background:#d7e6f7;min-height:100vh;display:flex;flex-direction:column}
.bar{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 0 #0b0b0d14}
.ava{width:42px;height:42px;border-radius:50%;background:#0066ff;color:#fff;display:grid;place-items:center;font-weight:700}
.bar b{display:block;font-size:16px}.bar small{color:#8a9aab;font-size:13px}
.chat{flex:1;padding:18px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.35;background:#fff}
.m.me{align-self:flex-end;background:#c9f0a8}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:82%}
.kb span{background:#ffffffb8;border-radius:12px;padding:11px;text-align:center;font-weight:600;font-size:15px;color:#0a4fc4}
.kb span.on{background:#0066ff;color:#fff}
.in{background:#fff;padding:12px 16px;color:#8a9aab;font-size:16px}
</style></head><body>
<div class="bar"><div class="ava">Б</div><div><b>Студия «Лайм»</b><small>бот записи</small></div></div>
<div class="chat"><div class="m">Здравствуйте! Выберите услугу, и я найду свободное время.</div>
<div class="kb"><span>Стрижка</span><span class="on">Маникюр</span><span>Окрашивание</span><span>Укладка</span></div>
<div class="m me">Маникюр</div><div class="m">Свободно на этой неделе:</div>
<div class="kb"><span>Вт 12:00</span><span class="on">Ср 15:30</span><span>Чт 11:00</span><span>Пт 18:00</span></div>
<div class="m me">Ср 15:30</div><div class="m">Записал вас на среду, 15:30. Напомню за сутки и за два часа.</div></div>
<div class="in">Сообщение</div><a class="demo-back" href="../kejsy/bot-zapisi/index.html">← К кейсу</a></body></html>
