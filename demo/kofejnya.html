<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Концепт: сайт для кофейни</title><link rel="stylesheet" href="demo.css"><style>
body{background:#f3e9dc;color:#2a1a12;min-height:100vh;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:28px 64px}
.top b{font-family:Unbounded;font-size:22px;letter-spacing:-.03em}
.top nav{display:flex;gap:36px;font-weight:500}
.top .btn{background:#2a1a12;color:#f3e9dc;padding:13px 24px;border-radius:99px;font-weight:600;font-size:15px}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;padding:40px 64px 0;align-items:center}

h1 i{font-style:normal;color:#c2571a}
.hero p{margin-top:28px;font-size:20px;max-width:460px;line-height:1.45;color:#6b5546}
.row{display:flex;gap:12px;margin-top:34px}
.row a{padding:16px 28px;border-radius:99px;font-weight:600}
.row a:first-child{background:#c2571a;color:#fff}.row a:last-child{border:1.5px solid #2a1a12}
.cup{position:relative;aspect-ratio:1;max-width:560px;justify-self:center;width:100%}
.cup span{position:absolute;border-radius:50%;inset:0}
.c1{background:#e0cdb6}.c2{inset:7%!important;background:#fff8ee;box-shadow:0 30px 60px #2a1a1233}
.c3{inset:20%!important;background:radial-gradient(circle at 40% 35%,#b9763f,#5a2f14 70%)}
.c4{inset:30%!important;background:conic-gradient(from 40deg,#f3e2c8,#d7a874,#f3e2c8,#c79259,#f3e2c8);border-radius:50%;filter:blur(.4px);opacity:.9}
.c5{inset:44%!important;background:#2a1a12;opacity:.9}
.tag{position:absolute;background:#fff;padding:14px 20px;border-radius:20px;font-weight:600;box-shadow:0 14px 40px #2a1a1220}
.tag small{display:block;color:#8b7565;font-weight:500;font-size:13px}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:56px 64px}
.menu div{background:#fff8ee;border-radius:28px;padding:24px;display:flex;justify-content:space-between;align-items:flex-end;min-height:140px;font-weight:600;font-size:20px}
.menu b{font-family:Unbounded;font-size:16px;color:#c2571a}
</style></head><body>
