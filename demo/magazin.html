<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Концепт: интернет-магазин</title><link rel="stylesheet" href="demo.css"><style>
body{background:#fff;color:#0b0b0d}
.top{display:flex;align-items:center;gap:40px;padding:22px 56px;border-bottom:1px solid #0b0b0d14}
.top b{font-family:Unbounded;font-size:20px}.top nav{display:flex;gap:28px;font-weight:500;flex:1}
.cart{background:#0b0b0d;color:#fff;border-radius:99px;padding:12px 22px;font-weight:600;font-size:15px}
.head{display:flex;justify-content:space-between;align-items:flex-end;padding:44px 56px 20px}
h1{font-size:64px;letter-spacing:-.04em;line-height:1;font-weight:700}
.chips{display:flex;gap:8px}.chips span{padding:10px 18px;border-radius:99px;background:#f2f2f4;font-weight:500;font-size:15px}.chips span:first-child{background:#0b0b0d;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:20px 56px}
.card .img{aspect-ratio:4/4.6;border-radius:28px;position:relative;overflow:hidden;display:grid;place-items:center}
.card .img i{display:block;width:46%;height:56%;border-radius:22% 22% 12% 12%;background:#ffffffb0;box-shadow:0 20px 40px #0b0b0d18}
.card .img u{position:absolute;left:14px;top:14px;text-decoration:none;background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.card h3{font-size:18px;margin:14px 4px 4px;font-weight:600}.card p{margin:0 4px;color:#6e6a70;font-weight:500}
</style></head><body>
<header class="top"><b>Форма</b><nav><a>Новинки</a><a>Одежда</a><a>Аксессуары</a><a>Скидки</a></nav><a class="cart">Корзина · 2</a></header>
<div class="head"><h1>Новая коллекция</h1><div class="chips"><span>Все</span><span>Худи</span><span>Футболки</span><span>Штаны</span></div></div>
<div class="grid">
<div class="card"><div class="img" style="background:#dce8ff"><u>Новинка</u><i></i></div><h3>Худи оверсайз</h3><p>5 900 ₽</p></div>
<div class="card"><div class="img" style="background:#f1e6d8"><i></i></div><h3>Футболка плотная</h3><p>2 400 ₽</p></div>
<div class="card"><div class="img" style="background:#e3e6e0"><u>-20%</u><i></i></div><h3>Свитшот базовый</h3><p>4 200 ₽</p></div>
<div class="card"><div class="img" style="background:#0b0b0d"><i style="background:#ffffff22"></i></div><h3>Куртка лёгкая</h3><p>8 900 ₽</p></div></div>
<a class="demo-back" href="../kejsy/internet-magazin/index.html">← К кейсу</a></body></html>
