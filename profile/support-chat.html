<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Чат с командой — Antviz</title>
<link rel="icon" href="../img/favicon.png" type="image/png"/>
<script>
  try{ var t = localStorage.getItem('antviz-theme'); if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); }catch(e){}
  // Полноэкранный чат — только для ПК. На телефоне тикет открывается выезжающей панелью на странице «Чат с командой».
  if (!window.matchMedia('(min-width:981px)').matches) {
    var q = new URLSearchParams(location.search); var i = q.get('id');
    location.replace('support' + (i ? '?id=' + encodeURIComponent(i) : ''));
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/profile/assets/cabinet-base.css?v=1">
<link rel="stylesheet" href="/profile/assets/cabinet.css?v=2">
<style>
  /* #sbContent .cab-page в cabinet.css задаёт padding-bottom:40px с более высокой
     специфичностью (там есть #id) — просто "body .cab-page{...}" её не перебивает.
     Чат — единственная страница, где список сообщений должен скроллиться САМ,
     а не вся страница целиком, поэтому убираем оба нижних отступа этим же по силе селектором. */
  #sbContent .cab-page{padding-bottom:0}
  body .sb-content{padding-bottom:24px}

  .ch-shell{position:relative;display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100vh - 150px);min-height:560px;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r32);box-shadow:var(--shadow-sm);overflow:hidden}

  /* ── левая колонка: диалоги ── */
  .ch-list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--stroke)}
  .ch-list-head{padding:22px 20px 14px;display:flex;flex-direction:column;gap:14px}
  .ch-list-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ch-list-top h2{font-size:21px;font-weight:600;letter-spacing:-.035em}
  .ch-list .cab-search{flex:none;width:100%}
  .ch-list .cab-search input{padding:11px 16px 11px 42px;font-size:14.5px;border-radius:var(--r16)}
  .ch-list .cab-search svg{left:15px;width:17px;height:17px}
  .ch-tabs{display:flex;gap:6px}
  .ch-tabs button{flex:1;border:1px solid var(--stroke);background:transparent;color:var(--text-dim);font-size:13.5px;font-weight:500;padding:8px 6px;border-radius:var(--r12);cursor:pointer;transition:all .15s}
  .ch-tabs button:hover{color:var(--text)}
  .ch-tabs button.is-active{background:var(--text);border-color:var(--text);color:var(--bg)}
  .ch-items{flex:1;overflow-y:auto;padding:4px 10px 12px}
  .ch-item{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:13px 12px;border-radius:var(--r16);cursor:pointer;align-items:flex-start;transition:background .12s}
  .ch-item:hover{background:var(--card-elevated)}
  .ch-item.is-active{background:var(--card-elevated);box-shadow:inset 0 0 0 1px var(--stroke-strong)}
  .ch-item:focus-visible{outline:2px solid var(--green)}
  .ch-dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex-shrink:0;background:transparent}
  .ch-item.is-unread .ch-dot{background:var(--green)}
  .ch-item-body{flex:1;min-width:0}
  .ch-item-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-item.is-unread .ch-item-title{font-weight:600}
  .ch-item-sub{font-size:13px;color:var(--text-faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-item-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
  .ch-item-date{font-size:12px;color:var(--text-faint)}
  .ch-chip{width:8px;height:8px;border-radius:50%;background:var(--blue)}
  .ch-chip.done{background:var(--green)}
  .ch-none{padding:36px 16px;text-align:center;color:var(--text-faint);font-size:14px}

  /* ── центр: переписка ── */
  .ch-main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
  .ch-head{display:flex;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid var(--stroke)}
  .ch-head-info{flex:1;min-width:0}
  .ch-head-title{font-size:20px;font-weight:600;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-head-tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .ch-info-btn{display:inline-flex}
  .ch-body{flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:6px}
  .ch-day{align-self:center;font-size:12.5px;color:var(--text-faint);background:var(--card-elevated);border:1px solid var(--stroke);padding:5px 14px;border-radius:99px;margin:14px 0 8px}
  .ch-msg{display:flex;flex-direction:column;max-width:min(560px,78%);gap:4px}
  .ch-msg.user{align-self:flex-end;align-items:flex-end}
  .ch-msg.admin{align-self:flex-start;align-items:flex-start}
  .ch-who{font-size:12px;color:var(--text-faint);padding:0 6px}
  .ch-bubble{padding:12px 16px;border-radius:20px;font-size:15px;line-height:1.55;word-break:break-word;letter-spacing:-.015em}
  .ch-msg.user .ch-bubble{background:var(--text);color:var(--bg);border-bottom-right-radius:6px}
  .ch-msg.admin .ch-bubble{background:var(--card-elevated);border:1px solid var(--stroke);border-bottom-left-radius:6px}
  .ch-bubble a{color:inherit;text-decoration:underline}
  .ch-bubble a.ch-file{text-decoration:none}
  .ch-bubble img{display:block;max-width:100%;max-height:300px;border-radius:14px;cursor:zoom-in}
  .ch-bubble .ch-text + img,.ch-bubble .ch-text + .ch-file,.ch-bubble img + .ch-file{margin-top:10px}
  .ch-file{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-decoration:none;color:inherit !important;background:rgba(127,127,127,.14)}
  .ch-file:hover{background:rgba(127,127,127,.22)}
  .ch-file svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .ch-file b{display:block;font-size:14px;font-weight:500;word-break:break-all}
  .ch-file span{display:block;font-size:12px;opacity:.65;margin-top:1px}
  .ch-time{font-size:11.5px;color:var(--text-faint);padding:0 6px}

  .ch-rate{align-self:center;width:min(460px,100%);margin:20px 0 6px;padding:24px;border:1px solid var(--stroke);border-radius:var(--r24);background:var(--card-elevated);text-align:center}
  .ch-rate h4{font-size:17px;font-weight:600;margin-bottom:4px}
  .ch-rate p{font-size:14px;color:var(--text-dim);margin-bottom:14px}
  .ch-stars{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
  .ch-stars button{border:none;background:none;cursor:pointer;padding:3px;color:var(--text-faint);transition:transform .15s var(--spring),color .12s}
  .ch-stars button:hover{transform:scale(1.15)}
  .ch-stars button.on{color:var(--amber)}
  .ch-stars svg{width:34px;height:34px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linejoin:round}
  .ch-stars button.on svg{fill:currentColor}
  .ch-rate textarea{width:100%;min-height:70px;resize:vertical;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r16);padding:12px 14px;font-size:14.5px;color:var(--text);outline:none;margin-bottom:12px}
  .ch-rate textarea:focus{border-color:var(--green)}
  .ch-rated{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14.5px;color:var(--text-dim)}
  .ch-rated .st{color:var(--amber);letter-spacing:2px;font-size:17px}
  .ch-rated button{border:none;background:none;color:var(--text-dim);text-decoration:underline;cursor:pointer;font-size:13.5px}

  .ch-compose{padding:14px 20px 20px;border-top:1px solid var(--stroke)}
  .ch-pending{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .ch-pend{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border:1px solid var(--stroke);border-radius:var(--r12);background:var(--card-elevated);font-size:13px;max-width:240px}
  .ch-pend img{width:26px;height:26px;border-radius:7px;object-fit:cover}
  .ch-pend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-pend button{border:none;background:none;color:var(--text-faint);cursor:pointer;display:flex;padding:2px}
  .ch-pend button:hover{color:var(--red)}
  .ch-pend svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
  .ch-row{display:flex;align-items:flex-end;gap:10px;background:var(--card-elevated);border:1px solid var(--stroke);border-radius:22px;padding:8px 8px 8px 8px;transition:border-color .15s}
  .ch-row:focus-within{border-color:var(--green)}
  .ch-row textarea{flex:1;min-width:0;background:none;border:none;outline:none;resize:none;color:var(--text);font-size:15.5px;line-height:1.5;padding:9px 6px;max-height:160px;font-family:inherit}
  .ch-row textarea::placeholder{color:var(--text-faint)}
  .ch-ic{width:42px;height:42px;border-radius:15px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s,transform .15s var(--spring)}
  .ch-ic svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ch-attach{background:transparent;color:var(--text-dim)}
  .ch-attach:hover{background:var(--surface2);color:var(--text)}
  .ch-send{background:var(--green);color:#0d1210}
  .ch-send:hover:not(:disabled){transform:scale(1.05)}
  .ch-send:disabled{opacity:.45;cursor:default}
  .ch-hint{font-size:12.5px;color:var(--text-faint);margin-top:8px;padding-left:8px}
  .ch-drop{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--card) 88%,transparent);border:2px dashed var(--green);border-radius:var(--r24);margin:10px;font-size:18px;font-weight:500;pointer-events:none}
  .ch-main.is-drag .ch-drop{display:flex}

  .ch-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--text-dim)}
  .ch-empty svg{width:52px;height:52px;stroke:var(--text-faint);stroke-width:1.3;fill:none;margin-bottom:20px;stroke-linecap:round;stroke-linejoin:round}
  .ch-empty h3{font-size:21px;font-weight:600;color:var(--text);margin-bottom:8px}
  .ch-empty p{font-size:15px;max-width:380px;line-height:1.55;margin-bottom:22px}

  /* ── правая колонка: детали ── */
  .ch-info{display:flex;flex-direction:column;gap:22px;min-height:0;overflow-y:auto;padding:24px;background:var(--card);border-left:1px solid var(--stroke);position:absolute;top:0;right:0;bottom:0;width:340px;transform:translateX(102%);visibility:hidden;transition:transform .25s var(--spring),visibility 0s .25s;z-index:6}
  .ch-info.is-open{transform:none;visibility:visible;box-shadow:var(--shadow-lg);transition:transform .25s var(--spring),visibility 0s}
  .ch-info-close{align-self:flex-end}
  .ch-kv{display:flex;flex-direction:column;gap:14px}
  .ch-kv div{display:flex;justify-content:space-between;gap:14px;font-size:14.5px}
  .ch-kv dt,.ch-kv span.k{color:var(--text-faint)}
  .ch-kv b{font-weight:500;text-align:right}
  .ch-kv a{color:var(--text);font-weight:500;text-decoration:underline;text-decoration-color:var(--stroke-strong)}
  .ch-info h4{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin-bottom:12px}
  .ch-media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ch-media img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in;border:1px solid var(--stroke)}
  .ch-flist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .ch-flist a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--stroke);border-radius:var(--r12);text-decoration:none;color:var(--text);font-size:13.5px;background:var(--card-elevated)}
  .ch-flist a span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-flist a small{color:var(--text-faint);font-size:12px}
  .ch-flist svg{width:16px;height:16px;stroke:var(--text-dim);stroke-width:1.8;fill:none;flex-shrink:0}

  @media (min-width:1700px){
    .ch-shell{grid-template-columns:320px minmax(0,1fr) 330px}
    .ch-info{position:static;transform:none;box-shadow:none !important;width:auto;visibility:visible}
    .ch-info-btn,.ch-info-close{display:none}
  }

  .lb{position:fixed;inset:0;z-index:9800;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
  .lb.show{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:14px}
</style>
</head>
<body>
<script src="/profile/assets/sidebar.js" data-page="support" data-back="/profile/support" data-back-label="К тикетам" data-title="Чат с командой"></script>

<div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>

<div id="sbContent" style="display:none">
<div class="cab-page">
  <div class="ch-shell" id="chShell">

    <!-- диалоги -->
    <section class="ch-list">
      <div class="ch-list-head">
        <div class="ch-list-top">
          <h2>Тикеты</h2>
          <a class="cab-btn primary sm" href="support-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Новый</a>
        </div>
        <div class="cab-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" id="chSearch" placeholder="Поиск" autocomplete="off"></div>
        <div class="ch-tabs" id="chTabs">
          <button class="is-active" data-f="all">Все</button>
          <button data-f="open">Открытые</button>
          <button data-f="done">Решённые</button>
        </div>
      </div>
      <div class="ch-items" id="chItems"></div>
    </section>

    <!-- переписка -->
    <section class="ch-main" id="chMain">
      <div class="ch-drop">Отпустите файлы, чтобы прикрепить</div>
      <div id="chMainInner" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
    </section>

    <!-- детали -->
    <aside class="ch-info" id="chInfo"></aside>
  </div>
</div>
</div>

<div class="lb" id="lb"><img id="lbImg" alt=""></div>
<div class="toast" id="toast"></div>

<script type="module">
import { touchSession } from './sessions.js?v=4';
import { ACCEPT, MAX_FILES, prepareFile, attachmentPayload, fmtSize } from '/profile/assets/cabinet-attach.js?v=1';

const API = 'https://antviz.ru/api';
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type='info'){ const t=$('toast'); t.textContent=msg; t.className=`toast ${type} show`; clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',3200); }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g,'<br>'); }
const safeImg = u => typeof u === 'string' && /^data:image\/(png|jpe?g|webp|gif);base64,/.test(u);
const PRIO = { low:'Низкий', medium:'Средний', high:'Высокий' };

let tickets = [], orders = [], activeId = null;
let messages = {};            // ticketId -> [...]
let drafts = {};              // ticketId -> текст черновика
let pending = [];             // подготовленные вложения для отправки
let filter = 'all', query = '';
let sending = false, pollTimer = null;

function fmtDay(d){
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const y = new Date(today); y.setDate(y.getDate() - 1);
  const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (+dd === +today) return 'Сегодня';
  if (+dd === +y) return 'Вчера';
  return d.toLocaleDateString('ru', { day:'numeric', month:'long', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}
function fmtTime(d){ return d.toLocaleTimeString('ru', { hour:'2-digit', minute:'2-digit' }); }
function fmtShort(ts){
  const d = new Date(ts), now = new Date();
  const same = d.toDateString() === now.toDateString();
  return same ? fmtTime(d) : d.toLocaleDateString('ru', { day:'numeric', month:'short' });
}
function orderName(t){
  const o = t.orderId ? orders.find(x => x.id === t.orderId) : null;
  if (o) return o.siteDomain || ('№ ' + o.id.slice(0,8).toUpperCase());
  return t.orderLabel ? String(t.orderLabel).split(' · ')[0] : '';
}
const active = () => tickets.find(t => t.id === activeId) || null;

async function api(method, path, body){
  const r = await fetch(API + path, { method, credentials:'include', headers: body ? {'Content-Type':'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Ошибка запроса');
  return d;
}

// ───────────── список ─────────────
function renderList(){
  let list = tickets.filter(t => filter === 'all' || t.status === filter);
  if (query) list = list.filter(t => [t.subject, t.topic, t.orderLabel].join(' ').toLowerCase().includes(query));
  list = [...list].sort((a,b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
  $('chItems').innerHTML = list.length ? list.map(t => {
    const unread = t.read === false;
    const on = orderName(t);
    return `<button class="ch-item${t.id === activeId ? ' is-active' : ''}${unread ? ' is-unread' : ''}" data-id="${esc(t.id)}">
      <span class="ch-dot"></span>
      <span class="ch-item-body"><div class="ch-item-title">${esc(t.subject || t.topic || 'Тикет')}</div><div class="ch-item-sub">${esc(t.topic || '')}${on ? ' · ' + esc(on) : ''}</div></span>
      <span class="ch-item-side"><span class="ch-item-date">${fmtShort(t.updatedAt || t.createdAt)}</span><span class="ch-chip${t.status === 'done' ? ' done' : ''}" title="${t.status === 'done' ? 'Решён' : 'Открыт'}"></span></span>
    </button>`;
  }).join('') : `<div class="ch-none">${query || filter !== 'all' ? 'Ничего не найдено' : 'Тикетов пока нет'}</div>`;
}

// ───────────── переписка ─────────────
const ICON_FILE = '<svg viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>';
const STAR = '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

function fileHref(t, m){ return `${API}/tickets/${encodeURIComponent(t.id)}/messages/${encodeURIComponent(m.id)}/file`; }

function msgHtml(t, m){
  const d = new Date(m.createdAt);
  const parts = [];
  if (m.text) parts.push(`<div class="ch-text">${linkify(m.text)}</div>`);
  if (safeImg(m.imageUrl)) parts.push(`<img src="${esc(m.imageUrl)}" alt="Вложение" data-lb="1">`);
  if (m.file) parts.push(`<a class="ch-file" href="${fileHref(t, m)}" target="_blank" rel="noopener">${ICON_FILE}<div><b>${esc(m.file.name)}</b><span>${fmtSize(m.file.size)}</span></div></a>`);
  return `<div class="ch-msg ${m.sender === 'admin' ? 'admin' : 'user'}">
    ${m.sender === 'admin' ? '<div class="ch-who">Команда Antviz</div>' : ''}
    <div class="ch-bubble">${parts.join('') || '&nbsp;'}</div>
    <div class="ch-time">${fmtTime(d)}</div>
  </div>`;
}

function rateHtml(t){
  if (t.status !== 'done') return '';
  if (t.rating && !t._rating) {
    return `<div class="ch-rate"><div class="ch-rated"><span>Ваша оценка</span><span class="st">${'★'.repeat(t.rating)}${'☆'.repeat(5 - t.rating)}</span><button data-act="rerate">изменить</button></div></div>`;
  }
  const cur = t._rating || 0;
  return `<div class="ch-rate">
    <h4>Как мы справились?</h4><p>Оцените ответ — это помогает нам работать лучше</p>
    <div class="ch-stars" id="chStars">${[1,2,3,4,5].map(n => `<button type="button" data-star="${n}" class="${n <= cur ? 'on' : ''}" aria-label="${n}">${STAR}</button>`).join('')}</div>
    <textarea id="chRateText" maxlength="1000" placeholder="Комментарий (необязательно)">${esc(t._ratingComment ?? t.ratingComment ?? '')}</textarea>
    <button class="cab-btn dark sm" data-act="submit-rate" ${cur ? '' : 'disabled'}>Отправить оценку</button>
  </div>`;
}

function renderMain(keepScroll){
  const t = active();
  const box = $('chMainInner');
  if (!t) {
    box.innerHTML = `<div class="ch-empty"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <h3>${tickets.length ? 'Выберите тикет' : 'Тикетов пока нет'}</h3>
      <p>${tickets.length ? 'Откройте диалог слева, чтобы прочитать переписку.' : 'Напишите нам — поможем с любым вопросом по проекту, оплате или сайту.'}</p>
      <a class="cab-btn primary" href="support-new">Новый тикет</a></div>`;
    return;
  }
  // Фоновое обновление не должно сбивать набор текста: запоминаем фокус и позицию курсора
  const ae = document.activeElement;
  const hadFocus = ae && ae.id === 'chInput';
  const selStart = hadFocus ? ae.selectionStart : 0, selEnd = hadFocus ? ae.selectionEnd : 0;
  const prevBody = $('chBody');
  const prevTop = prevBody ? prevBody.scrollTop : 0, wasBottom = prevBody ? prevBody.scrollHeight - prevBody.scrollTop - prevBody.clientHeight < 80 : true;
  const msgs = messages[t.id] || [];
  let body = '', lastDay = '';
  msgs.forEach(m => {
    const day = fmtDay(new Date(m.createdAt));
    if (day !== lastDay) { body += `<div class="ch-day">${day}</div>`; lastDay = day; }
    body += msgHtml(t, m);
  });
  body += rateHtml(t);
  const on = orderName(t);
  box.innerHTML = `
    <div class="ch-head">
      <div class="ch-head-info">
        <div class="ch-head-title">${esc(t.subject || t.topic || 'Тикет')}</div>
        <div class="ch-head-tags"><span class="cab-badge ${t.status}">${t.status === 'done' ? 'Решён' : 'Открыт'}</span><span class="cab-badge">${esc(t.topic || '')}</span>${on ? `<span class="cab-badge">${esc(on)}</span>` : ''}</div>
      </div>
      <button class="cab-btn ghost sm ch-info-btn" data-act="toggle-info">Детали</button>
    </div>
    <div class="ch-body" id="chBody">${body}</div>
    <div class="ch-compose">
      <div class="ch-pending" id="chPending"></div>
      <div class="ch-row">
        <button type="button" class="ch-ic ch-attach" data-act="attach" title="Прикрепить файл"><svg viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <textarea id="chInput" rows="1" placeholder="${t.status === 'done' ? 'Написать ещё — тикет откроется снова' : 'Написать сообщение…'}"></textarea>
        <button type="button" class="ch-ic ch-send" id="chSend" data-act="send" title="Отправить"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
      </div>
      <div class="ch-hint">Enter — отправить, Shift+Enter — новая строка. Файлы можно перетащить в чат или вставить из буфера.</div>
      <input type="file" id="chFile" multiple accept="${ACCEPT}" style="display:none">
    </div>`;
  const inp = $('chInput');
  inp.value = drafts[t.id] || '';
  autosize(inp);
  renderPending();
  const b = $('chBody');
  if (keepScroll && !wasBottom) b.scrollTop = prevTop; else b.scrollTop = b.scrollHeight;
  if (hadFocus) { inp.focus({ preventScroll: true }); try { inp.setSelectionRange(selStart, selEnd); } catch(e) {} }
}

function autosize(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px'; }

function renderPending(){
  const box = $('chPending'); if (!box) return;
  box.innerHTML = pending.map((f, i) => `<div class="ch-pend">${f.kind === 'image' ? `<img src="${f.dataUrl}" alt="">` : ''}<span>${esc(f.name)}</span><button data-rm="${i}" aria-label="Убрать"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>`).join('');
}

// ───────────── детали ─────────────
function renderInfo(){
  const t = active(); const el = $('chInfo');
  if (!t) { el.innerHTML = ''; return; }
  const msgs = messages[t.id] || [];
  const imgs = msgs.filter(m => safeImg(m.imageUrl)), fls = msgs.filter(m => m.file);
  const o = t.orderId ? orders.find(x => x.id === t.orderId) : null;
  el.innerHTML = `
    <button class="cab-btn ghost sm ch-info-close" data-act="toggle-info">Закрыть</button>
    <div>
      <h4>О тикете</h4>
      <div class="ch-kv">
        <div><span class="k">Статус</span><b>${t.status === 'done' ? 'Решён' : 'Открыт'}</b></div>
        <div><span class="k">Тема</span><b>${esc(t.topic || '—')}</b></div>
        <div><span class="k">Приоритет</span><b>${PRIO[t.priority] || '—'}</b></div>
        <div><span class="k">Создан</span><b>${new Date(t.createdAt).toLocaleDateString('ru', { day:'numeric', month:'long' })}</b></div>
        ${o ? `<div><span class="k">Заказ</span><a href="orders?id=${encodeURIComponent(o.id)}">${esc(o.siteDomain || '№ ' + o.id.slice(0,8).toUpperCase())}</a></div>` : (t.orderLabel ? `<div><span class="k">Заказ</span><b>${esc(orderName(t))}</b></div>` : '')}
        ${t.rating ? `<div><span class="k">Оценка</span><b style="color:var(--amber);letter-spacing:1px">${'★'.repeat(t.rating)}</b></div>` : ''}
      </div>
    </div>
    ${imgs.length ? `<div><h4>Изображения · ${imgs.length}</h4><div class="ch-media">${imgs.map(m => `<img src="${esc(m.imageUrl)}" alt="" data-lb="1">`).join('')}</div></div>` : ''}
    ${fls.length ? `<div><h4>Файлы · ${fls.length}</h4><div class="ch-flist">${fls.map(m => `<a href="${fileHref(t, m)}" target="_blank" rel="noopener">${ICON_FILE}<span>${esc(m.file.name)}</span><small>${fmtSize(m.file.size)}</small></a>`).join('')}</div></div>` : ''}
    ${!imgs.length && !fls.length ? '<div><h4>Вложения</h4><div style="font-size:14px;color:var(--text-faint)">В переписке пока нет файлов</div></div>' : ''}
    ${t.status === 'done' ? `<a class="cab-btn ghost sm" href="support-new?topic=${encodeURIComponent(t.topic || '')}">Создать новый тикет</a>` : ''}`;
}

// ───────────── действия ─────────────
async function loadMessages(id){
  try { messages[id] = await api('GET', `/tickets/${encodeURIComponent(id)}/messages`); }
  catch(e) { messages[id] = messages[id] || []; }
}

async function openTicket(id, opts = {}){
  const t = tickets.find(x => x.id === id); if (!t) return;
  if (activeId && $('chInput')) drafts[activeId] = $('chInput').value;
  activeId = id; pending = [];
  history.replaceState(null, '', 'support-chat?id=' + encodeURIComponent(id));
  const bt = $('pgBackTitle'); if (bt) bt.textContent = t.subject || 'Чат с командой';
  renderList();
  await loadMessages(id);
  renderMain(false); renderInfo();
  $('chInfo').classList.remove('is-open');
  if (t.read === false) {
    t.read = true; renderList();
    api('PATCH', `/tickets/${encodeURIComponent(id)}/read`).catch(() => {});
  }
  if (!opts.noFocus) $('chInput')?.focus({ preventScroll: true });
}

async function send(){
  const t = active(); if (!t || sending) return;
  const inp = $('chInput'); const text = inp.value.trim();
  if (!text && !pending.length) return;
  sending = true; $('chSend').disabled = true;
  const queue = [...pending];
  try {
    const first = queue.shift();
    const m1 = await api('POST', `/tickets/${encodeURIComponent(t.id)}/messages`, { text: text || undefined, ...attachmentPayload(first) });
    (messages[t.id] = messages[t.id] || []).push(m1);
    for (const att of queue) {
      try { const m = await api('POST', `/tickets/${encodeURIComponent(t.id)}/messages`, attachmentPayload(att)); messages[t.id].push(m); }
      catch(e) { toast(`«${att.name}»: ${e.message}`, 'error'); }
    }
    pending = []; drafts[t.id] = '';
    if (t.status === 'done') t.status = 'open';   // сервер переоткрывает тикет при новом сообщении
    t.updatedAt = new Date().toISOString();
    renderList(); renderMain(false); renderInfo();
    $('chInput')?.focus();
  } catch(e) {
    toast(e.message || 'Не удалось отправить', 'error');
  }
  sending = false; if ($('chSend')) $('chSend').disabled = false;
}

async function addFiles(list){
  for (const file of Array.from(list)) {
    if (pending.length >= MAX_FILES) { toast(`Не больше ${MAX_FILES} файлов за раз`, 'error'); break; }
    try { pending.push(await prepareFile(file)); } catch(e) { toast(e.message, 'error'); }
  }
  renderPending();
}

async function submitRating(){
  const t = active(); if (!t || !t._rating) return;
  try {
    const upd = await api('PATCH', `/tickets/${encodeURIComponent(t.id)}/rate`, { rating: t._rating, comment: $('chRateText')?.value || '' });
    Object.assign(t, { rating: upd.rating, ratingComment: upd.ratingComment, ratedAt: upd.ratedAt });
    delete t._rating; delete t._ratingComment;
    toast('Спасибо за оценку!', 'success');
    renderMain(true); renderInfo();
  } catch(e) { toast(e.message || 'Не удалось сохранить оценку', 'error'); }
}

// ───────────── события ─────────────
$('chItems').addEventListener('click', e => { const b = e.target.closest('.ch-item'); if (b) openTicket(b.dataset.id, { noFocus: false }); });
$('chSearch').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderList(); });
$('chTabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]'); if (!b) return;
  filter = b.dataset.f;
  $('chTabs').querySelectorAll('button').forEach(x => x.classList.toggle('is-active', x === b));
  renderList();
});

$('chMainInner').addEventListener('click', e => {
  const img = e.target.closest('[data-lb]'); if (img) { $('lbImg').src = img.src; $('lb').classList.add('show'); return; }
  const rm = e.target.closest('[data-rm]'); if (rm) { pending.splice(+rm.dataset.rm, 1); renderPending(); return; }
  const star = e.target.closest('[data-star]');
  if (star) {
    const t = active(); t._rating = +star.dataset.star;
    t._ratingComment = $('chRateText')?.value;
    renderMain(true); $('chRateText').value = t._ratingComment || '';
    return;
  }
  const act = e.target.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  if (a === 'send') send();
  else if (a === 'attach') $('chFile').click();
  else if (a === 'toggle-info') $('chInfo').classList.toggle('is-open');
  else if (a === 'rerate') { const t = active(); t._rating = t.rating; renderMain(true); }
  else if (a === 'submit-rate') submitRating();
});
$('chMainInner').addEventListener('input', e => { if (e.target.id === 'chInput') { autosize(e.target); if (activeId) drafts[activeId] = e.target.value; } });
$('chMainInner').addEventListener('keydown', e => {
  if (e.target.id === 'chInput' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$('chMainInner').addEventListener('change', e => { if (e.target.id === 'chFile') { addFiles(e.target.files); e.target.value = ''; } });
$('chInfo').addEventListener('click', e => {
  const img = e.target.closest('[data-lb]'); if (img) { $('lbImg').src = img.src; $('lb').classList.add('show'); return; }
  if (e.target.closest('[data-act="toggle-info"]')) $('chInfo').classList.toggle('is-open');
});
$('lb').addEventListener('click', () => { $('lb').classList.remove('show'); $('lbImg').src = ''; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('lb').classList.remove('show'); $('chInfo').classList.remove('is-open'); } });

// drag & drop + вставка из буфера
const main = $('chMain');
let dragDepth = 0;
main.addEventListener('dragenter', e => { if (e.dataTransfer?.types?.includes('Files') && active()) { dragDepth++; main.classList.add('is-drag'); } });
main.addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
main.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) main.classList.remove('is-drag'); });
main.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; main.classList.remove('is-drag'); if (active() && e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });
document.addEventListener('paste', e => {
  if (!active()) return;
  const imgs = Array.from(e.clipboardData?.files || []).filter(f => f.type.startsWith('image/'));
  if (imgs.length) { e.preventDefault(); addFiles(imgs); }
});

// ───────────── обновление в фоне ─────────────
// Список тикетов лёгкий (без сообщений) — по нему видим, что в открытом диалоге появился ответ,
// и только тогда подтягиваем сообщения.
async function poll(){
  if (document.visibilityState !== 'visible' || sending) return;
  try {
    const fresh = await api('GET', '/tickets');
    let changedActive = false;
    fresh.forEach(f => {
      const cur = tickets.find(t => t.id === f.id);
      if (cur) {
        if (f.id === activeId && f.updatedAt !== cur.updatedAt) changedActive = true;
        const keep = { _rating: cur._rating, _ratingComment: cur._ratingComment };
        const wasActive = f.id === activeId;
        Object.assign(cur, f, keep);
        if (wasActive) cur.read = true;   // открытый диалог считаем прочитанным
      } else tickets.push(f);
    });
    if (changedActive) {
      await loadMessages(activeId);
      renderMain(true); renderInfo();
      api('PATCH', `/tickets/${encodeURIComponent(activeId)}/read`).catch(() => {});
    }
    renderList();
  } catch(e) {}
}

// ───────────── старт ─────────────
(async function init(){
  let user = null;
  try { const r = await fetch(`${API}/auth/me`, { credentials:'include' }); if (r.ok) user = await r.json(); } catch(e) {}
  if (!user) { window.location.href = '../auth'; return; }
  $('loadingScreen').style.display = 'none';
  $('sbContent').style.display = 'block';

  const [tRes, oRes] = await Promise.all([
    fetch(`${API}/tickets`, { credentials:'include' }).catch(() => null),
    fetch(`${API}/orders`, { credentials:'include' }).catch(() => null),
  ]);
  tickets = tRes && tRes.ok ? await tRes.json() : [];
  orders = oRes && oRes.ok ? await oRes.json() : [];
  renderList();

  const wanted = new URLSearchParams(location.search).get('id');
  const sorted = [...tickets].sort((a,b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
  const first = tickets.find(t => t.id === wanted) || sorted[0];
  if (wanted && !tickets.some(t => t.id === wanted)) toast('Тикет не найден — открыт последний', 'error');
  if (first) await openTicket(first.id, { noFocus: !!wanted ? false : true }); else renderMain(false);

  touchSession();
  pollTimer = setInterval(poll, 12000);
})();
</script>
