<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Поддержка — Antviz</title>
<link rel="icon" href="../img/favicon.png" type="image/png">
<script>
  try{
    var t = localStorage.getItem('antviz-theme');
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101113;--card:#191b1e;--card-elevated:#1e2124;--stroke:#2a2d31;
    --text:#f4f5f6;--text-dim:#9a9da2;--text-faint:#65686d;
    --green:#1ede7b;--green-dim:rgba(30,222,123,0.14);--green-text:#1ede7b;
    --blue:#4d9fff;--blue-dim:rgba(77,159,255,0.14);
    --amber:#ffb74d;--amber-dim:rgba(255,183,77,0.14);
    --red:#ff5c5c;--red-dim:rgba(255,92,92,0.14);
    --shadow:0 12px 30px rgba(0,0,0,0.4);
    --r64:64px;--r40:40px;--r32:32px;--r24:24px;--r20:20px;--r16:16px;--r14:14px;--r12:12px;
  }
  html[data-theme="light"]{
    --bg:#f3f4f6;--card:#ffffff;--card-elevated:#fafbfc;--stroke:#e6e8eb;
    --text:#15171a;--text-dim:#6b6f76;--text-faint:#9a9da2;
    --green-dim:rgba(18,184,102,0.12);--green-text:#0fa860;
    --blue-dim:rgba(77,159,255,0.12);--amber-dim:rgba(230,150,40,0.14);--red-dim:rgba(230,60,60,0.10);
    --shadow:0 12px 30px rgba(20,20,25,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);}
  body{color:var(--text);font-family:'Geologica',sans-serif;letter-spacing:-0.03em;font-weight:400;transition:background .2s ease,color .2s ease;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .spinner{width:26px;height:26px;border:2px solid var(--stroke);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;}

  .app{display:flex;justify-content:center;}
  .content{width:100%;max-width:640px;padding:4px 0 8px;display:flex;flex-direction:column;gap:20px;}

  .topbar{display:flex;align-items:center;padding:4px 4px 4px 8px;gap:14px;}
  .page-title{font-size:19px;font-weight:600;}
  .topbar-right{display:flex;gap:10px;}
  .icon-btn{width:46px;height:46px;border-radius:var(--r14);background:var(--card);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;color:var(--text-dim);position:relative;cursor:pointer;flex-shrink:0;text-decoration:none;padding:0;font:inherit;}
  .icon-btn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--green);display:none;}
  .icon-btn svg{width:21px;height:21px;}
  #menuBtnMobile{display:flex;}
  @media (min-width:981px){ #menuBtnMobile{display:none;} }

  .hero{background:var(--card);border-radius:var(--r32);padding:24px;border:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .hero-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .hero-ico{width:44px;height:44px;border-radius:var(--r14);background:var(--card-elevated);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;color:var(--green-text);flex-shrink:0;}
  .hero-ico svg{width:20px;height:20px;}
  .hero-title{font-size:16px;font-weight:600;}
  .hero-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;max-width:320px;}
  .hero-stats{display:flex;gap:24px;flex-wrap:wrap;}
  .hero-stat-label{font-size:12px;color:var(--text-dim);margin-bottom:5px;}
  .hero-stat-value{font-size:24px;font-weight:600;line-height:1;}
  .hero-stat-value.accent{color:var(--green-text);}

  .section-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0;gap:12px;flex-wrap:wrap;}
  .section-title-wrap{display:flex;align-items:center;gap:8px;}
  .section-title{font-size:15px;font-weight:600;}
  .unread-pill{display:none;align-items:center;justify-content:center;background:var(--red);color:#fff;font-size:11px;font-weight:600;min-width:19px;height:19px;padding:0 5px;border-radius:20px;}

  .btn-new{display:flex;align-items:center;gap:7px;background:var(--green);color:#0d1210;font-weight:600;font-size:12.5px;padding:10px 15px;border-radius:var(--r16);border:none;cursor:pointer;white-space:nowrap;}
  .btn-new svg{width:14px;height:14px;}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .tabs{display:inline-flex;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r20);padding:4px;gap:2px;overflow-x:auto;flex-shrink:0;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{border:none;background:transparent;color:var(--text-dim);font-family:inherit;font-size:12.5px;font-weight:500;padding:10px 14px;border-radius:var(--r16);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;height:38px;}
  .tab.active{background:var(--green);color:#0d1210;}
  .tab-count{font-size:10.5px;font-weight:600;opacity:.7;}

  .field-select{background-color:var(--card);border:1px solid var(--stroke);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:500;border-radius:var(--r16);padding:0 30px 0 14px;height:46px;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239a9da2' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:12px 12px;flex-shrink:0;}
  .field-select:focus{outline:none;border-color:var(--green);}

  .search-box{position:relative;flex:1;min-width:140px;}
  .search-box input{width:100%;height:46px;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r16);padding:0 16px 0 42px;color:var(--text);font-family:inherit;font-size:13px;outline:none;}
  .search-box input:focus{border-color:var(--green);}
  .search-box input::placeholder{color:var(--text-faint);}
  .search-box svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-faint);}

  /* ── ticket list ── */
  .card{background:var(--card);border-radius:var(--r24);border:1px solid var(--stroke);}
  .list-card{overflow:hidden;}
  .t-row{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--stroke);cursor:pointer;transition:background .12s;position:relative;}
  .t-row:last-child{border-bottom:none;}
  .t-row:hover{background:var(--card-elevated);}
  .t-row.active{background:var(--green-dim);}
  .t-icon{width:38px;height:38px;border-radius:var(--r14);background:var(--card-elevated);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;}
  .t-row.active .t-icon{color:var(--green-text);}
  .t-icon svg{width:17px;height:17px;}
  .t-mid{flex:1;min-width:0;}
  .t-subject{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-subject .unread-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .t-preview{font-size:12px;color:var(--text-faint);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .t-time{font-size:10.5px;color:var(--text-faint);}
  .badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:4px 9px;border-radius:var(--r20);white-space:nowrap;}
  .badge.open{background:var(--blue-dim);color:var(--blue);}
  .badge.in-progress{background:var(--amber-dim);color:var(--amber);}
  .badge.resolved{background:var(--green-dim);color:var(--green-text);}
  .badge.closed{background:var(--card-elevated);color:var(--text-faint);}

  .empty-row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-faint);font-size:13px;padding:48px 20px;text-align:center;}
  .empty-row svg{width:32px;height:32px;opacity:.5;}

  /* ── chat panel (mobile = fullscreen slide-in, desktop = static column) ── */
  .chat-wrap{position:fixed;inset:0;background:var(--bg);z-index:500;transform:translateX(100%);transition:transform .25s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;}
  .chat-wrap.open{transform:translateX(0);}
  .chat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--stroke);flex-shrink:0;background:var(--card);}
  .chat-back{display:flex;}
  .chat-head-ico{width:40px;height:40px;border-radius:var(--r14);background:var(--card-elevated);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;color:var(--green-text);flex-shrink:0;}
  .chat-head-ico svg{width:18px;height:18px;}
  .chat-head-info{flex:1;min-width:0;}
  .chat-title{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-sub{font-size:12px;color:var(--text-dim);margin-top:3px;display:flex;align-items:center;gap:6px;}
  .chat-sub .dotsep{width:3px;height:3px;border-radius:50%;background:var(--text-faint);}

  .chat-messages{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:2px;}
  .date-sep{align-self:center;font-size:11px;color:var(--text-faint);background:var(--card-elevated);border:1px solid var(--stroke);padding:5px 12px;border-radius:20px;margin:8px 0 14px;}
  .msg-group{display:flex;flex-direction:column;max-width:78%;margin-bottom:10px;}
  .msg-group.user{align-self:flex-end;align-items:flex-end;}
  .msg-group.support{align-self:flex-start;align-items:flex-start;}
  .msg-author{font-size:11.5px;color:var(--text-dim);margin:0 4px 4px;font-weight:600;}
  .msg-bubble{padding:9px 13px 8px;font-size:14px;line-height:1.45;}
  .msg-group.user .msg-bubble{background:var(--green);color:#0d1210;border-radius:18px 18px 4px 18px;}
  .msg-group.support .msg-bubble{background:var(--card-elevated);color:var(--text);border-radius:18px 18px 18px 4px;border:1px solid var(--stroke);}
  .msg-time{font-size:10px;opacity:.65;display:inline-block;margin-left:8px;float:right;margin-top:4px;}
  .msg-bubble.has-image{padding:0;overflow:hidden;position:relative;}
  .msg-bubble.has-image .msg-img{display:block;width:100%;max-width:240px;max-height:300px;object-fit:cover;cursor:zoom-in;}
  .msg-bubble.has-image .msg-caption{padding:9px 13px 8px;}
  .msg-time-overlay{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:3px 8px;border-radius:20px;}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:800;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;}
  .lightbox-close{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .lightbox-close svg{width:18px;height:18px;}

  .chat-input-row{display:flex;gap:8px;align-items:center;padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--stroke);flex-shrink:0;background:var(--card);}
  .chat-input-pill{flex:1;display:flex;align-items:center;background:var(--card-elevated);border:1px solid var(--stroke);border-radius:22px;padding:0 6px 0 16px;min-height:44px;}
  .chat-input-pill input{flex:1;background:transparent;border:none;outline:none;font-family:inherit;font-size:14px;color:var(--text);padding:11px 0;}
  .chat-input-pill input::placeholder{color:var(--text-faint);}
  .attach-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;border:none;background:transparent;cursor:pointer;}
  .attach-btn svg{width:19px;height:19px;}
  .send-btn{width:40px;height:40px;border-radius:50%;background:var(--green);color:#0d1210;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
  .send-btn svg{width:18px;height:18px;}
  .send-btn:disabled{opacity:.4;cursor:default;}

  .chat-empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-faint);text-align:center;padding:40px;}
  .chat-empty-state svg{width:40px;height:40px;opacity:.4;}
  .chat-empty-state span{font-size:13px;}

  /* ── new ticket modal ── */
  .modal-overlay{position:fixed;inset:0;z-index:600;background:rgba(10,10,11,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-overlay.show{opacity:1;pointer-events:all;}
  .modal{background:var(--card);border-radius:var(--r24);border:1px solid var(--stroke);padding:26px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;transform:translateY(16px);transition:transform .22s cubic-bezier(.22,1,.36,1);}
  .modal-overlay.show .modal{transform:translateY(0);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .modal-head h3{font-size:16px;font-weight:600;}
  .field-label{font-size:11.5px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px;display:block;}
  .field-input,.field-modal-select,.field-textarea{width:100%;background:var(--card-elevated);border:1px solid var(--stroke);border-radius:var(--r14);padding:11px 14px;font-family:inherit;font-size:13.5px;color:var(--text);margin-bottom:14px;outline:none;}
  .field-textarea{resize:vertical;min-height:84px;}
  .field-input:focus,.field-modal-select:focus,.field-textarea:focus{border-color:var(--green);}
  .field-modal-select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239a9da2' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:11px 11px;padding-right:34px;}

  .order-pick{display:flex;align-items:center;gap:11px;background:var(--card-elevated);border:1.5px solid var(--stroke);border-radius:var(--r14);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
  .order-pick.selected{border-color:var(--green);background:var(--green-dim);}
  .order-pick-ico{width:32px;height:32px;border-radius:var(--r12);background:var(--card);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;}
  .order-pick-ico svg{width:15px;height:15px;}
  .order-pick.selected .order-pick-ico{color:var(--green-text);}
  .order-pick-title{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .order-pick-sub{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .order-pick-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--stroke);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;margin-left:auto;}
  .order-pick.selected .order-pick-check{border-color:var(--green);background:var(--green);color:#0d1210;}
  .order-pick-check svg{width:10px;height:10px;stroke:currentColor;stroke-width:3;fill:none;}

  .file-dropzone{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--stroke);border-radius:var(--r14);padding:12px 14px;cursor:pointer;margin-bottom:6px;}
  .file-dropzone:hover{border-color:var(--green);background:var(--green-dim);}
  .file-dropzone-ico{width:32px;height:32px;border-radius:var(--r12);background:var(--card-elevated);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;}
  .file-dropzone-ico svg{width:15px;height:15px;}
  .file-dropzone-text{font-size:12.5px;color:var(--text-dim);}
  .file-dropzone-text strong{color:var(--text);font-weight:500;}
  .file-preview{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);margin-bottom:10px;}
  .file-preview .remove-file{cursor:pointer;color:var(--red);font-weight:600;}

  .btn-primary{width:100%;background:var(--green);color:#0d1210;font-weight:600;font-size:13.5px;padding:13px;border-radius:var(--r16);border:none;cursor:pointer;margin-top:4px;}
  .btn-outline{width:100%;background:transparent;color:var(--text-dim);font-weight:500;font-size:13.5px;padding:13px;border-radius:var(--r16);border:1px solid var(--stroke);cursor:pointer;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);z-index:700;padding:12px 20px;border-radius:var(--r16);font-size:13px;font-weight:500;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;white-space:nowrap;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.success{background:var(--green);color:#0d1210;}
  .toast.error{background:var(--red);color:#fff;}
  .toast.info{background:var(--card-elevated);color:var(--text);border:1px solid var(--stroke);}

  #sbContent{padding-bottom:80px;}

  @media (min-width:981px){
    .content{max-width:1180px;padding:8px 0 16px;}
    .page-title{font-size:22px;}
    .hero{padding:32px 36px;}
    .hero-ico{width:52px;height:52px;}
    .hero-ico svg{width:24px;height:24px;}
    .hero-title{font-size:19px;}
    .hero-sub{font-size:13.5px;max-width:none;}
    .hero-stat-label{font-size:13px;}
    .hero-stat-value{font-size:32px;}
    .hero-stats{gap:40px;}

    .section-title{font-size:18px;}
    .toolbar{margin-left:auto;}
    .section-head{flex-wrap:nowrap;}

    .list-detail{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start;}
    .list-card{height:640px;display:flex;flex-direction:column;}
    .list-card .list-scroll{flex:1;overflow-y:auto;}

    .chat-wrap{position:static;transform:none;z-index:auto;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r24);height:640px;overflow:hidden;}
    .chat-back{display:none;}
    .chat-head{border-radius:var(--r24) var(--r24) 0 0;}
    .chat-input-row{border-radius:0 0 var(--r24) var(--r24);}
  }
  @media (max-width:980px){
    .list-detail{display:contents;}
  }
  </style>
</head>
<body>
<script src="../sidebar.js" data-page="support"></script>
<div id="sbContent">
<div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>
<div id="cabinet" style="display:none">
<div class="app">
  <div class="content">

    <div class="topbar">
      <button class="icon-btn" id="menuBtnMobile" aria-label="Меню" title="Меню">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
      </button>
      <div class="page-title">Поддержка</div>
    </div>

    <div class="hero">
      <div class="hero-left">
        <div class="hero-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/></svg></div>
        <div>
          <div class="hero-title">Поддержка Antviz</div>
          <div class="hero-sub">Вопросы, идеи, сообщения об ошибках — ответим в приоритетном порядке</div>
        </div>
      </div>
      <div class="hero-stats">
        <div><div class="hero-stat-label">Открытых</div><div class="hero-stat-value" id="statOpen">0</div></div>
        <div><div class="hero-stat-label">Всего</div><div class="hero-stat-value" id="statTotal">0</div></div>

<script>
// ── тема (общая для всех страниц кабинета через localStorage, переключатель на странице настроек) ──
</script>

<script type="module">
import { auth, db } from '../firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  collection, query, where, orderBy, onSnapshot,
  addDoc, serverTimestamp, doc, updateDoc, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let currentUser = null;
let allTickets = [];
let userOrders = [];
let unsubTickets = null;
let unsubMessages = {};
let selectedOrderId = null;
let activeTicketId = null;

function toast(msg, type='info'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  clearTimeout(t._h); t._h = setTimeout(()=> t.className='toast', 3200);
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(ts){
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  if(d>=today) return d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  if(d>=yesterday) return 'Вчера';
  return d.toLocaleDateString('ru',{day:'numeric',month:'short'});
}
function statusLabel(s){ return {open:'Открыт','in-progress':'В работе',resolved:'Решён',closed:'Закрыт'}[s] || s; }
function orderLabel(o){
  return (o.siteDomain || ('№ '+o.id.slice(0,8).toUpperCase())) + ' · ' + (o.siteType||'Сайт');
}

const TOPIC_ICONS = {
  'Техническая проблема': '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>',
  'Идея / предложение': '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M15 14c.2-1 .7-1.7 1.5-2.5A5.5 5.5 0 1 0 5.5 12c0 1.5.5 2.5 1.5 3.5.6.5 1 1 1.2 2z"/>',
  'Вопрос по оплате': '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>',
  'Правки по проекту': '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/><path d="m15 5 4 4"/>',
  'Другое': '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/>'
};
function topicIcon(topic){ return TOPIC_ICONS[topic] || TOPIC_ICONS['Другое']; }

const ORDER_TYPE_ICONS = {
  landing: '<rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/>',
  multipage: '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/>',
  shop: '<path d="M16 10a4 4 0 0 1-8 0"/><path d="M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/>',
  custom: '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/>'
};
function orderTypeIcon(o){
  const t = (o.siteType || '').toLowerCase();
  if(t.includes('магазин')) return ORDER_TYPE_ICONS.shop;
  if(t.includes('лендинг')) return ORDER_TYPE_ICONS.landing;
  if(t.includes('многостран')) return ORDER_TYPE_ICONS.multipage;
  return ORDER_TYPE_ICONS.custom;
}
const CHECK_ICON = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

function hasUnread(ticket){
  const msgs = ticket._messages || [];
  if(!msgs.length) return false;
  const last = msgs[msgs.length-1];
  return last.sender==='support' && !ticket._read;
}

function renderOrderPicker(){
  const el = document.getElementById('orderPickList');
  if(!userOrders.length){
    el.innerHTML = `<div class="empty-row" style="padding:20px 0;">Заказов пока нет — тикет создастся без привязки</div>`;
    selectedOrderId = null;
    return;
  }
  selectedOrderId = userOrders[0].id;
  el.innerHTML = userOrders.map((o,i)=>`
    <div class="order-pick${i===0?' selected':''}" data-id="${o.id}">
      <div class="order-pick-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${orderTypeIcon(o)}</svg></div>
      <div style="min-width:0;flex:1;">
        <div class="order-pick-title">${esc(orderLabel(o))}</div>
        <div class="order-pick-sub">Заказ</div>
      </div>
      <div class="order-pick-check">${CHECK_ICON}</div>
    </div>`).join('') + `
    <div class="order-pick" data-id="">
      <div class="order-pick-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5a8.5 8.5 0 01-12.4 7.55L4 20l1.02-3.9a8.5 8.4 0 1115.48-4.6z"/></svg></div>
      <div style="min-width:0;flex:1;">
        <div class="order-pick-title">Без привязки</div>
        <div class="order-pick-sub">Общий вопрос</div>
      </div>
      <div class="order-pick-check">${CHECK_ICON}</div>
    </div>`;
  el.querySelectorAll('.order-pick').forEach(row=>{
    row.addEventListener('click', ()=>{
      selectedOrderId = row.dataset.id || null;
      el.querySelectorAll('.order-pick').forEach(r=>r.classList.toggle('selected', r===row));
    });
  });
}

function renderTickets(){
  const el = document.getElementById('ticketsList');
  const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const topicFilter = document.getElementById('topicFilter')?.value || 'all';
  const statusFilter = document.querySelector('.tab.active')?.dataset.filter || 'all';

  let filtered = allTickets.filter(t=>{
    if(statusFilter!=='all' && t.status!==statusFilter) return false;
    if(topicFilter!=='all' && t.topic!==topicFilter) return false;
    if(search){
      const inSubject = (t.subject||'').toLowerCase().includes(search);
      const inTopic = (t.topic||'').toLowerCase().includes(search);
      const inMsgs = (t._messages||[]).some(m=>(m.text||'').toLowerCase().includes(search));
      return inSubject || inTopic || inMsgs;
    }
    return true;
  });
  filtered.sort((a,b)=>{
    const au = hasUnread(a)?1:0, bu = hasUnread(b)?1:0;
    if(au!==bu) return bu-au;
    const at = a.updatedAt?.seconds || a.createdAt?.seconds || 0;
    const bt = b.updatedAt?.seconds || b.createdAt?.seconds || 0;
    return bt-at;
  });

  const tabCounts = {all:allTickets.length, open:0, 'in-progress':0, resolved:0};
  allTickets.forEach(t=>{ if(tabCounts[t.status]!==undefined) tabCounts[t.status]++; });
  Object.keys(tabCounts).forEach(k=>{
    const c = document.getElementById(`tabCount-${k}`);
    if(c) c.textContent = tabCounts[k];
  });

  const unreadCount = allTickets.filter(hasUnread).length;
  const pill = document.getElementById('unreadPill');
  pill.style.display = unreadCount ? 'flex' : 'none';
  pill.textContent = unreadCount;

  document.getElementById('statOpen').textContent = allTickets.filter(t=>t.status==='open').length;
  document.getElementById('statTotal').textContent = allTickets.length;
  document.getElementById('statResolved').textContent = allTickets.filter(t=>t.status==='resolved').length;

  if(!filtered.length){
    el.innerHTML = `<div class="empty-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Тикетов не найдено
    </div>`;
    return;
  }

  el.innerHTML = filtered.map(t=>{
    const unread = hasUnread(t);
    const msgs = t._messages || [];
    const lastMsg = msgs[msgs.length-1];
    const preview = lastMsg ? (lastMsg.sender==='user' ? 'Вы: ' : '') + esc((lastMsg.text||'').slice(0,50)) : esc(t.topic||'');
    return `<div class="t-row${t.id===activeTicketId?' active':''}" data-id="${t.id}">
      <div class="t-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${topicIcon(t.topic)}</svg></div>
      <div class="t-mid">
        <div class="t-subject">${unread?'<span class="unread-dot"></span>':''}${esc(t.subject || t.topic || 'Тикет')}</div>
        <div class="t-preview">${preview}</div>
      </div>
      <div class="t-right">
        <span class="badge ${t.status}">${statusLabel(t.status)}</span>
        <span class="t-time">${formatDate(t.updatedAt || t.createdAt)}</span>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.t-row').forEach(row=>{
    row.addEventListener('click', ()=> openTicket(row.dataset.id));
  });
}

const ICON_SUPPORT_PATHS = '<path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/>';

function buildChat(msgs){
  if(!msgs.length) return `<div class="chat-empty-state" style="height:100%;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICON_SUPPORT_PATHS}</svg><span>Начните диалог — напишите первым</span></div>`;
  let html = ''; let lastDate = '';
  msgs.forEach(m=>{
    const d = m.createdAt?.toDate ? m.createdAt.toDate() : new Date();
    const dateStr = d.toLocaleDateString('ru',{day:'numeric',month:'long'});
    if(dateStr !== lastDate){ html += `<div class="date-sep">${dateStr}</div>`; lastDate = dateStr; }
    const time = d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    const cls = m.sender==='user' ? 'user' : 'support';
    const caption = (m.text && m.text!=='Вложение') ? esc(m.text).replace(/\n/g,'<br>') : '';
    if(m.imageUrl){
      html += `<div class="msg-group ${cls}">
        ${cls==='support' ? '<div class="msg-author">Поддержка Antviz</div>' : ''}
        <div class="msg-bubble has-image">
          <img class="msg-img" src="${esc(m.imageUrl)}" alt="Вложение" onclick="openLightbox('${esc(m.imageUrl)}')">
          ${caption ? `<div class="msg-caption">${caption}<span class="msg-time">${time}</span></div>` : `<span class="msg-time-overlay">${time}</span>`}
        </div>
      </div>`;
    } else {
      html += `<div class="msg-group ${cls}">
        ${cls==='support' ? '<div class="msg-author">Поддержка Antviz</div>' : ''}
        <div class="msg-bubble">${caption}<span class="msg-time">${time}</span></div>
      </div>`;
    }
  });
  return html;
}
window.openLightbox = function(url){
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = url;
  lb.classList.add('show');
};
window.closeLightbox = function(){ document.getElementById('lightbox').classList.remove('show'); };

function openTicket(id){
  const ticket = allTickets.find(t=>t.id===id);
  if(!ticket) return;
  activeTicketId = id;

  if(ticket._read===false){
    ticket._read = true;
    updateDoc(doc(db,'tickets',id), {_read:true}).catch(()=>{});
  }

  document.getElementById('chatEmptyState').style.display = 'none';
  document.getElementById('chatActive').style.display = 'flex';
  document.getElementById('chatWrap').classList.add('open');

  const icoEl = document.getElementById('chatIco');
  icoEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${topicIcon(ticket.topic)}</svg>`;
  document.getElementById('chatTitle').textContent = ticket.subject || ticket.topic || 'Тикет';

  const linkedOrder = ticket.orderId ? userOrders.find(o=>o.id===ticket.orderId) : null;
  const subEl = document.getElementById('chatSub');
  subEl.innerHTML = `<span class="badge ${ticket.status}">${statusLabel(ticket.status)}</span>` +
    (linkedOrder ? `<span class="dotsep"></span><span>${esc(linkedOrder.siteDomain || orderLabel(linkedOrder))}</span>` : '');

  document.getElementById('chatMessages').innerHTML = buildChat(ticket._messages || []);
  document.getElementById('chatInput').value = '';
  scrollChatToBottom();
  renderTickets();
}

function scrollChatToBottom(){
  setTimeout(()=>{
    const box = document.getElementById('chatMessages');
    box.scrollTop = box.scrollHeight;
  }, 60);
}

function closeChat(){
  document.getElementById('chatWrap').classList.remove('open');
  activeTicketId = null;
}

document.getElementById('chatBackBtn').addEventListener('click', closeChat);

document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
document.getElementById('chatInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') sendChatMessage();
});
async function sendChatMessage(){
  if(!activeTicketId) return;
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  try{
    await addDoc(collection(db,'tickets',activeTicketId,'messages'), {sender:'user', text, imageUrl:null, createdAt:serverTimestamp()});
    await updateDoc(doc(db,'tickets',activeTicketId), {updatedAt:serverTimestamp(), _read:true, status:'open'});
    scrollChatToBottom();
  }catch(e){ toast('Ошибка отправки', 'error'); }
}

document.getElementById('chatFileInput').addEventListener('change', async function(){
  if(!activeTicketId) return;
  const file = this.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')) return toast('Только изображения', 'error');
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      await addDoc(collection(db,'tickets',activeTicketId,'messages'), {sender:'user', text:'Вложение', imageUrl:e.target.result, createdAt:serverTimestamp()});
      await updateDoc(doc(db,'tickets',activeTicketId), {updatedAt:serverTimestamp(), _read:true});
      toast('Изображение отправлено ✓', 'success');
      scrollChatToBottom();
    }catch(err){ toast('Ошибка', 'error'); }
  };
  reader.readAsDataURL(file);
  this.value = '';
});

function openModal(){
  document.getElementById('ticketFormOverlay').classList.add('show');
  document.getElementById('ticketSubject').value = '';
  document.getElementById('ticketMessage').value = '';
  document.getElementById('ticketFile').value = '';
  document.getElementById('filePreview').innerHTML = '';
  window._pendingFile = null;
  renderOrderPicker();
}
function closeModal(){ document.getElementById('ticketFormOverlay').classList.remove('show'); }

document.getElementById('newTicketBtn').addEventListener('click', openModal);
document.getElementById('closeModalBtn').addEventListener('click', closeModal);
document.getElementById('cancelTicketBtn').addEventListener('click', closeModal);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('ticketFormOverlay').addEventListener('click', e=>{
  if(e.target.id==='ticketFormOverlay') closeModal();
});

document.getElementById('ticketFile').addEventListener('change', function(){
  const file = this.files[0];
  const preview = document.getElementById('filePreview');
  if(file){
    window._pendingFile = file;
    preview.innerHTML = `<span>${esc(file.name)}</span> <span class="remove-file" id="removeFileBtn">✕</span>`;
    document.getElementById('removeFileBtn').addEventListener('click', ()=>{
      document.getElementById('ticketFile').value = '';
      preview.innerHTML = '';
      window._pendingFile = null;
    });
  } else { preview.innerHTML = ''; window._pendingFile = null; }
});

document.getElementById('submitTicketBtn').addEventListener('click', async function(){
  const topic = document.getElementById('ticketTopic').value;
  const priority = document.getElementById('ticketPriority').value;
  const subject = document.getElementById('ticketSubject').value.trim();
  const message = document.getElementById('ticketMessage').value.trim();
  if(!subject) return toast('Введите краткое описание', 'error');
  if(!message) return toast('Напишите сообщение', 'error');
  this.disabled = true; this.textContent = 'Отправка...';
  const linkedOrder = selectedOrderId ? userOrders.find(o=>o.id===selectedOrderId) : null;
  const doCreate = async (imageUrl)=>{
    try{
      const ticketRef = await addDoc(collection(db,'tickets'), {
        uid: currentUser.uid, userName: currentUser.displayName || 'Пользователь',
        userEmail: currentUser.email || '', topic, priority, subject,
        orderId: selectedOrderId || null,
        orderLabel: linkedOrder ? orderLabel(linkedOrder) : null,
        status: 'open', _read: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
      await addDoc(collection(db,'tickets',ticketRef.id,'messages'), {sender:'user', text:message, imageUrl:imageUrl||null, createdAt:serverTimestamp()});
      closeModal();
      toast('Тикет создан ✓', 'success');
    }catch(e){ toast('Ошибка: ' + e.message, 'error'); }
    this.disabled = false; this.textContent = 'Отправить';
  };
  const file = window._pendingFile;
  if(file && file.type.startsWith('image/')){
    const reader = new FileReader();
    reader.onload = e=> doCreate(e.target.result);
    reader.readAsDataURL(file);
  } else { await doCreate(null); }
});

document.getElementById('ticketTabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b===btn));
  renderTickets();
});

let searchTimeout;
document.getElementById('searchInput').addEventListener('input', ()=>{ clearTimeout(searchTimeout); searchTimeout = setTimeout(renderTickets, 250); });
document.getElementById('topicFilter').addEventListener('change', renderTickets);

function subscribeMessages(ticketId){
  if(unsubMessages[ticketId]) return;
  const q = query(collection(db,'tickets',ticketId,'messages'), orderBy('createdAt','asc'));
  unsubMessages[ticketId] = onSnapshot(q, snap=>{
    const ticket = allTickets.find(t=>t.id===ticketId);
    if(!ticket) return;
    ticket._messages = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(activeTicketId === ticketId){
      const box = document.getElementById('chatMessages');
      const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.innerHTML = buildChat(ticket._messages);
      if(wasAtBottom) scrollChatToBottom();
    }
    renderTickets();
  });
}

async function loadMessages(ticket){
  const snap = await getDocs(query(collection(db,'tickets',ticket.id,'messages'), orderBy('createdAt','asc')));
  ticket._messages = snap.docs.map(d=>({id:d.id, ...d.data()}));
}

async function loadUserOrders(uid){
  try{
    const snap = await getDocs(query(collection(db,'orders'), where('uid','==',uid)));
    userOrders = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .filter(o=>(o.status??0)!==-1)
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  }catch(e){ userOrders = []; }
}

onAuthStateChanged(auth, async user=>{
  if(!user){ window.location.href = '../auth'; return; }
  currentUser = user;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('cabinet').style.display = 'block';

  await loadUserOrders(user.uid);

  const q = query(collection(db,'tickets'), where('uid','==',user.uid), orderBy('createdAt','desc'));
  unsubTickets = onSnapshot(q, async snap=>{
    const incoming = snap.docs.map(d=>({id:d.id, ...d.data()}));
    for(const t of incoming){
      const existing = allTickets.find(x=>x.id===t.id);
      t._messages = existing?._messages || [];
      t._read = existing?._read ?? t._read ?? true;
      if(!t._messages.length) await loadMessages(t);
      subscribeMessages(t.id);
    }
    allTickets = incoming;
    renderTickets();
  });

  const params = new URLSearchParams(window.location.search);
  const preOrderId = params.get('order');
  if(preOrderId && userOrders.some(o=>o.id===preOrderId)){
    openModal();
    setTimeout(()=>{
      selectedOrderId = preOrderId;
      document.querySelectorAll('.order-pick').forEach(r=>r.classList.toggle('selected', r.dataset.id===preOrderId));
    }, 50);
  }
});
</script>
