<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antviz — Статус сервисов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f9fafc;
    --bg-elevated:#f2f4f7;
    --border:#dfe3e8;
    --border-soft:rgba(25,27,30,0.06);
    --text:#191b1e;
    --text-dim:#707a8a;
    --text-faint:#9aa2ad;
    --accent:#1ede7b;
    --accent-hover:#1ac16b;
    --accent-dim:#e8fcf2;
    --accent-line:#d2f8e5;
    --accent-ink:#0e1512;
    --ok:#1ede7b;
    --degraded:#f0b429;
    --partial:#f2924a;
    --major:#e5484d;
    --maint:#3b93e0;
    --radius-lg:40px;
    --radius-md:24px;
    --radius-sm:12px;
    --radius-full:999px;
    --sh1:0 4px 16px rgba(0,51,153,.04),0 2px 2px rgba(0,51,153,.08);
    --sh2:0 22px 46px rgba(15,23,42,.10),0 4px 14px rgba(15,23,42,.05);
    --font-display:'Geologica','Inter','Arial',sans-serif;
    --font-body:'Geologica','Inter','Arial',sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#191b1e;
    --bg-soft:#232629;
    --bg-elevated:#2b2f33;
    --border:rgba(255,255,255,0.09);
    --border-soft:rgba(255,255,255,0.05);
    --text:#f3f4f6;
    --text-dim:#a8adb5;
    --text-faint:#6b7178;
    --accent-dim:rgba(30,222,123,0.12);
    --accent-line:rgba(30,222,123,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg);}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    line-height:1.25;
    letter-spacing:-0.02em;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    transition:background .2s, color .2s;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:840px; margin:0 auto; padding:0 24px;}

  /* Top row: logo + theme toggle only */
  .top-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:36px 0 0;
  }
  .logo-group{
    display:flex; align-items:center;
  }
  .logo-mark{
    height:47px; width:auto; color:var(--text); flex-shrink:0;
  }
  .logo-mark svg{height:100%; width:auto; display:block;}
  .theme-toggle{
    width:40px; height:40px; border-radius:50%;
    border:1px solid var(--border); background:var(--bg-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-dim); transition:border-color .15s, color .15s, background .15s;
  }
  .theme-toggle:hover{color:var(--text); border-color:rgba(128,128,128,0.35);}
  .theme-toggle svg{width:18px; height:18px; display:block;}
  .theme-toggle .icon-moon{display:none;}
  html[data-theme="dark"] .theme-toggle .icon-sun{display:none;}
  html[data-theme="dark"] .theme-toggle .icon-moon{display:block;}

  /* Hero / overall status */
  .hero{
    padding:28px 0 40px;
  }
  .status-banner{
    background:var(--accent-dim);
    border:1px solid var(--accent-line);
    border-radius:var(--radius-lg);
    padding:28px 32px;
    display:flex; align-items:center; justify-content:space-between;
    gap:20px; flex-wrap:wrap;
    box-shadow:var(--sh1);
  }
  .status-banner-left{display:flex; align-items:center; gap:16px;}
  .pulse{
    position:relative; width:16px; height:16px; flex-shrink:0;
  }
  .pulse::before, .pulse::after{
    content:''; position:absolute; inset:0; border-radius:50%; background:var(--ok);
  }
  .pulse::before{animation:pulse-ring 2.2s cubic-bezier(0.4,0,0.6,1) infinite;}
  .pulse::after{transform:scale(0.55);}
  @keyframes pulse-ring{
    0%{transform:scale(0.55); opacity:0.9;}
    70%{transform:scale(2.4); opacity:0;}
    100%{transform:scale(2.4); opacity:0;}
  }
  .status-text h1{
    font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-0.01em;
  }
  .status-text p{color:var(--text-dim); font-size:14px; margin-top:4px;}
  .subscribe-btn{
    background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:14px;
    padding:12px 22px; border-radius:var(--radius-full); border:none; cursor:pointer;
    font-family:var(--font-body); transition:background .15s, transform .15s, box-shadow .15s;
    box-shadow:0 0 0 0 rgba(30,222,123,0);
  }
  .subscribe-btn:hover{background:var(--accent-hover); transform:translateY(-1px); box-shadow:0 6px 20px rgba(30,222,123,0.25);}

  /* Services */
  .section-label{
    font-family:var(--font-display); font-weight:600; font-size:13px;
    text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint);
    margin:44px 0 16px;
  }
  .services{
    border:1px solid var(--border); border-radius:var(--radius-lg);
    background:var(--bg-soft);
    box-shadow:var(--sh1);
  }
  .service-row{
    padding:20px 24px;
    border-bottom:1px solid var(--border-soft);
  }
  .service-row:first-child{border-top-left-radius:var(--radius-lg); border-top-right-radius:var(--radius-lg);}
  .service-row:last-child{border-bottom:none; border-bottom-left-radius:var(--radius-lg); border-bottom-right-radius:var(--radius-lg);}
  .service-top{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .service-name{font-weight:600; font-size:15px;}
  .service-status{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500;}
  .status-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .status-dot.ok{background:var(--ok);}
  .status-dot.degraded{background:var(--degraded);}
  .status-dot.partial{background:var(--partial);}
  .status-dot.major{background:var(--major);}
  .status-dot.maint{background:var(--maint);}
  .status-label.ok{color:var(--ok);}
  .status-label.degraded{color:var(--degraded);}
  .status-label.partial{color:var(--partial);}
  .status-label.major{color:var(--major);}
  .status-label.maint{color:var(--maint);}

  .uptime-bar{
    display:flex; gap:2.5px; margin-top:14px; height:32px; align-items:flex-end;
    width:100%; overflow:hidden;
  }
  .uptime-bar .bar{
    flex:1 1 0; border-radius:3px; position:relative; cursor:default;
    background:var(--ok); height:100%;
  }
  .uptime-bar .bar.degraded{background:var(--degraded);}
  .uptime-bar .bar.partial{background:var(--partial);}
  .uptime-bar .bar.major{background:var(--major);}
  .uptime-bar .bar.maint{background:var(--maint);}
  .uptime-meta{
    display:flex; justify-content:space-between; margin-top:8px;
    font-size:12px; color:var(--text-faint);
  }

  /* Shared floating tooltip (JS-positioned, clamped to viewport) */
  #bar-tooltip{
    position:fixed; z-index:999; background:var(--bg-elevated); border:1px solid var(--border);
    color:var(--text); font-size:11px; padding:6px 10px; border-radius:8px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .1s; transform:translate(-50%,-100%);
  }
  #bar-tooltip.show{opacity:1;}

  /* Incidents */
  .incident-day{margin-bottom:32px;}
  .incident-date{
    font-family:var(--font-display); font-weight:600; font-size:14px;
    color:var(--text-dim); margin-bottom:12px;
  }
  .incident-card{
    border:1px solid var(--border); border-radius:var(--radius-md);
    padding:20px 22px; background:var(--bg-soft); margin-bottom:12px;
  }
  .incident-header{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .incident-title{font-weight:600; font-size:15px;}
  .incident-badge{
    font-size:11px; font-weight:600; padding:4px 10px; border-radius:var(--radius-full);
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .incident-badge.resolved{background:rgba(30,222,123,0.12); color:var(--ok);}
  .incident-badge.major{background:rgba(242,86,91,0.12); color:var(--major);}
  .incident-badge.maint{background:rgba(74,168,245,0.12); color:var(--maint);}
  .timeline{margin-top:16px; padding-left:2px;}
  .timeline-item{
    display:flex; gap:14px; padding-bottom:14px; position:relative;
  }
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-item::before{
    content:''; position:absolute; left:4px; top:16px; bottom:-2px; width:1px;
    background:var(--border);
  }
  .timeline-item:last-child::before{display:none;}
  .timeline-dot{
    width:9px; height:9px; border-radius:50%; background:var(--text-faint);
    flex-shrink:0; margin-top:5px; position:relative; z-index:1;
  }
  .timeline-item.resolved .timeline-dot{background:var(--ok);}
  .timeline-content p{font-size:13.5px; color:var(--text-dim); line-height:1.55;}
  .timeline-content .t-label{font-weight:600; color:var(--text); font-size:13.5px;}
  .timeline-time{font-size:11.5px; color:var(--text-faint); margin-top:2px;}

  .placeholder-note{
    font-size:12.5px; color:var(--text-faint); margin-top:24px; padding:14px 18px;
    border:1px dashed var(--border); border-radius:var(--radius-sm); line-height:1.6;
  }

  .admin-card{
    border:1.5px dashed var(--accent-line); border-radius:var(--radius-md);
    padding:20px 22px; background:var(--accent-dim);
  }
  .admin-tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .admin-tab{
    font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--text-dim);
    background:var(--bg-soft); border:1px solid var(--border); border-radius:var(--radius-full);
    padding:8px 16px; cursor:pointer; transition:background .12s, color .12s;
  }
  .admin-tab.active{background:var(--text); color:var(--bg);}
  .admin-form{display:flex; flex-direction:column; gap:4px;}
  .admin-form label{font-size:12.5px; color:var(--text-dim); margin-top:10px; font-weight:500;}
  .admin-form input[type="text"], .admin-form select, .admin-form textarea{
    width:100%; background:var(--bg-soft); border:1px solid var(--border); color:var(--text);
    padding:10px 14px; border-radius:var(--radius-sm); font-size:14px; font-family:var(--font-body);
    outline:none; resize:vertical;
  }
  .admin-form input[type="text"]:focus, .admin-form select:focus, .admin-form textarea:focus{border-color:var(--accent-line);}
  .admin-submit{
    margin-top:16px; align-self:flex-start; background:var(--accent); color:var(--accent-ink);
    font-family:var(--font-body); font-weight:600; font-size:14px; border:none; cursor:pointer;
    padding:11px 20px; border-radius:var(--radius-full); transition:background .15s;
  }
  .admin-submit:hover{background:var(--accent-hover);}


  .page-end-spacer{height:56px;}

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,7,6,0.7); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:50;
    opacity:0; pointer-events:none; transition:opacity .18s;
    padding:20px;
  }
  .modal-overlay.open{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:32px; max-width:400px; width:100%;
    transform:translateY(8px) scale(0.98); transition:transform .18s;
  }
  .modal-overlay.open .modal{transform:translateY(0) scale(1);}
  .modal h2{font-family:var(--font-display); font-size:19px; font-weight:700; margin-bottom:8px;}
  .modal p{font-size:13.5px; color:var(--text-dim); margin-bottom:20px; line-height:1.5;}
  .modal input{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:13px 16px; border-radius:var(--radius-sm); font-size:14px; font-family:var(--font-body);
    margin-bottom:14px; outline:none; transition:border-color .15s;
  }
  .modal input:focus{border-color:var(--accent-line);}
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{
    font-family:var(--font-body); font-size:14px; font-weight:600; padding:12px 18px;
    border-radius:var(--radius-full); border:none; cursor:pointer; flex:1;
  }
  .btn-cancel{background:transparent; border:1px solid var(--border) !important; color:var(--text-dim);}
  .btn-cancel:hover{color:var(--text); border-color:rgba(128,128,128,0.35) !important;}
  .btn-confirm{background:var(--accent); color:var(--accent-ink);}
  .btn-confirm:hover{background:var(--accent-hover); transform:translateY(-1px);}
  .modal-success{display:none; text-align:center; padding:8px 0;}
  .modal-success.show{display:block;}
  .modal-success .check{
    width:44px; height:44px; border-radius:50%; background:var(--accent-dim); border:1px solid var(--accent-line);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px; color:var(--accent); font-size:20px;
  }
  .modal-form.hidden{display:none;}

  @media (max-width:600px){
    .hero{padding:24px 0 28px;}
    .status-banner{padding:22px 20px;}
    .subscribe-btn{width:100%;}
    .status-banner-left{width:100%;}
    .uptime-bar{gap:1.5px;}
    .logo-mark{height:38px;}
  }

  @media (max-width:360px){
    .uptime-bar{gap:1px;}
  }

  @media (prefers-reduced-motion: reduce){
    .pulse::before{animation:none;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="top-row">
    <div class="logo-group">
      <div class="logo-mark" id="logo-mark"></div>
    </div>
    <button class="theme-toggle" id="theme-toggle" title="Сменить тему" aria-label="Сменить тему">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"></path></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2a8.4 8.4 0 0 1-10.7-10.7 8.4 8.4 0 1 0 10.7 10.7z"></path></svg>
    </button>
  </div>

  <div class="hero">
    <div class="status-banner">
      <div class="status-banner-left">
        <div class="pulse"></div>
        <div class="status-text">
          <h1>Все системы работают</h1>
          <p id="last-updated">Обновлено только что</p>
        </div>
      </div>
      <button class="subscribe-btn" onclick="openModal()">Подписаться на обновления</button>
    </div>
  </div>

  <div class="section-label">Сервисы</div>
  <div class="services" id="services">
    <!-- rows injected by JS -->
  </div>

  <div class="section-label">История инцидентов</div>
  <div id="incidents">
    <div class="incidents-empty" id="incidents-empty" style="display:none; color:var(--text-faint); font-size:14px; padding:8px 4px;">Пока не было ни одного инцидента.</div>
  </div>

  <div class="admin-panel" id="admin-panel" style="display:none;"></div>

  <div class="page-end-spacer"></div>

</div>

<div id="bar-tooltip"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-form" id="modal-form">
      <h2>Подписаться на обновления</h2>
      <p>Будем присылать письмо при изменении статуса сервисов и новых инцидентах.</p>
      <input type="email" id="sub-email" placeholder="you@example.com">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Отмена</button>
        <button class="btn-confirm" onclick="confirmSubscribe()">Подписаться</button>
      </div>
    </div>
    <div class="modal-success" id="modal-success">
      <div class="check">✓</div>
      <h2>Готово</h2>
      <p>Мы отправим письмо на указанный адрес при изменении статуса.</p>
      <div class="modal-actions">
        <button class="btn-confirm" style="flex:none; width:100%;" onclick="closeModal()">Понятно</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ---- Logo (provided mark + "Статус" appended as real outlined vector paths — same
  //      display face as the rest of the page (Geologica Bold), NOT live <text>.
  //      Note: the "Antviz" mark itself is custom-drawn artwork, not set type, so an
  //      exact stylistic match isn't possible — this uses the site's own type system

  document.getElementById('logo-mark').innerHTML = LOGO_SVG;

  // ---- API ----
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:3000/api'
    : 'https://antviz.ru/api';

  // ---- Theme toggle (persisted) ----
  const root = document.documentElement;
  function applyTheme(theme){
    if(theme === 'dark'){ root.setAttribute('data-theme', 'dark'); }
    else{ root.removeAttribute('data-theme'); }
    localStorage.setItem('antviz-status-theme', theme);
  }
  applyTheme(localStorage.getItem('antviz-status-theme') || 'light');
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  const statusLabels = {
    ok: 'Работает', degraded: 'Замедление', partial: 'Частичный сбой',
    major: 'Недоступен', maint: 'Плановые работы'
  };
  const overallLabels = {
    ok: 'Все системы работают', degraded: 'Наблюдается замедление',
    maint: 'Идут плановые работы', partial: 'Частичный сбой сервисов', major: 'Серьёзные перебои в работе'
  };
  const incidentBadgeLabels = {
    investigating: 'Расследуем', identified: 'Причина найдена',
    monitoring: 'Наблюдаем', resolved: 'Устранено'
  };
  const severityBadgeClass = { degraded: 'maint', partial: 'major', major: 'major', maint: 'maint' };

  // ---- Shared floating tooltip for uptime bars, clamped to viewport ----
  const tooltip = document.getElementById('bar-tooltip');
  document.addEventListener('mouseover', (e) => {
    const bar = e.target.closest('.bar');
    if(!bar) return;
    tooltip.textContent = bar.getAttribute('data-tip');
    tooltip.classList.add('show');
    positionTooltip(bar);
  });
  document.addEventListener('mouseout', (e) => {
    if(e.target.closest('.bar')) tooltip.classList.remove('show');
  });
  function positionTooltip(bar){
    const rect = bar.getBoundingClientRect();
    const tw = tooltip.offsetWidth || 100;
    let left = rect.left + rect.width / 2;
    const margin = 8;
    left = Math.max(tw / 2 + margin, Math.min(left, window.innerWidth - tw / 2 - margin));
    tooltip.style.left = left + 'px';
    tooltip.style.top = (rect.top - 8) + 'px';
  }

  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function buildUptimeBarHtml(days){
    return days.map((d, idx) => {
      const daysAgo = days.length - 1 - idx;
      let cls = 'ok', tip;
      if(d.ok === null){ cls = 'ok'; tip = daysAgo === 0 ? 'Сегодня — нет данных' : `${daysAgo} дн. назад — нет данных`; }
      else if(d.ok){ tip = daysAgo === 0 ? 'Сегодня — норма' : `${daysAgo} дн. назад — норма`; }
      else { cls = 'major'; tip = daysAgo === 0 ? 'Сегодня — сбой' : `${daysAgo} дн. назад — сбой`; }
      return `<div class="bar ${cls}" data-tip="${esc(tip)}"></div>`;
    }).join('');
  }

  function renderServices(services){
    const container = document.getElementById('services');
    container.innerHTML = '';
    services.forEach(s => {
      const row = document.createElement('div');
      row.className = 'service-row';
      const uptimeLabel = s.uptimePct === null ? 'нет данных' : `${s.uptimePct}% за 90 дней`;
      row.innerHTML = `
        <div class="service-top">
          <div class="service-name">${esc(s.name)}</div>
          <div class="service-status">
            <span class="status-dot ${s.status}"></span>
            <span class="status-label ${s.status}">${statusLabels[s.status] || s.status}</span>
          </div>
        </div>
        <div class="uptime-bar">${buildUptimeBarHtml(s.days)}</div>
        <div class="uptime-meta">
          <span>90 дней назад</span>
          <span>${uptimeLabel}</span>
          <span>Сегодня</span>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function fmtDate(iso){
    return new Date(iso).toLocaleString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function fmtTime(iso){
    return new Date(iso).toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ' MSK';
  }

  function renderIncidents(incidents){
    const box = document.getElementById('incidents');
    const empty = document.getElementById('incidents-empty');
    box.querySelectorAll('.incident-day').forEach(el => el.remove());

    if(incidents.length === 0){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    // группируем подряд идущие инциденты одного календарного дня под одним заголовком
    let lastDay = null, dayWrap = null;
    incidents.forEach(inc => {
      const dayKey = fmtDate(inc.createdAt);
      if(dayKey !== lastDay){
        dayWrap = document.createElement('div');
        dayWrap.className = 'incident-day';
        dayWrap.innerHTML = `<div class="incident-date">${esc(dayKey)}</div>`;
        box.appendChild(dayWrap);
        lastDay = dayKey;
      }
      const badgeClass = inc.status === 'resolved' ? 'resolved' : (severityBadgeClass[inc.severity] || 'maint');
      const card = document.createElement('div');
      card.className = 'incident-card';
      card.innerHTML = `
        <div class="incident-header">
          <div class="incident-title">${esc(inc.title)}${inc.serviceName ? ` — ${esc(inc.serviceName)}` : ''}</div>
          <div class="incident-badge ${badgeClass}">${incidentBadgeLabels[inc.status] || inc.status}</div>
        </div>
        <div class="timeline">
          ${inc.updates.slice().reverse().map(u => `
            <div class="timeline-item resolved">
              <div class="timeline-dot"></div>
              <div class="timeline-content">
                <p class="t-label">${incidentBadgeLabels[u.status] || u.status}</p>
                <p>${esc(u.message)}</p>
                <p class="timeline-time">${fmtTime(u.createdAt)}</p>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      dayWrap.appendChild(card);
    });
  }

  let currentServices = [];

  // silent=true пропускает перерисовку админ-панели — используется для фонового
  // автообновления раз в минуту, чтобы не затирать форму, если админ прямо сейчас
  // что-то там заполняет (именно это раньше "само снимало" галочку override).
  async function loadStatus(silent){
    try{
      const resp = await fetch(`${API_BASE}/status`);
      if(!resp.ok) throw new Error('bad response');
      const data = await resp.json();

      currentServices = data.services;
      document.querySelector('.status-text h1').textContent = overallLabels[data.overall] || overallLabels.ok;
      document.getElementById('last-updated').textContent =
        'Обновлено ' + new Date(data.updatedAt).toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'long' });

      renderServices(data.services);
      renderIncidents(data.incidents);
      lastIncidentsForAdmin = data.incidents;
      if(!silent) renderAdminPanel(); // перерисовываем только после явного действия админа, не в фоне
    } catch(err){
      console.error('Не удалось загрузить статус:', err);
      document.querySelector('.status-text h1').textContent = 'Не удалось загрузить статус';
      document.getElementById('last-updated').textContent = 'Попробуйте обновить страницу';
    }
  }

  loadStatus();
  setInterval(() => loadStatus(true), 60 * 1000); // фон: только данные, без перерисовки форм админки

  // ---- Подписка (реальный POST на сервер) ----
  function openModal(){
    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('modal-form').classList.remove('hidden');
    document.getElementById('modal-success').classList.remove('show');
    document.getElementById('sub-email').style.borderColor = '';
  }
  function closeModal(){
    document.getElementById('modal-overlay').classList.remove('open');
  }
  async function confirmSubscribe(){
    const emailInput = document.getElementById('sub-email');
    const email = emailInput.value.trim();
    if(!email || !email.includes('@')){
      emailInput.style.borderColor = 'var(--major)';
      return;
    }
    const btn = document.querySelector('.btn-confirm');
    const originalText = btn.textContent;
    btn.textContent = 'Отправляем…';
    btn.disabled = true;
    try{
      const resp = await fetch(`${API_BASE}/status/subscribe`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error || 'Не удалось подписаться');
      document.getElementById('modal-form').classList.add('hidden');
      document.getElementById('modal-success').classList.add('show');
    } catch(err){
      emailInput.style.borderColor = 'var(--major)';
      alert(err.message || 'Не удалось подписаться, попробуйте позже');
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if(e.target.id === 'modal-overlay') closeModal();
  });

  // ════════════════════════════════════════════════════════════
  // Админ-панель: видна только если ты залогинен в аккаунт с ролью
  // admin (проверяем через ту же cookie-сессию, что и на остальном
  // сайте, GET /api/auth/me). Отсюда можно завести инцидент, добавить
  // обновление в таймлайн или поменять статус сервиса вручную —
  // без захода в базу.
  // ════════════════════════════════════════════════════════════
  let isAdmin = false;

  async function checkAdmin(){
    try{
      const resp = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
      if(!resp.ok) return;
      const me = await resp.json();
      isAdmin = me.role === 'admin';
      if(isAdmin){
        await loadAdminServicesRaw();
        renderAdminPanel();
      }
    } catch(err){
      // не залогинен / нет доступа к API с этого домена — просто не показываем панель
    }
  }
  checkAdmin();

  let adminServicesRaw = [];
  async function loadAdminServicesRaw(){
    try{
      const resp = await fetch(`${API_BASE}/status/services`, { credentials: 'include' });
      if(resp.ok) adminServicesRaw = await resp.json();
    } catch(err){ /* тихо, панель просто покажет пусто */ }
  }

          <select id="src-service">
            ${adminServicesRaw.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
          </select>
          <label>Тип проверки</label>
          <select id="src-type">
            <option value="http">HTTP GET по адресу</option>
            <option value="telegram_webhook">Telegram-бот (getWebhookInfo, без URL)</option>
          </select>
          <label>URL проверки (для типа «HTTP»)</label>
          <input type="text" id="src-url" placeholder="https://example.com/api/health">
          <label>Доп. заголовки JSON (необязательно — например для Vercel Protection Bypass)</label>
          <textarea id="src-headers" rows="2" placeholder='{"x-vercel-protection-bypass": "..."}'></textarea>
          <button type="submit" class="admin-submit">Сохранить источник проверки</button>
        </form>

        <form id="admin-delete-form" class="admin-form" style="display:none;">
          <label>Инцидент</label>
          <select id="del-incident">
            ${allIncidentsOptions()}
          </select>
          <button type="submit" class="admin-submit" style="background:var(--major);">Удалить безвозвратно</button>
        </form>

        <div id="admin-msg" style="font-size:13px; margin-top:4px;"></div>
      </div>
    `;

    panel.querySelectorAll('.admin-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        panel.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        panel.querySelector('#admin-incident-form').style.display = tab.dataset.tab === 'incident' ? 'flex' : 'none';
        panel.querySelector('#admin-update-form').style.display = tab.dataset.tab === 'update' ? 'flex' : 'none';
        panel.querySelector('#admin-service-form').style.display = tab.dataset.tab === 'service' ? 'flex' : 'none';
        panel.querySelector('#admin-sources-form').style.display = tab.dataset.tab === 'sources' ? 'flex' : 'none';
        panel.querySelector('#admin-delete-form').style.display = tab.dataset.tab === 'delete' ? 'flex' : 'none';
      });
    });

    function showMsg(text, ok){
      const el = panel.querySelector('#admin-msg');
      el.textContent = text;
      el.style.color = ok ? 'var(--accent)' : 'var(--major)';
    }

    async function adminPost(path, body, method = 'POST'){
      const resp = await fetch(`${API_BASE}${path}`, {
        method,
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error || 'Ошибка');
      return data;
    }

    panel.querySelector('#admin-incident-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try{
        await adminPost('/status/incidents', {
          title: panel.querySelector('#ai-title').value,
          serviceId: panel.querySelector('#ai-service').value || null,
          severity: panel.querySelector('#ai-severity').value,
          message: panel.querySelector('#ai-message').value,
        });
        showMsg('Инцидент создан, подписчики уведомлены.', true);
        e.target.reset();
        loadStatus();
      } catch(err){ showMsg(err.message, false); }
    });

    panel.querySelector('#admin-update-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const incidentId = panel.querySelector('#au-incident').value;
      if(!incidentId){ showMsg('Нет открытых инцидентов для обновления.', false); return; }
      try{
        await adminPost(`/status/incidents/${incidentId}/updates`, {
          status: panel.querySelector('#au-status').value,
          message: panel.querySelector('#au-message').value,
        });
        showMsg('Обновление добавлено, подписчики уведомлены.', true);
        e.target.reset();
        loadStatus();
      } catch(err){ showMsg(err.message, false); }
    });

    panel.querySelector('#admin-service-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const serviceId = panel.querySelector('#as-service').value;
      try{
        await adminPost(`/status/services/${serviceId}`, {
          status: panel.querySelector('#as-status').value,
          manualOverride: panel.querySelector('#as-override').checked,
        }, 'PATCH');
        showMsg('Статус сервиса обновлён.', true);
        loadStatus();
      } catch(err){ showMsg(err.message, false); }
    });

    // Подставляем РЕАЛЬНОЕ текущее состояние сервиса при выборе — раньше форма всегда
    // открывалась с "Работает" + снятой галочкой, из-за чего повторная отправка
    // случайно стирала ранее включённый manualOverride, даже если его не трогали.
    const asServiceSelect = panel.querySelector('#as-service');
    function fillServiceForm(){
      const s = currentServices.find(x => x.id === asServiceSelect.value);
      if(!s) return;
      panel.querySelector('#as-status').value = s.status;
      panel.querySelector('#as-override').checked = !!s.manualOverride;
      panel.querySelector('#as-current-hint').textContent =
        s.manualOverride ? 'Сейчас статус зафиксирован вручную.' : 'Сейчас статус выставляет автопроверка.';
    }
    asServiceSelect.addEventListener('change', fillServiceForm);
    if(currentServices.length) fillServiceForm();

    // При выборе сервиса в «Источниках проверки» — подставляем его текущие значения
    const srcServiceSelect = panel.querySelector('#src-service');
    function fillSourceForm(){
      const s = adminServicesRaw.find(x => x.id === srcServiceSelect.value);
      if(!s) return;
      panel.querySelector('#src-type').value = s.check_type || 'http';
      panel.querySelector('#src-url').value = s.check_url || '';
      panel.querySelector('#src-headers').value = s.check_headers ? JSON.stringify(s.check_headers) : '';
    }
    srcServiceSelect.addEventListener('change', fillSourceForm);
    if(adminServicesRaw.length) fillSourceForm();

    panel.querySelector('#admin-sources-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const serviceId = srcServiceSelect.value;
      let headers = null;
      const rawHeaders = panel.querySelector('#src-headers').value.trim();
      if(rawHeaders){
        try{ headers = JSON.parse(rawHeaders); }
        catch(err){ showMsg('Заголовки должны быть валидным JSON, например {"x-key":"value"}', false); return; }
      }
      try{
        await adminPost(`/status/services/${serviceId}`, {
          checkType: panel.querySelector('#src-type').value,
          checkUrl: panel.querySelector('#src-url').value || null,
          checkHeaders: headers,
        }, 'PATCH');
        showMsg('Источник проверки сохранён. Изменения подхватятся в следующем цикле (раз в 5 минут).', true);
        await loadAdminServicesRaw();
      } catch(err){ showMsg(err.message, false); }
    });

    panel.querySelector('#admin-delete-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const incidentId = panel.querySelector('#del-incident').value;
      if(!incidentId){ showMsg('Нечего удалять.', false); return; }
      if(!confirm('Удалить инцидент безвозвратно? Отменить будет нельзя.')) return;
      try{
        await adminPost(`/status/incidents/${incidentId}`, {}, 'DELETE');
        showMsg('Инцидент удалён.', true);
        loadStatus();
      } catch(err){ showMsg(err.message, false); }
    });
  }

  let lastIncidentsForAdmin = [];
  function currentIncidentsOptions(){
    if(lastIncidentsForAdmin.length === 0) return '<option value="">— нет инцидентов —</option>';
    return lastIncidentsForAdmin
      .filter(i => i.status !== 'resolved')
      .map(i => `<option value="${i.id}">${esc(i.title)}</option>`)
      .join('') || '<option value="">— все инциденты устранены —</option>';
  }
  function allIncidentsOptions(){
    if(lastIncidentsForAdmin.length === 0) return '<option value="">— нет инцидентов —</option>';
    return lastIncidentsForAdmin
      .map(i => `<option value="${i.id}">${esc(i.title)} (${incidentBadgeLabels[i.status] || i.status})</option>`)
      .join('');
  }
</script>

</body>
</html>
