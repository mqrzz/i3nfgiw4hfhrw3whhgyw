<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Вход… — Antviz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#191b1e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .box{text-align:center;padding:32px}
  .spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.15);border-top-color:#1ede7b;border-radius:50%;margin:0 auto 20px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  p{color:rgba(255,255,255,.6);font-size:15px;margin:0}
  .btn{display:inline-block;margin-top:20px;padding:12px 24px;background:#1ede7b;color:#111;border-radius:12px;text-decoration:none;font-weight:500;font-size:14px}
</style>
</head>
<body>
  <div class="box">
    <div class="spin" id="spin"></div>
    <p id="msg">Входим в аккаунт…</p>
    <div id="fallback" style="display:none"></div>
  </div>

<script type="module">
import { auth } from './firebase-config.js';
import { onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const EXCHANGE_URL = 'https://3ssqztgbot22wsq.vercel.app/api/exchange-app-token';

const params = new URLSearchParams(location.search);
const code = params.get('t');
const to = params.get('to') || 'https://antviz.ru/profile.html';
const msgEl = document.getElementById('msg');
const spinEl = document.getElementById('spin');
const fallbackEl = document.getElementById('fallback');

function fail(text){
  spinEl.style.display='none';
  msgEl.textContent = text;
  fallbackEl.style.display='block';
  fallbackEl.innerHTML = `<a class="btn" href="${to}">Открыть кабинет</a>`;
}

async function exchangeAndSignIn(){
  if(!code){ fail('Ссылка неполная — откройте кабинет и войдите обычным способом.'); return; }
  try{
    const r = await fetch(EXCHANGE_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code })
    });
    if(!r.ok) throw new Error('exchange failed: ' + r.status);
    const data = await r.json();
    if(!data.customToken) throw new Error('no customToken');
    await signInWithCustomToken(auth, data.customToken);
    window.location.replace(to);
  }catch(e){
    console.error('tg-enter error:', e);
    fail('Не получилось войти автоматически — ссылка могла устареть. Откройте кабинет и войдите обычным способом.');
  }
}

// ГЛАВНОЕ: если в этом Telegram-браузере уже есть действующая сессия (заходили
// отсюда раньше) — сразу переходим дальше, без единого запроса к серверу.
// Обмен кода на вход идёт в сеть (Vercel + Firestore + Firebase) только один
// раз, при самом первом заходе — все следующие нажатия кнопок в боте открывают
// кабинет мгновенно, локально, без сети.
let decided = false;
onAuthStateChanged(auth, user => {
  if(decided) return;
  decided = true;
  if(user){
    window.location.replace(to);
  }else{
    exchangeAndSignIn();
  }
});
</script>
</body>
</html>
