<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Вход… — Antviz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#191b1e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .box{text-align:center;padding:32px}
  .spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.15);border-top-color:#1ede7b;border-radius:50%;margin:0 auto 20px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  p{color:rgba(255,255,255,.6);font-size:15px;margin:0}
  .btn{display:inline-block;margin-top:20px;padding:12px 24px;background:#1ede7b;color:#111;border-radius:12px;text-decoration:none;font-weight:500;font-size:14px}
</style>
</head>
<body>
  <div class="box">
    <div class="spin" id="spin"></div>
    <p id="msg">Входим в аккаунт…</p>
    <div id="fallback" style="display:none"></div>
  </div>

<script type="module">
// ВАЖНО: раньше эта страница была целиком на Firebase (signInWithCustomToken) —
// это НЕ создавало cookie-сессию нового бэкенда, и вход по кнопке из бота
// физически не работал никогда, даже до всех остальных правок в этом чате.
// Теперь всё просто: одна проверка "уже залогинен?" + один обмен кода на
// сессию, оба запроса — напрямую на antviz.ru/api (свой же домен, никакого
// моста через Vercel не нужно, в отличие от оплаты).

const API = 'https://antviz.ru/api';
const params = new URLSearchParams(location.search);
const code = params.get('t');
const to = params.get('to') || 'https://antviz.ru/profile.html';
const msgEl = document.getElementById('msg');
const spinEl = document.getElementById('spin');
const fallbackEl = document.getElementById('fallback');

function fail(text){
  spinEl.style.display='none';
  msgEl.textContent = text;
  fallbackEl.style.display='block';
  fallbackEl.innerHTML = `<a class="btn" href="${to}">Открыть кабинет</a>`;
}

async function alreadyLoggedIn(){
  try{
    const r = await fetch(`${API}/auth/me`, { credentials:'include' });
    return r.ok;
  }catch(e){ return false; }
}

async function exchangeCode(){
  if(!code){ fail('Ссылка неполная — откройте кабинет и войдите обычным способом.'); return false; }
  try{
    const r = await fetch(`${API}/auth/bot-login`, {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code })
    });
    if(!r.ok){
      const d = await r.json().catch(()=>({}));
      throw new Error(d.error || ('bot-login failed: ' + r.status));
    }
    return true;
  }catch(e){
    console.error('tg-enter error:', e);
    return false;
  }
}

(async function init(){
  if(await alreadyLoggedIn()){
    window.location.replace(to);
    return;
  }
  if(await exchangeCode()){
    window.location.replace(to);
  }else{
    fail('Не получилось войти автоматически — ссылка могла устареть (действует 3 минуты). Откройте кабинет и войдите обычным способом, либо нажмите кнопку в боте ещё раз.');
  }
})();
</script>
</body>
</html>
